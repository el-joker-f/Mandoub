<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | متابعة الطلب</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#020d18;color:#fff}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:22px;margin:18px 0}.status{font-size:24px;font-weight:900;color:#00dfff}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #16415e}.items{margin-top:12px}.muted{color:#91a4b3}.btn{display:block;text-align:center;text-decoration:none;background:#00dfff;color:#00131e;padding:13px;border-radius:12px;font-weight:900;margin-top:15px}.proof{max-width:100%;max-height:350px;border-radius:14px;margin-top:12px}</style></head><body><div class="wrap"><h1>📦 متابعة الطلب</h1><div id="app" class="card">جاري تحميل الطلب...</div><a class="btn" href="restaurants.html">العودة للمطاعم</a></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyB6-RVH7-8NrN-AaOOv6Qj9APDeyj7oIU',authDomain:'mandoub-dv.firebaseapp.com',projectId:'mandoub-dv',storageBucket:'mandoub-dv.firebasestorage.app',messagingSenderId:'311140400335',appId:'1:311140400335:web:db198b7c53259c53594bba',measurementId:'G-7V1LJQYYXD'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const id=new URLSearchParams(location.search).get('order')||localStorage.getItem('mandoub_last_order_id');const el=document.getElementById('app');onAuthStateChanged(auth,async u=>{if(!u){el.innerHTML='❌ يجب تسجيل الدخول لمتابعة الطلب.';return}if(!id){el.innerHTML='❌ لم يتم العثور على رقم الطلب.';return}try{const s=await getDoc(doc(db,'orders',id));if(!s.exists()){el.innerHTML='❌ الطلب غير موجود.';return}const o=s.data();if(o.customerId!==u.uid){el.innerHTML='❌ لا يمكنك مشاهدة هذا الطلب.';return}const items=(o.items||[]).map(x=>`<div class="row"><span>${x.name} × ${x.quantity}</span><b>${(x.price*x.quantity).toLocaleString('ar-EG')} ج</b></div>`).join('');const ps=o.paymentStatus||'غير محدد';el.innerHTML=`<div class="status">${o.status||'جديد'}</div><p class="muted">رقم الطلب: <b>${id}</b></p><div class="row"><span>المطعم</span><b>${o.restaurantName||'—'}</b></div><div class="row"><span>العميل</span><b>${o.customerName||'—'}</b></div><div class="row"><span>الهاتف</span><b>${o.customerPhone||'—'}</b></div><div class="row"><span>العنوان</span><b>${o.customerAddress||'—'}</b></div><div class="row"><span>الدفع</span><b>${o.paymentMethod==='cash'?'كاش':o.paymentMethod==='wallet'?'محفظة':'InstaPay'}</b></div><div class="row"><span>حالة الدفع</span><b>${ps}</b></div><div class="items"><h3>المنتجات</h3>${items}</div><div class="row"><span>المنتجات</span><b>${(o.subtotal||0).toLocaleString('ar-EG')} ج</b></div><div class="row"><span>التوصيل</span><b>${(o.deliveryFee||0).toLocaleString('ar-EG')} ج</b></div><div class="row"><span>الخصم ${o.discountPercent?`(${o.discountPercent}%)`:''}</span><b>-${(o.discountValue||0).toLocaleString('ar-EG')} ج</b></div><div class="row"><span>الإجمالي</span><b>${(o.total||0).toLocaleString('ar-EG')} ج</b></div>${o.paymentProof?`<h3>إثبات التحويل</h3><img class="proof" src="${o.paymentProof}" alt="إثبات التحويل">`:''}` }catch(e){console.error(e);el.innerHTML='❌ تعذر تحميل الطلب.'}});</script></body></html>
