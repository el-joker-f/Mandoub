<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | متابعة الطلب</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#020d18;color:#fff}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:22px;margin:18px 0}.status{font-size:24px;font-weight:900;color:#00dfff}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #16415e}.items{margin-top:12px}.muted{color:#91a4b3}.btn{display:block;text-align:center;text-decoration:none;background:#00dfff;color:#00131e;padding:13px;border-radius:12px;font-weight:900;margin-top:15px}.tracking{display:flex;gap:8px;margin:12px 0}.tracking input{flex:1;padding:13px;border-radius:12px;border:2px solid #21445f;background:#031321;color:#fff;font-size:18px;text-align:center;text-transform:uppercase}.tracking button{border:0;border-radius:12px;padding:13px 18px;background:#00dfff;color:#00131e;font-weight:900;cursor:pointer}.code{font-size:24px;font-weight:900;letter-spacing:2px;text-align:center;color:#00dfff;background:#031321;border:1px dashed #00dfff;border-radius:14px;padding:14px;margin:12px 0}.hint{line-height:1.8;background:#102c42;border-radius:12px;padding:12px}.proof{max-width:100%;max-height:350px;border-radius:14px;margin-top:12px}@media(max-width:600px){.tracking{flex-direction:column}.tracking button{width:100%}}</style></head><body><div class="wrap"><h1>📦 متابعة الطلب</h1><div class="card"><h2>🔎 أدخل رقم المتابعة</h2><div class="tracking"><input id="trackingInput" maxlength="12" placeholder="MND-XXXXXXXX" autocomplete="off"><button id="trackBtn">متابعة</button></div><p class="muted">رقم المتابعة يظهر لك بعد تأكيد الطلب. لا تحتاج لتسجيل الدخول لمتابعة الطلب.</p></div><div id="app" class="card">أدخل رقم المتابعة لعرض حالة الطلب.</div><a class="btn" href="restaurants.html">العودة للمطاعم</a></div><script type="module">import{db}from'./auth.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const el=document.getElementById('app'),input=document.getElementById('trackingInput'),button=document.getElementById('trackBtn');function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function money(n){return Number(n||0).toLocaleString('ar-EG')+' ج'}function clean(v){return String(v||'').trim().toUpperCase().replace(/[^A-Z0-9-]/g,'')}function render(o,code){const items=(o.items||[]).map(x=>`<div class="row"><span>${esc(x.name||'منتج')} × ${Number(x.quantity||1)}</span><b>${money((Number(x.price)||0)*(Number(x.quantity)||1))}</b></div>`).join('')||'<p class="muted">لا توجد منتجات.</p>';el.innerHTML=`<div class="status">${esc(o.status||'جديد')}</div><div class="code">${esc(code)}</div><p class="hint">احتفظ برقم المتابعة <b>${esc(code)}</b> واستخدمه في أي وقت لمعرفة حالة طلبك.</p><div class="row"><span>المطعم</span><b>${esc(o.restaurantName||'—')}</b></div><div class="items"><h3>المنتجات</h3>${items}</div><div class="row"><span>سعر المنتجات</span><b>${money(o.subtotal)}</b></div><div class="row"><span>التوصيل</span><b>${money(o.deliveryFee)}</b></div><div class="row"><span>الإجمالي</span><b>${money(o.total)}</b></div>`}async function load(code){code=clean(code);if(!code){el.innerHTML='❌ اكتب رقم المتابعة أولًا.';return}el.textContent='جاري البحث عن الطلب...';try{const s=await getDoc(doc(db,'publicOrders',code));if(!s.exists()){el.innerHTML='❌ رقم المتابعة غير صحيح أو الطلب غير موجود.';return}const o=s.data();if(o.public!==true){el.innerHTML='❌ تعذر الوصول إلى الطلب.';return}render(o,code)}catch(e){console.error(e);el.innerHTML='❌ تعذر تحميل الطلب. حاول مرة أخرى.'}}button.onclick=()=>load(input.value);input.onkeydown=e=>{if(e.key==='Enter')load(input.value)};const params=new URLSearchParams(location.search);const initial=params.get('tracking')||localStorage.getItem('mandoub_last_tracking_code');if(initial){input.value=clean(initial);load(initial)}</script></body></html>
