<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | الدفع وتأكيد الطلب</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#020d18;color:#fff}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:22px;margin:16px 0}.summary div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #16415e}.grand{font-size:21px}.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.method{border:2px solid #21445f;background:#031321;color:#fff;border-radius:14px;padding:12px;cursor:pointer;text-align:center}.method.active{border-color:#00dfff;background:#09283d}.method img{width:100%;height:70px;object-fit:contain;background:#020d18;border-radius:9px;margin-bottom:7px}.proof{display:none;margin-top:15px}.proof.show{display:block}.field{margin:12px 0}.field label{display:block;margin-bottom:7px}.field input{width:100%;padding:12px;border-radius:12px;border:2px solid #21445f;background:#031321;color:#fff}.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:900;cursor:pointer;width:100%}.primary{background:#00dfff;color:#00131e}.primary:disabled{opacity:.45}.notice{background:#102c42;border-radius:12px;padding:12px;line-height:1.9}.muted{color:#91a4b3}.ok{color:#7ff0a8;font-weight:800}.receiver{font-size:20px;color:#00dfff;direction:ltr;text-align:center;margin:10px 0;padding:10px;background:#031321;border-radius:10px}.wallet-image{width:100%;max-width:520px;height:120px;object-fit:contain;display:block;margin:10px auto;background:#031321;border-radius:14px;padding:8px}@media(max-width:600px){.methods{grid-template-columns:1fr}.wallet-image{height:100px}}</style></head><body><div class="wrap"><h1>💳 الدفع وتأكيد الطلب</h1><p class="muted">اختر طريقة الدفع ثم أكّد الطلب.</p><div class="card"><h2>ملخص الطلب</h2><div id="summary"></div></div><div class="card"><h2>💰 طريقة الدفع</h2><div class="methods"><button class="method" data-m="cash" onclick="choose('cash')">💵<br>كاش</button><button class="method" data-m="wallet" onclick="choose('wallet')"><img src="assets/wallets-combined.svg" alt="المحافظ"><b>الدفع بالمحفظة</b></button><button class="method" data-m="instapay" onclick="choose('instapay')"><img src="assets/instapay.svg" alt="InstaPay"><b>InstaPay</b></button></div><div id="info" class="proof"></div><div id="proof" class="proof"><div class="field"><label id="senderLabel">رقم الهاتف الذي حوّلت منه *</label><input id="senderPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="اكتب الرقم الذي حوّلت منه"></div><div class="field"><label>صورة إثبات التحويل *</label><input id="file" type="file" accept="image/*"></div><div class="field"><label>رقم العملية / المرجع (اختياري)</label><input id="refNo"></div><p id="upload" class="muted">ارفع صورة واضحة للتحويل.</p></div></div><button id="confirm" class="btn primary" onclick="confirmOrder()" disabled>تأكيد الطلب</button><p id="msg"></p></div><script type="module">import{auth,authReady,db}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{doc,getDoc,collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';import{getStorage,ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js';let user=null,method='',proofReady=false,settings={};const confirm=document.getElementById('confirm'),file=document.getElementById('file'),senderPhone=document.getElementById('senderPhone');const cart=()=>{try{return JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]')}catch{return[]}};const draft=()=>{try{return JSON.parse(localStorage.getItem('mandoub_checkout_draft')||'{}')}catch{return{}}};const cust=()=>{try{return JSON.parse(localStorage.getItem('mandoub_customer_data')||'{}')}catch{return{}}};function update(){const senderOk=method==='cash'||senderPhone.value.trim().length>=5;confirm.disabled=!user||!method||(method!=='cash'&&(!proofReady||!senderOk))}function render(){const d=draft(),total=(d.subtotal||0)+(d.deliveryFee||0);document.getElementById('summary').innerHTML=`<div><span>المنتجات</span><b>${(d.subtotal||0).toLocaleString('ar-EG')} ج</b></div><div><span>التوصيل</span><b>${(d.deliveryFee||0).toLocaleString('ar-EG')} ج</b></div><div class="grand"><span>الإجمالي</span><b>${total.toLocaleString('ar-EG')} ج</b></div>`;update()}window.choose=function(m){method=m;proofReady=false;file.value='';senderPhone.value='';document.querySelectorAll('.method').forEach(x=>x.classList.toggle('active',x.dataset.m===m));const info=document.getElementById('info'),proof=document.getElementById('proof');if(m==='cash'){info.className='proof show';info.innerHTML='<div class="notice">💵 الدفع كاش عند الاستلام.</div>';proof.className='proof'}else if(m==='wallet'){info.className='proof show';info.innerHTML=`<div class="notice"><b>📱 الدفع بالمحفظة</b><img class="wallet-image" src="assets/wallets-combined.svg" alt="Vodafone Cash Orange Cash Etisalat Cash"><div>حوّل إلى رقم المحفظة:</div><div class="receiver">${settings.walletNumber||'لم يتم تحديد الرقم'}</div><small>يمكن استخدام Vodafone Cash أو Orange Cash أو Etisalat Cash.</small></div>`;proof.className='proof show'}else{info.className='proof show';info.innerHTML=`<div class="notice"><b>🏦 InstaPay</b><img class="wallet-image" src="assets/instapay.svg" alt="InstaPay"><div>حوّل إلى:</div><div class="receiver">${settings.instapayNumber||'لم يتم تحديد الحساب'}</div></div>`;proof.className='proof show'}update()};file.onchange=()=>{proofReady=!!file.files?.[0]&&file.files[0].type.startsWith('image/');document.getElementById('upload').textContent=proofReady?'✅ تم اختيار صورة الإثبات':'❌ اختر صورة صحيحة';document.getElementById('upload').className=proofReady?'ok':'muted';update()};senderPhone.oninput=update;window.confirmOrder=async()=>{const msg=document.getElementById('msg'),c=cart(),d=draft(),u=cust();if(!user){msg.textContent='❌ يجب تسجيل الدخول لإتمام الطلب';return}if(!c.length){msg.textContent='❌ السلة فارغة';return}if(!method){msg.textContent='❌ اختر طريقة الدفع';return}if(!u.name||!u.phone||!u.address||!u.location){location.href='checkout.html';return}let proofUrl=null;try{confirm.disabled=true;if(method!=='cash'){const sender=senderPhone.value.trim();if(sender.length<5){msg.textContent='❌ اكتب رقم الهاتف الذي حوّلت منه';update();return}const f=file.files?.[0];if(!f||!proofReady){msg.textContent='❌ ارفع إثبات التحويل';update();return}const p=ref(getStorage(),`payment-proofs/${user.uid}/${Date.now()}-${String(f.name).replace(/[^a-zA-Z0-9._-]/g,'_')}`);await uploadBytes(p,f,{contentType:f.type});proofUrl=await getDownloadURL(p)}const total=(d.subtotal||0)+(d.deliveryFee||0),o=await addDoc(collection(db,'orders'),{customerId:user.uid,customerName:u.name,customerPhone:u.phone,customerAddress:u.address,location:u.location,latitude:d.latitude,longitude:d.longitude,restaurantId:d.restaurantId,restaurantName:d.restaurantName,items:c.map(x=>({productId:x.productId,name:x.name,price:x.price,quantity:x.quantity})),subtotal:d.subtotal||0,deliveryFee:d.deliveryFee||0,deliveryDistanceKm:d.distanceKm||0,paymentMethod:method,paymentStatus:method==='cash'?'غير مطلوب':'في انتظار المراجعة',paymentProofUrl:proofUrl,transactionRef:document.getElementById('refNo').value.trim(),senderPaymentPhone:method==='cash'?'':senderPhone.value.trim(),paymentReceiver:method==='wallet'?settings.walletNumber:method==='instapay'?settings.instapayNumber:'',total,status:'جديد',createdAt:serverTimestamp()});localStorage.setItem('mandoub_last_order_id',o.id);localStorage.removeItem('mandoub_cart_v2');localStorage.removeItem('mandoub_customer_data');localStorage.removeItem('mandoub_checkout_draft');location.href='track.html?order='+encodeURIComponent(o.id)}catch(e){console.error(e);msg.textContent='❌ تعذر إنشاء الطلب: '+e.message;update()}};async function init(){try{await authReady}catch{}user=auth.currentUser;if(!user){onAuthStateChanged(auth,u=>{user=u;if(!u){document.getElementById('msg').textContent='❌ يجب تسجيل الدخول لإتمام الطلب.'}else init()});return}try{const s=await getDoc(doc(db,'paymentSettings','main'));if(s.exists())settings=s.data()}catch(e){console.error(e)}render()}init();</script></body></html>
