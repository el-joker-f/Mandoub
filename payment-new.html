<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | الدفع وتأكيد الطلب</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#020d18;color:#fff}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:22px;margin:16px 0}.summary div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #16415e}.grand{font-size:21px}.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.method{border:2px solid #21445f;background:#031321;color:#fff;border-radius:14px;padding:12px;cursor:pointer;text-align:center}.method.active{border-color:#00dfff;background:#09283d}.method img{width:100%;height:70px;object-fit:contain;background:#020d18;border-radius:9px;margin-bottom:7px}.proof{display:none;margin-top:15px}.proof.show{display:block}.field{margin:12px 0}.field label{display:block;margin-bottom:7px}.field input{width:100%;padding:12px;border-radius:12px;border:2px solid #21445f;background:#031321;color:#fff}.field input.invalid{border-color:#ff5364}.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:900;cursor:pointer;width:100%}.primary{background:#00dfff;color:#00131e}.primary:disabled{opacity:.45}.notice{background:#102c42;border-radius:12px;padding:12px;line-height:1.9}.muted{color:#91a4b3}.ok{color:#7ff0a8;font-weight:800}.receiver{font-size:20px;color:#00dfff;direction:ltr;text-align:center;margin:10px 0;padding:10px;background:#031321;border-radius:10px}.wallet-image{width:100%;max-width:520px;height:120px;object-fit:contain;display:block;margin:10px auto;background:#031321;border-radius:14px;padding:8px}.success{background:#073d30;border-radius:14px;padding:15px;color:#7ff0a8;display:none}@media(max-width:600px){.methods{grid-template-columns:1fr}.wallet-image{height:100px}}</style></head><body><div class="wrap"><h1>💳 الدفع وتأكيد الطلب</h1><p class="muted">اختر طريقة الدفع ثم أكّد الطلب. بيانات حسابك محفوظة ولن تحتاج لكتابتها من جديد.</p><div class="card"><h2>ملخص الطلب</h2><div id="summary"></div></div><div class="card"><h2>💰 طريقة الدفع</h2><div class="methods"><button class="method" data-m="cash" onclick="choose('cash')">💵<br>كاش</button><button class="method" data-m="wallet" onclick="choose('wallet')"><img src="assets/wallets-combined.svg" alt="المحافظ"><b>الدفع بالمحفظة</b></button><button class="method" data-m="instapay" onclick="choose('instapay')"><img src="assets/instapay.svg" alt="InstaPay"><b>InstaPay</b></button></div><div id="info" class="proof"></div><div id="proof" class="proof"><div class="field"><label>رقم الهاتف الذي حوّلت منه * — 11 رقم</label><input id="senderPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="01012345678"><p id="phoneMsg" class="muted">يجب أن يبدأ بـ 010 أو 011 أو 012 أو 015.</p></div><div class="field"><label>صورة إثبات التحويل *</label><input id="file" type="file" accept="image/*"></div><div class="field"><label>رقم العملية / المرجع (اختياري)</label><input id="refNo"></div><p id="upload" class="muted">ارفع صورة واضحة للتحويل.</p></div></div><div id="success" class="success"></div></div><button id="confirm" class="btn primary" onclick="confirmOrder()" disabled>تأكيد الطلب</button><p id="msg" class="muted"></p></div><script type="module">import{auth,authReady,db}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{doc,getDoc,collection,addDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';let user=null,method='',proofReady=false,settings={};const $=id=>document.getElementById(id),confirm=$('confirm'),file=$('file'),senderPhone=$('senderPhone');const cart=()=>{try{return JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]')}catch{return[]}};const draft=()=>{try{return JSON.parse(localStorage.getItem('mandoub_checkout_draft')||'{}')}catch{return{}}};function normalizePhone(v){let s=String(v||'').replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/\D/g,'');if(s.startsWith('20')&&s.length===12)s='0'+s.slice(2);return s}function validPhone(v){return /^(010|011|012|015)\d{8}$/.test(normalizePhone(v))}function update(){const ok=method==='cash'||(proofReady&&validPhone(senderPhone.value));if(method!=='cash'){senderPhone.value=normalizePhone(senderPhone.value);senderPhone.classList.toggle('invalid',!!senderPhone.value&&!validPhone(senderPhone.value));$('phoneMsg').textContent=validPhone(senderPhone.value)?'✅ الرقم صالح.':'يجب إدخال رقم موبايل مصري من 11 رقم.'}confirm.disabled=!user||!method||!ok}function render(){const d=draft(),total=Number(d.subtotal||0)+Number(d.deliveryFee||0);$('summary').innerHTML=`<div><span>المنتجات</span><b>${Number(d.subtotal||0).toLocaleString('ar-EG')} ج</b></div><div><span>التوصيل</span><b>${Number(d.deliveryFee||0).toLocaleString('ar-EG')} ج</b></div><div class="grand"><span>الإجمالي</span><b>${total.toLocaleString('ar-EG')} ج</b></div>`;update()}window.choose=m=>{method=m;proofReady=false;file.value='';senderPhone.value='';document.querySelectorAll('.method').forEach(x=>x.classList.toggle('active',x.dataset.m===m));const info=$('info'),proof=$('proof');if(m==='cash'){info.className='proof show';info.innerHTML='<div class="notice">💵 الدفع كاش عند الاستلام.</div>';proof.className='proof'}else if(m==='wallet'){info.className='proof show';info.innerHTML=`<div class="notice"><b>📱 الدفع بالمحفظة</b><img class="wallet-image" src="assets/wallets-combined.svg"><div>حوّل إلى:</div><div class="receiver">${settings.walletNumber||'لم يتم تحديد الرقم'}</div></div>`;proof.className='proof show'}else{info.className='proof show';info.innerHTML=`<div class="notice"><b>🏦 InstaPay</b><img class="wallet-image" src="assets/instapay.svg"><div>حوّل إلى:</div><div class="receiver">${settings.instapayNumber||'لم يتم تحديد الحساب'}</div></div>`;proof.className='proof show'}update()};file.onchange=()=>{proofReady=!!file.files?.[0]&&file.files[0].type.startsWith('image/');$('upload').textContent=proofReady?'✅ تم اختيار صورة الإثبات':'❌ اختر صورة صحيحة';$('upload').className=proofReady?'ok':'muted';update()};senderPhone.oninput=update;function compress(input){return new Promise((resolve,reject)=>{const f=input.files?.[0];if(!f)return reject(new Error('INVALID_IMAGE'));const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.72,data=c.toDataURL('image/jpeg',q);while(data.length>900000&&q>.4){q-=.08;data=c.toDataURL('image/jpeg',q)}if(data.length>950000)return reject(new Error('IMAGE_TOO_LARGE'));resolve(data)};img.onerror=()=>reject(new Error('INVALID_IMAGE'));img.src=r.result};r.readAsDataURL(f)})}function trackingCode(){return Math.random().toString(36).slice(2,10).toUpperCase()}window.confirmOrder=async()=>{const msg=$('msg'),c=cart(),d=draft();if(!user)return msg.textContent='❌ يجب تسجيل الدخول لإتمام الطلب';if(!c.length)return msg.textContent='❌ السلة فارغة';if(!method)return msg.textContent='❌ اختر طريقة الدفع';if(method!=='cash'&&(!proofReady||!validPhone(senderPhone.value)))return msg.textContent='❌ أكمل بيانات التحويل';try{confirm.disabled=true;let proofData=null;if(method!=='cash')proofData=await compress(file);const profileSnap=await getDoc(doc(db,'customers',user.uid)),profile=profileSnap.exists()?profileSnap.data():{};const total=Number(d.subtotal||0)+Number(d.deliveryFee||0),code=trackingCode();const o=await addDoc(collection(db,'orders'),{customerId:user.uid,restaurantId:d.restaurantId,restaurantName:d.restaurantName,items:c.map(x=>({productId:x.productId,name:x.name,price:x.price,quantity:x.quantity})),subtotal:Number(d.subtotal||0),deliveryFee:Number(d.deliveryFee||0),deliveryDistanceKm:Number(d.distanceKm||0),paymentMethod:method,paymentStatus:method==='cash'?'غير مطلوب':'في انتظار المراجعة',paymentProofUrl:null,paymentProof:proofData,transactionRef:$('refNo').value.trim(),senderPaymentPhone:method==='cash'?'':normalizePhone(senderPhone.value),total,status:'جديد',trackingCode:code,customerEmail:user.email||profile.email||'',deliveryAddress:profile.lastAddress||null,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});localStorage.setItem('mandoub_last_order_id',o.id);localStorage.removeItem('mandoub_cart_v2');localStorage.removeItem('mandoub_customer_data');localStorage.removeItem('mandoub_checkout_draft');$('success').style.display='block';$('success').innerHTML=`✅ تم استلام طلبك.<br>كود المتابعة: <strong>${code}</strong><br>سيتم فتح «طلباتي» الآن.`;setTimeout(()=>location.href='orders.html?open='+encodeURIComponent(o.id),700)}catch(e){console.error(e);msg.textContent=e?.message==='IMAGE_TOO_LARGE'?'❌ صورة الإثبات كبيرة جدًا.':'❌ تعذر إنشاء الطلب: '+(e?.message||'خطأ');update()}};async function init(){try{await authReady}catch{}user=auth.currentUser;if(!user)await new Promise(resolve=>{let done=false;const unsub=onAuthStateChanged(auth,u=>{if(u){user=u;done=true;unsub();resolve()}else if(!done)setTimeout(()=>{if(!done){unsub();resolve()}},3000)})});if(!user){$('msg').textContent='❌ يجب تسجيل الدخول لإتمام الطلب.';confirm.textContent='تسجيل الدخول';confirm.onclick=()=>location.href='login.html?return=payment-new.html';return}try{const s=await getDoc(doc(db,'paymentSettings','main'));if(s.exists())settings=s.data()}catch(e){console.error(e)}render()}init();</script></body></html>
