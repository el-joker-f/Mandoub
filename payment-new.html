<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | الدفع وتأكيد الطلب</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#020d18;color:#fff}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:22px;margin:16px 0}.summary div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #16415e}.grand{font-size:21px}.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.method{border:2px solid #21445f;background:#031321;color:#fff;border-radius:14px;padding:12px;cursor:pointer;text-align:center}.method.active{border-color:#00dfff;background:#09283d}.method img{width:100%;height:70px;object-fit:contain;background:#020d18;border-radius:9px;margin-bottom:7px}.proof{display:none;margin-top:15px}.proof.show{display:block}.field{margin:12px 0}.field label{display:block;margin-bottom:7px}.field input{width:100%;padding:12px;border-radius:12px;border:2px solid #21445f;background:#031321;color:#fff}.field input.invalid{border-color:#ff5364}.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:900;cursor:pointer;width:100%}.primary{background:#00dfff;color:#00131e}.primary:disabled{opacity:.45}.notice{background:#102c42;border-radius:12px;padding:12px;line-height:1.9}.muted{color:#91a4b3}.ok{color:#7ff0a8;font-weight:800}.receiver{font-size:20px;color:#00dfff;direction:ltr;text-align:center;margin:10px 0;padding:10px;background:#031321;border-radius:10px}.wallet-image{width:100%;max-width:520px;height:120px;object-fit:contain;display:block;margin:10px auto;background:#031321;border-radius:14px;padding:8px}@media(max-width:600px){.methods{grid-template-columns:1fr}.wallet-image{height:100px}}</style></head><body><div class="wrap"><h1>💳 الدفع وتأكيد الطلب</h1><p class="muted">اختر طريقة الدفع ثم أكّد الطلب.</p><div class="card"><h2>ملخص الطلب</h2><div id="summary"></div></div><div class="card"><h2>💰 طريقة الدفع</h2><div class="methods"><button class="method" data-m="cash" onclick="choose('cash')">💵<br>كاش</button><button class="method" data-m="wallet" onclick="choose('wallet')"><img src="assets/wallets-combined.svg" alt="المحافظ"><b>الدفع بالمحفظة</b></button><button class="method" data-m="instapay" onclick="choose('instapay')"><img src="assets/instapay.svg" alt="InstaPay"><b>InstaPay</b></button></div><div id="info" class="proof"></div><div id="proof" class="proof"><div class="field"><label>رقم الهاتف الذي حوّلت منه * — 11 رقم</label><input id="senderPhone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="11" minlength="11" placeholder="مثال: 01012345678"><p id="phoneMsg" class="muted">يجب أن يكون رقم موبايل مصري صحيح الصيغة ويبدأ بـ 010 أو 011 أو 012 أو 015.</p></div><div class="field"><label>صورة إثبات التحويل *</label><input id="file" type="file" accept="image/*"></div><div class="field"><label>رقم العملية / المرجع (اختياري)</label><input id="refNo"></div><p id="upload" class="muted">ارفع صورة واضحة للتحويل.</p></div></div></div><button id="confirm" class="btn primary" onclick="confirmOrder()" disabled>تأكيد الطلب</button><p id="msg"></p></div><script type="module">import{auth,authReady,db}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{doc,getDoc,collection,serverTimestamp,writeBatch}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';let user=null,method='',proofReady=false,settings={};const confirm=document.getElementById('confirm'),file=document.getElementById('file'),senderPhone=document.getElementById('senderPhone'),phoneMsg=document.getElementById('phoneMsg');const cart=()=>{try{return JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]')}catch{return[]}};const draft=()=>{try{return JSON.parse(localStorage.getItem('mandoub_checkout_draft')||'{}')}catch{return{}}};const cust=()=>{try{return JSON.parse(localStorage.getItem('mandoub_customer_data')||'{}')}catch{return{}}};function normalizePhone(v){let s=String(v||'').replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/\D/g,'');if(s.startsWith('20')&&s.length===12)s='0'+s.slice(2);return s}function validEgyptianMobile(v){const s=normalizePhone(v);return /^(010|011|012|015)\d{8}$/.test(s)&&s.length===11}function update(){const phone=normalizePhone(senderPhone.value);const senderOk=method==='cash'||validEgyptianMobile(phone);if(method!=='cash'){senderPhone.value=phone;senderPhone.classList.toggle('invalid',!!phone&&!senderOk);phoneMsg.textContent=senderOk?'✅ رقم مصري من 11 رقم صالح للصيغة.':'يجب إدخال رقم موبايل مصري من 11 رقم يبدأ بـ 010 أو 011 أو 012 أو 015.';phoneMsg.className=senderOk?'ok':'muted'}confirm.disabled=!user||!method||(method!=='cash'&&(!proofReady||!senderOk))}function render(){const d=draft(),total=(d.subtotal||0)+(d.deliveryFee||0);document.getElementById('summary').innerHTML=`<div><span>المنتجات</span><b>${(d.subtotal||0).toLocaleString('ar-EG')} ج</b></div><div><span>التوصيل</span><b>${(d.deliveryFee||0).toLocaleString('ar-EG')} ج</b></div><div class="grand"><span>الإجمالي</span><b>${total.toLocaleString('ar-EG')} ج</b></div>`;update()}window.choose=function(m){method=m;proofReady=false;file.value='';senderPhone.value='';document.querySelectorAll('.method').forEach(x=>x.classList.toggle('active',x.dataset.m===m));const info=document.getElementById('info'),proof=document.getElementById('proof');if(m==='cash'){info.className='proof show';info.innerHTML='<div class="notice">💵 الدفع كاش عند الاستلام.</div>';proof.className='proof'}else if(m==='wallet'){info.className='proof show';info.innerHTML=`<div class="notice"><b>📱 الدفع بالمحفظة</b><img class="wallet-image" src="assets/wallets-combined.svg" alt="Vodafone Cash Orange Cash Etisalat Cash"><div>حوّل إلى رقم المحفظة:</div><div class="receiver">${settings.walletNumber||'لم يتم تحديد الرقم'}</div><small>يمكن استخدام Vodafone Cash أو Orange Cash أو Etisalat Cash.</small></div>`;proof.className='proof show'}else{info.className='proof show';info.innerHTML=`<div class="notice"><b>🏦 InstaPay</b><img class="wallet-image" src="assets/instapay.svg" alt="InstaPay"><div>حوّل إلى:</div><div class="receiver">${settings.instapayNumber||'لم يتم تحديد الحساب'}</div></div>`;proof.className='proof show'}update()};file.onchange=()=>{proofReady=!!file.files?.[0]&&file.files[0].type.startsWith('image/');document.getElementById('upload').textContent=proofReady?'✅ تم اختيار صورة الإثبات':'❌ اختر صورة صحيحة';document.getElementById('upload').className=proofReady?'ok':'muted';update()};senderPhone.oninput=update;function compressProofImage(input){return new Promise((resolve,reject)=>{const f=input.files?.[0];if(!f||!f.type.startsWith('image/'))return reject(new Error('INVALID_IMAGE'));const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=900;const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.72;const make=()=>c.toDataURL('image/jpeg',q);let data=make();while(data.length>900000&&q>.4){q-=.08;data=make()}if(data.length>950000)return reject(new Error('IMAGE_TOO_LARGE'));resolve(data)};img.onerror=()=>reject(new Error('INVALID_IMAGE'));img.src=r.result};r.onerror=()=>reject(new Error('READ_ERROR'));r.readAsDataURL(f)})}function makeTrackingCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='MND-';for(let i=0;i<8;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s}window.confirmOrder=async()=>{const msg=document.getElementById('msg'),c=cart(),d=draft(),u=cust(),sender=normalizePhone(senderPhone.value);if(!user){msg.textContent='❌ يجب تسجيل الدخول لإتمام الطلب';return}if(!c.length){msg.textContent='❌ السلة فارغة';return}if(!method){msg.textContent='❌ اختر طريقة الدفع';return}if(!u.name||!u.phone||!u.address||!u.location){location.href='checkout.html';return}if(method!=='cash'&&!validEgyptianMobile(sender)){msg.textContent='❌ اكتب رقم موبايل مصري صحيح من 11 رقم';update();return}let proofData=null;try{confirm.disabled=true;if(method!=='cash'){if(!file.files?.[0]||!proofReady){msg.textContent='❌ ارفع إثبات التحويل';update();return}proofData=await compressProofImage(file);document.getElementById('upload').textContent='✅ تم تجهيز صورة الإثبات وإرسالها مع الطلب.'}const total=(d.subtotal||0)+(d.deliveryFee||0);const trackingCode=makeTrackingCode();const orderRef=doc(collection(db,'orders'));const publicRef=doc(db,'publicOrders',trackingCode);const orderData={customerId:user.uid,customerName:u.name,customerPhone:u.phone,customerAddress:u.address,location:u.location,latitude:d.latitude,longitude:d.longitude,restaurantId:d.restaurantId,restaurantName:d.restaurantName,trackingCode,items:c.map(x=>({productId:x.productId,name:x.name,price:x.price,quantity:x.quantity})),subtotal:d.subtotal||0,deliveryFee:d.deliveryFee||0,deliveryDistanceKm:d.distanceKm||0,paymentMethod:method,paymentStatus:method==='cash'?'غير مطلوب':'في انتظار المراجعة',paymentProofUrl:null,paymentProof:proofData,transactionRef:document.getElementById('refNo').value.trim(),senderPaymentPhone:method==='cash'?'':sender,total,status:'جديد',createdAt:serverTimestamp()};const publicData={trackingCode,orderId:orderRef.id,status:'جديد',restaurantName:d.restaurantName||'',items:c.map(x=>({name:x.name,price:Number(x.price)||0,quantity:Number(x.quantity)||1})),subtotal:d.subtotal||0,deliveryFee:d.deliveryFee||0,total,public:true,createdAt:serverTimestamp()};const batch=writeBatch(db);batch.set(orderRef,orderData);batch.set(publicRef,publicData);await batch.commit();localStorage.setItem('mandoub_last_order_id',orderRef.id);localStorage.setItem('mandoub_last_tracking_code',trackingCode);localStorage.removeItem('mandoub_cart_v2');localStorage.removeItem('mandoub_customer_data');localStorage.removeItem('mandoub_checkout_draft');location.href='track.html?tracking='+encodeURIComponent(trackingCode)}catch(e){console.error(e);msg.textContent=e?.message==='IMAGE_TOO_LARGE'?'❌ صورة الإثبات كبيرة جدًا، اختر صورة أصغر.':'❌ تعذر إنشاء الطلب: '+(e?.message||'خطأ غير معروف');update()}};async function init(){try{await authReady}catch(e){console.error(e)}user=auth.currentUser;if(!user){await new Promise(resolve=>{let done=false;const unsub=onAuthStateChanged(auth,u=>{if(u){user=u;done=true;unsub();resolve()}else if(!done)setTimeout(()=>{if(!done){unsub();resolve()}},8000)})})}if(!user){const msg=document.getElementById('msg');msg.textContent='❌ يجب تسجيل الدخول لإتمام الطلب.';confirm.disabled=true;confirm.textContent='تسجيل الدخول';confirm.onclick=()=>location.href='login.html?return=payment-new.html';return}try{const s=await getDoc(doc(db,'paymentSettings','main'));if(s.exists())settings=s.data()}catch(e){console.error(e)}render()}init();</script></body></html>
