<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>مندوب | المطاعم</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#020d1c;
  color:#fff;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:0;
}

/* NAVBAR */

.navbar{
  width:100%;
  height:68px;

  display:flex;
  align-items:center;

  padding:8px 12px;

  background:#031326;
  border-bottom:1px solid #12304d;

  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  width:48px;
  height:48px;
  object-fit:contain;
  flex-shrink:0;
}

.nav-links{
  flex:1;

  display:flex;
  justify-content:center;
  align-items:center;

  gap:20px;
  margin:0 15px;

  overflow-x:auto;
  scrollbar-width:none;
}

.nav-links::-webkit-scrollbar{
  display:none;
}

.nav-links a{
  white-space:nowrap;
  font-size:14px;
  color:#d5e0ea;
}

.nav-links a.active{
  color:#00d9ff;
  font-weight:bold;
}

.cart{
  width:48px;
  height:48px;
  min-width:48px;

  border-radius:13px;

  background:#08d8f5;
  font-size:21px;

  position:relative;
}

#cartCount{
  position:absolute;

  top:2px;
  left:2px;

  min-width:18px;
  height:18px;

  padding:2px 5px;

  border-radius:20px;

  background:#ff2364;
  color:#fff;

  font-size:10px;
  font-weight:bold;
}

/* PAGE */

.container{
  width:100%;
  max-width:1200px;

  margin:auto;

  padding:35px 18px 60px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:25px;
}

.header h1{
  font-size:30px;
}

.back{
  color:#00d9ff;
  font-size:14px;
}

/* RESTAURANTS */

#restaurants{
  display:grid;

  grid-template-columns:
  repeat(4,1fr);

  gap:18px;
}

.restaurant{
  overflow:hidden;

  background:#061a30;

  border:1px solid #173854;

  border-radius:20px;

  transition:.2s;
}

.restaurant:hover{
  transform:translateY(-3px);
  border-color:#00d9ff;
}

.restaurant-image{
  width:100%;
  height:175px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle,
      #123a50,
      #061725
    );
}

.restaurant-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.restaurant-image .emoji{
  font-size:70px;
}

.restaurant-body{
  padding:18px;
}

.restaurant-body h2{
  font-size:20px;
  margin-bottom:7px;
}

.restaurant-body p{
  color:#91a2b2;
  font-size:13px;
  margin-bottom:15px;
}

.info{
  display:flex;
  justify-content:space-between;
  gap:8px;

  margin-bottom:15px;

  font-size:13px;
}

.rating{
  color:#00d9ff;
}

.delivery{
  color:#91a2b2;
}

.menu-button{
  width:100%;
  height:48px;

  border-radius:12px;

  background:#08d8f5;
  color:#00121d;

  font-weight:bold;
  font-size:15px;
}

.empty{
  grid-column:1/-1;

  padding:70px 20px;

  text-align:center;

  background:#061a30;

  border:1px solid #173854;
  border-radius:20px;
}

.empty-icon{
  font-size:50px;
  margin-bottom:15px;
}

.empty h2{
  margin-bottom:8px;
}

.empty p{
  color:#91a2b2;
}

/* LOADING */

.loading{
  grid-column:1/-1;

  text-align:center;

  padding:60px;

  color:#00d9ff;
}

/* MOBILE */

@media(max-width:700px){

  .navbar{
    height:64px;
    padding:7px 9px;
  }

  .logo{
    width:43px;
    height:43px;
  }

  .nav-links{
    justify-content:flex-start;
    gap:12px;
    margin:0 8px;
  }

  .nav-links a{
    font-size:11px;
  }

  .cart{
    width:45px;
    height:45px;
    min-width:45px;
  }

  .container{
    padding:28px 14px 50px;
  }

  .header h1{
    font-size:27px;
  }

  .back{
    font-size:12px;
  }

  #restaurants{
    grid-template-columns:1fr;
    gap:15px;
  }

  .restaurant-image{
    height:190px;
  }

}
</style>
</head>

<body>

<header class="navbar">

  <a href="index.html">
    <img
      class="logo"
      src="assets/logo.png"
      alt="مندوب">
  </a>

  <nav class="nav-links">

    <a href="index.html">
      الرئيسية
    </a>

    <a
      href="restaurants.html"
      class="active">
      المطاعم
    </a>

    <a href="index.html#offers">
      العروض
    </a>

    <a href="index.html#track">
      تتبع
    </a>

    <a href="index.html#about">
      عن مندوب
    </a>

  </nav>

  <button
    class="cart"
    onclick="goCart()">

    🛒

    <span id="cartCount">
      0
    </span>

  </button>

</header>


<main class="container">

  <div class="header">

    <h1>
      المطاعم
    </h1>

    <a
      class="back"
      href="index.html">
      ← الرئيسية
    </a>

  </div>


  <section id="restaurants">

    <div class="loading">
      جاري تحميل المطاعم...
    </div>

  </section>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyB6-RVH7-8NrN-AaOOv6QjL9APDeyj7oIU",

  authDomain:
    "mandoub-dv.firebaseapp.com",

  projectId:
    "mandoub-dv",

  storageBucket:
    "mandoub-dv.firebasestorage.app",

  messagingSenderId:
    "311140400335",

  appId:
    "1:311140400335:web:db198b7c53259c53594bba",

  measurementId:
    "G-7V1LJQYYXD"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


async function loadRestaurants(){

  const container =
    document.getElementById("restaurants");

  try{

    const q =
      query(
        collection(db,"restaurants"),
        orderBy("createdAt","desc")
      );

    const snapshot =
      await getDocs(q);


    container.innerHTML = "";


    if(snapshot.empty){

      container.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🍽️
          </div>

          <h2>
            لا توجد مطاعم حاليًا
          </h2>

          <p>
            سيتم إضافة المطاعم قريبًا.
          </p>

        </div>

      `;

      return;
    }


    snapshot.forEach(docSnap=>{

      const restaurant =
        docSnap.data();

      const id =
        docSnap.id;


      const name =
        restaurant.name || "مطعم";

      const category =
        restaurant.category || "مطعم";

      const rating =
        restaurant.rating || "جديد";

      const delivery =
        restaurant.delivery || "حسب المسافة";

      const image =
        restaurant.image || "";

      const card =
        document.createElement("article");

      card.className =
        "restaurant";


      let imageHTML = "";

      if(image){

        imageHTML = `

          <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(name)}"
            onerror="this.style.display='none';this.parentElement.querySelector('.emoji').style.display='block';">

          <div
            class="emoji"
            style="display:none">
            🍽️
          </div>

        `;

      }else{

        imageHTML = `

          <div class="emoji">
            🍽️
          </div>

        `;

      }


      card.innerHTML = `

        <div class="restaurant-image">

          ${imageHTML}

        </div>


        <div class="restaurant-body">

          <h2>
            ${escapeHTML(name)}
          </h2>

          <p>
            ${escapeHTML(category)}
          </p>


          <div class="info">

            <span class="rating">
              ⭐ ${escapeHTML(String(rating))}
            </span>

            <span class="delivery">
              ${escapeHTML(String(delivery))}
            </span>

          </div>


          <button
            class="menu-button"
            data-id="${escapeHTML(id)}">

            عرض المنيو

          </button>

        </div>

      `;


      const button =
        card.querySelector(".menu-button");


      button.addEventListener(
        "click",
        ()=>{

          window.location.href =
            "menu.html?restaurantId=" +
            encodeURIComponent(id);

        }
      );


      container.appendChild(card);

    });


  }catch(error){

    console.error(error);

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h2>
          حصل خطأ
        </h2>

        <p>
          لم نتمكن من تحميل المطاعم.
        </p>

      </div>

    `;

  }

}


function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function goCart(){

  window.location.href =
    "index.html#cart";

}


loadRestaurants();

</script>

</body>
</html>
