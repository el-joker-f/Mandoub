<style>:root{--cyan:#00dfff;--bg:#f7fbfd;--card:#fff;--line:#cfe2e9;--muted:#718794}body{background:var(--bg);color:#061a2d}.rest-page{max-width:900px;margin:auto;padding:14px 12px 55px}.rest-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 14px}.rest-head h1{font-size:25px}.rest-head a{color:#00aeca;font-size:13px}.pills{display:flex;gap:8px;overflow-x:auto;padding:3px 0 10px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}.pill{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#284556;border-radius:999px;padding:10px 15px;font-weight:800;white-space:nowrap}.pill.active{background:var(--cyan);border-color:var(--cyan);color:#061a2d}.rest-search{width:100%;height:48px;border:1px solid var(--line);outline:0;border-radius:14px;background:#fff;color:#061a2d;padding:0 15px;font-size:15px;margin:3px 0 12px}.rest-search::placeholder{color:#8197a3}.location-box{margin:0 0 12px!important}#foodFilters{border-bottom:1px solid rgba(0,174,202,.12);margin-bottom:13px}.restaurant-list{display:grid;grid-template-columns:1fr;gap:10px}.talabat-rest{position:relative;display:flex;align-items:stretch;gap:13px;min-height:126px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(6,26,45,.08)}.talabat-rest>a{display:flex;align-items:center;gap:13px;min-width:0;flex:1}.rest-photo{width:112px;height:106px;flex:0 0 112px;object-fit:cover;border-radius:16px;background:#eaf4f7}.rest-data{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}.rest-name{font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rest-meta{color:#536b78;font-size:13px;line-height:1.6}.rest-meta .star{color:#00aeca}.rest-delivery{color:#00aeca;font-size:12px}.rest-offer{display:inline-flex;width:max-content;max-width:100%;background:#00dfff;color:#061a2d;border-radius:7px;padding:4px 7px;font-size:12px;font-weight:900;white-spa
