<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>مندوب | المطاعم والأقسام</title><link rel="stylesheet" href="style.css">
<style>:root{--cyan:#00dfff;--bg:#020d1b;--card:#061a2d;--line:#16415e;--muted:#91a4b3}html,body{width:100%;max-width:100%;overflow-x:hidden!important}body{background:var(--bg)!important;color:#fff!important}.rest-page{max-width:900px;margin:auto;padding:14px 12px 55px;background:var(--bg)}.rest-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 14px}.rest-head h1{font-size:25px;color:#fff}.rest-head a{color:var(--cyan);font-size:13px}.pills{display:flex;gap:8px;overflow-x:auto;padding:3px 0 10px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}.pill{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:#d8e5ed;border-radius:999px;padding:10px 15px;font-weight:800;white-space:nowrap}.pill.active{background:var(--cyan);border-color:var(--cyan);color:#061a2d}.rest-search{width:100%;height:48px;border:1px solid var(--line);outline:0;border-radius:14px;background:var(--card);color:#fff;padding:0 15px;font-size:15px;margin:3px 0 12px}.rest-search::placeholder{color:#718697}.location-box{margin:0 0 12px!important;background:var(--card)!important;border:1px solid var(--line)!important;color:#fff!important}.location-box input{background:#031321!important;color:#fff!important}.location-box button{background:var(--cyan)!important;color:#061a2d!important}#foodFilters{border-bottom:1px solid rgba(0,223,255,.12);margin-bottom:13px}.restaurants-message{padding:35px 12px;text-align:center;color:var(--muted)}
/* Mandoub compact restaurant cards: intentionally independent of style.css */
.mandoub-rest-list{display:flex!important;flex-direction:column!important;gap:10px!important;width:100%!important;max-width:820px!important;margin:0 auto!important}.mandoub-rest-card{position:relative!important;display:flex!important;flex-direction:row!important;direction:rtl!important;align-items:center!important;width:100%!important;height:118px!important;min-height:118px!important;max-height:118px!important;padding:7px!important;gap:10px!important;box-sizing:border-box!important;overflow:hidden!important;background:#061a2d!important;border:1px solid #16415e!important;border-radius:18px!important;box-shadow:0 6px 18px rgba(0,0,0,.24)!important;cursor:pointer!important}.mandoub-rest-image{width:100px!important;height:102px!important;min-width:100px!important;max-width:100px!important;flex:0 0 100px!important;overflow:hidden!important;border-radius:15px!important;background:#031321!important}.mandoub-rest-image img{display:block!important;width:100px!important;height:102px!important;min-width:100px!important;max-width:100px!important;object-fit:cover!important;background:#031321!important}.mandoub-rest-info{min-width:0!important;flex:1 1 auto!important;height:100%!important;display:flex!important;flex-direction:column!important;justify-content:center!important;gap:5px!important;overflow:hidden!important}.mandoub-rest-title{display:flex!important;align-items:center!important;gap:6px!important;min-width:0!important}.mandoub-rest-title strong{min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;font-size:17px!important;font-weight:900!important;color:#fff!important}.mandoub-offer-mini{flex:0 0 auto!important;background:#00dfff!important;color:#061a2d!important;border-radius:6px!important;padding:3px 6px!important;font-size:9px!important;font-weight:900!important}.mandoub-rest-meta{display:flex!important;gap:5px!important;min-width:0!important;overflow:hidden!important;white-space:nowrap!important;text-overflow:ellipsis!important;color:#d8e5ed!important;font-size:11px!important}.mandoub-rest-meta span:first-child{color:#00dfff!important;font-weight:800!important}.mandoub-rest-delivery{min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;color:#00dfff!important;font-size:10px!important}.mandoub-rest-offer{align-self:flex-start!important;max-width:125px!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;text-decoration:none!important;background:#00dfff!important;color:#061a2d!important;border-radius:7px!important;padding:4px 7px!important;font-size:8px!important;font-weight:900!important}.mandoub-rest-fav{position:absolute!important;left:7px!important;top:7px!important;width:31px!important;height:31px!important;border:1px solid #16415e!important;border-radius:50%!important;background:#020d1b!important;color:#fff!important;font-size:18px!important;line-height:1!important;z-index:5!important}.mandoub-rest-fav.active{color:#00dfff!important}
@media(max-width:520px){.rest-page{padding-left:8px!important;padding-right:8px!important}.mandoub-rest-card{height:112px!important;min-height:112px!important;max-height:112px!important;padding:6px!important;gap:8px!important}.mandoub-rest-image{width:90px!important;height:98px!important;min-width:90px!important;max-width:90px!important;flex-basis:90px!important}.mandoub-rest-image img{width:90px!important;height:98px!important;min-width:90px!important;max-width:90px!important}.mandoub-rest-title strong{font-size:15px!important}.mandoub-rest-meta{font-size:10px!important}.mandoub-rest-delivery{font-size:9px!important}.mandoub-rest-fav{left:6px!important;top:6px!important;width:29px!important;height:29px!important}.mandoub-rest-offer{max-width:110px!important}}
@media(max-width:380px){.mandoub-rest-card{height:106px!important;min-height:106px!important;max-height:106px!important}.mandoub-rest-image{width:82px!important;height:92px!important;min-width:82px!important;max-width:82px!important;flex-basis:82px!important}.mandoub-rest-image img{width:82px!important;height:92px!important;min-width:82px!important;max-width:82px!important}.mandoub-rest-title strong{font-size:14px!important}.mandoub-rest-meta{font-size:9px!important}.mandoub-rest-delivery{font-size:8px!important}}
@media(min-width:700px){.mandoub-rest-card{height:136px!important;min-height:136px!important;max-height:136px!important}.mandoub-rest-image{width:125px!important;height:120px!important;min-width:125px!important;max-width:125px!important;flex-basis:125px!important}.mandoub-rest-image img{width:125px!important;height:120px!important;min-width:125px!important;max-width:125px!important}.mandoub-rest-title strong{font-size:19px!important}}
</style>
