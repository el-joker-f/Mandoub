<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>المطاعم | مندوب</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .restaurants-page {
      width: 100%;
      min-height: 100vh;
      padding: 30px 16px 50px;
    }


    .restaurants-page-header {
      width: 100%;
      margin-bottom: 25px;
      text-align: center;
    }


    .restaurants-page-header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }


    .restaurants-page-header p {
      color: #91a4b3;
      font-size: 14px;
      line-height: 1.8;
    }


    .back-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 22px;

      padding: 10px 15px;

      border-radius: 11px;

      background: #06233a;

      border:
        1px solid rgba(0, 224, 255, 0.25);

      color: #00dfff;

      font-size: 13px;
      font-weight: 800;
    }


    #restaurantsContainer {
      width: 100%;
      max-width: 1200px;

      margin-left: auto;
      margin-right: auto;
    }


    .restaurants-message {
      width: 100%;

      padding: 35px 15px;

      border-radius: 17px;

      background: #061a2d;

      border:
        1px solid rgba(0, 224, 255, 0.14);

      color: #91a4b3;

      text-align: center;

      line-height: 1.8;
    }


    .restaurant-image {
      width: 100%;
      height: 170px;

      object-fit: cover;

      background: #061725;
    }


    .restaurant-image-placeholder {
      width: 100%;
      height: 170px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle,
          #123a50,
          #061725
        );

      font-size: 65px;
    }


    .restaurant-status {
      display: inline-block;

      margin-bottom: 8px;

      padding: 5px 9px;

      border-radius: 8px;

      background: rgba(0, 224, 255, 0.10);

      color: #00dfff;

      font-size: 11px;

      font-weight: 800;
    }


    @media (min-width: 600px) {

      .restaurants-page {
        padding:
          45px 30px 60px;
      }

      #restaurantsContainer {
        display: grid;

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 15px;
      }

    }


    @media (min-width: 1024px) {

      .restaurants-page {
        padding:
          55px 30px 70px;
      }

      #restaurantsContainer {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
      }

    }

  </style>

</head>


<body>

<header class="navbar">

  <a
    class="brand"
    href="index.html">

    <img
      src="assets/logo.png"
      alt="مندوب">

  </a>


  <nav>

    <a href="index.html">
      الرئيسية
    </a>

    <a
      class="active"
      href="restaurants.html">
      المطاعم
    </a>

    <a href="index.html#track">
      تتبع
    </a>

  </nav>


  <div class="nav-actions">

    <button
      type="button"
      class="login"
      onclick="openLogin()">

      تسجيل الدخول

    </button>


    <button
      type="button"
      class="cart"
      onclick="openCart()">

      🛒

      <span id="cartCount">
        0
      </span>

    </button>

  </div>

</header>


<main>

  <section class="restaurants-page">

    <a
      class="back-home"
      href="index.html">

      → العودة للرئيسية

    </a>


    <div class="restaurants-page-header">

      <p class="eyebrow">
        مندوب
      </p>

      <h1>
        المطاعم
      </h1>

      <p>
        اختار المطعم اللي تحب تطلب منه
      </p>

    </div>


    <!--
      المطاعم هنا لا يتم كتابتها يدويًا.
      JavaScript يجلبها من Firebase
      من collection اسمها restaurants.
    -->

    <div id="restaurantsContainer">

      <div
        id="restaurantsLoading"
        class="restaurants-message">

        ⏳ جاري تحميل المطاعم...

      </div>

    </div>

  </section>

</main>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  doc,
  getDoc
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyB6-RVH7-8NrN-AaOOv6QjL9APDeyj7oIU",

  authDomain:
    "mandoub-dv.firebaseapp.com",

  projectId:
    "mandoub-dv",

  storageBucket:
    "mandoub-dv.firebasestorage.app",

  messagingSenderId:
    "311140400335",

  appId:
    "1:311140400335:web:db198b7c53259c53594bba",

  measurementId:
    "G-7V1LJQYYXD"

};


try {

  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);


  window.firebaseDB =
    db;


  window.firebaseCollection =
    collection;


  window.firebaseAddDoc =
    addDoc;


  window.firebaseServerTimestamp =
    serverTimestamp;


  window.firebaseDoc =
    doc;


  window.firebaseGetDoc =
    getDoc;


  window.firebaseReady =
    true;


  console.log(
    "Firebase متصل بنجاح ✅"
  );


} catch (error) {

  window.firebaseReady =
    false;


  console.error(
    "Firebase Error:",
    error
  );

}

</script>


<script src="script.js"></script>

</body>
</html>
