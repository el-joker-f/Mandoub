<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المطاعم | مندوب</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #020d1b;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 70px;
      padding: 10px 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(2, 13, 27, .97);
      border-bottom: 1px solid rgba(0, 224, 255, .2);
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .back {
      border: 1px solid rgba(0, 224, 255, .3);
      background: #06233a;
      color: white;
      padding: 10px 15px;
      border-radius: 11px;
      font-weight: 700;
      text-decoration: none;
    }

    main {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 30px 16px 50px;
    }

    .title {
      text-align: center;
      margin-bottom: 25px;
    }

    .title h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .title p {
      color: #8ea3b4;
      font-size: 14px;
    }

    #loading {
      text-align: center;
      color: #00dfff;
      padding: 30px;
    }

    #error {
      display: none;
      text-align: center;
      padding: 20px;
      color: #ff557f;
    }

    .restaurants {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .restaurant {
      overflow: hidden;
      background: #061b2e;
      border: 1px solid rgba(0, 224, 255, .14);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .restaurant-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #09243a;
    }

    .restaurant-content {
      padding: 17px;
    }

    .restaurant-content h2 {
      font-size: 20px;
      margin-bottom: 7px;
    }

    .restaurant-content p {
      color: #91a4b3;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 14px;
    }

    .restaurant-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
      color: #00dfff;
      font-size: 13px;
    }

    .restaurant-info span:last-child {
      color: #91a4b3;
    }

    .open-button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 11px;
      background: #00dfff;
      color: #00121d;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .open-button:active {
      transform: scale(.98);
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #91a4b3;
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    @media (min-width: 600px) {
      .restaurants {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 900px) {
      .restaurants {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>

    <a href="index.html">
      <img
        src="assets/logo.png"
        class="logo"
        alt="مندوب"
      >
    </a>

    <a href="index.html" class="back">
      ← الرئيسية
    </a>

  </header>

  <main>

    <div class="title">
      <h1>🍽️ المطاعم</h1>
      <p>اختار المطعم اللي تحب تطلب منه</p>
    </div>

    <div id="loading">
      جاري تحميل المطاعم...
    </div>

    <div id="error">
      حصل خطأ أثناء تحميل المطاعم.
    </div>

    <section
      id="restaurants"
      class="restaurants">
    </section>

  </main>


  <!-- ================= FIREBASE ================= -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs
    } from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyB6-RVH7-8NrN-AaOOv6QjL9APDeyj7oIU",

      authDomain:
        "mandoub-dv.firebaseapp.com",

      projectId:
        "mandoub-dv",

      storageBucket:
        "mandoub-dv.firebasestorage.app",

      messagingSenderId:
        "311140400335",

      appId:
        "1:311140400335:web:db198b7c53259c53594bba",

      measurementId:
        "G-7V1LJQYYXD"

    };


    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    const restaurantsContainer =
      document.getElementById(
        "restaurants"
      );

    const loading =
      document.getElementById(
        "loading"
      );

    const errorBox =
      document.getElementById(
        "error"
      );


    async function loadRestaurants() {

      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "restaurants"
            )
          );


        loading.style.display =
          "none";


        if (snapshot.empty) {

          restaurantsContainer.innerHTML = `

            <div class="empty">

              <div class="empty-icon">
                🍽️
              </div>

              <h2>
                لا توجد مطاعم حاليًا
              </h2>

              <p>
                المطاعم التي تضيفها من لوحة الأدمن
                ستظهر هنا.
              </p>

            </div>

          `;

          return;

        }


        snapshot.forEach((doc) => {

          const restaurant =
            doc.data();


          const id =
            doc.id;


          const name =
            restaurant.name ||
            "مطعم بدون اسم";


          const category =
            restaurant.category ||
            "مطعم";


          const description =
            restaurant.description ||
            "اطلب أشهى الوجبات من هذا المطعم";


          const rating =
            restaurant.rating ||
            "4.5";


          const delivery =
            restaurant.delivery ||
            "25";


          const image =
            restaurant.image ||
            "assets/logo.png";


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "restaurant";


          card.innerHTML = `

            <img
              class="restaurant-image"
              src="${image}"
              alt="${name}"
              onerror="this.src='assets/logo.png'"
            >

            <div class="restaurant-content">

              <h2>
                ${name}
              </h2>

              <p>
                ${description}
              </p>

              <div class="restaurant-info">

                <span>
                  ⭐ ${rating}
                </span>

                <span>
                  توصيل من ${delivery}ج
                </span>

              </div>

              <button
                class="open-button"
                data-id="${id}"
              >
                عرض المنتجات
              </button>

            </div>

          `;


          const button =
            card.querySelector(
              ".open-button"
            );


          button.addEventListener(
            "click",
            function () {

              window.location.href =
                "restaurant.html?id=" +
                encodeURIComponent(id);

            }
          );


          restaurantsContainer.appendChild(
            card
          );

        });


      } catch (error) {

        console.error(
          "Firebase Error:",
          error
        );


        loading.style.display =
          "none";

        errorBox.style.display =
          "block";

        errorBox.textContent =
          "حصل خطأ في الاتصال بقاعدة البيانات ❌";

      }

    }


    loadRestaurants();

  </script>

</body>
</html>
