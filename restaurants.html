<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>المطاعم | مندوب</title><link rel="stylesheet" href="style.css"><style>.restaurant-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:18px}.restaurant-choice{display:flex;align-items:center;gap:12px;background:#061a2d;border:1px solid #16415e;color:#fff;border-radius:18px;padding:12px;text-align:right;cursor:pointer}.restaurant-choice.selected{border-color:#00dfff;box-shadow:0 0 0 2px rgba(0,223,255,.12)}.restaurant-choice img{width:62px;height:62px;object-fit:cover;border-radius:14px}.restaurant-choice strong,.restaurant-choice small{display:block}.restaurant-choice small{color:#91a4b3;margin-top:5px}.restaurants-message{padding:25px;text-align:center;color:#91a4b3}.account-button.logged-in{color:#00dfff;border-color:rgba(0,223,255,.4)}.restaurants-cart-button{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding:16px 18px;border:1px solid #16415e;border-radius:16px;background:#061a2d;color:#fff;cursor:pointer;width:100%;font:inherit;text-align:right}.restaurants-cart-button:hover{border-color:#00dfff}.restaurants-cart-button .cart-label{font-weight:900}.restaurants-cart-button .cart-action{background:#00dfff;color:#00121d;border-radius:10px;padding:10px 16px;font-weight:900;white-space:nowrap}</style></head><body><header class="navbar"><a class="brand" href="index.html"><img src="assets/logo.png" alt="مندوب"></a><nav><a href="index.html">الرئيسية</a><a class="active" href="restaurants.html">المطاعم</a><a href="index.html#track">تتبع</a></nav><div class="nav-actions"><button type="button" class="login account-button" id="accountButton">👤 تسجيل الدخول</button><button type="button" class="cart" id="cartButton" onclick="window.openMandoubCart()">🛒 <span id="cartCount">0</span></button></div></header><main><section class="section"><div class="section-head"><h2>المطاعم</h2><a href="index.html">← الرئيسية</a></div><div class="location-box" style="margin-top:15px"><span>📍</span><input type="text" id="locationInput" placeholder="حدد موقعك لحساب رسوم التوصيل" readonly><button type="button" onclick="setMandoubLocation()">تحديد موقعي</button></div><p id="locationMsg" class="location-msg"></p><div id="restaurantsContainer"><div id="restaurantsLoading" class="restaurants-message">⏳ جاري تحميل المطاعم...</div></div><button type="button" class="restaurants-cart-button" id="restaurantsCartButton"><span class="cart-label">🛒 سلة الطلب <span id="restaurantsCartCount">0</span></span><span class="cart-action">عرض السلة</span></button></section></main><footer id="contact"><img src="assets/logo.png" alt="مندوب"><p>نوصل طلبك.. بسرعة وأمان</p><small>© 2026 مندوب — جميع الحقوق محفوظة</small></footer><script type="module">import{auth,authReady}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';const b=document.getElementById('accountButton');async function setupAccount(){if(!b)return;try{await authReady}catch{}const user=auth.currentUser;if(user){b.innerHTML='👤 حسابي';b.classList.add('logged-in');b.onclick=()=>location.href='account.html'}else{b.innerHTML='👤 تسجيل الدخول';b.classList.remove('logged-in');b.onclick=()=>location.href='login.html'}}setupAccount();onAuthStateChanged(auth,setupAccount);</script><script type="module">import{initializeApp,getApps}from"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import{getFirestore,collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const firebaseConfig={apiKey:"AIzaSyBN-MtgWLi0lwBPTzEPYrpwxNe6BCn_3KQ",authDomain:"mandoub-dv.firebaseapp.com",projectId:"mandoub-dv",storageBucket:"mandoub-dv.firebasestorage.app",messagingSenderId:"311140400335",appId:"1:311140400335:web:db198b7c53259c53594bba",measurementId:"G-7V1LJQYYXD"};try{const app=getApps().length?getApps()[0]:initializeApp(firebaseConfig),db=getFirestore(app);window.firebaseDB=db;window.firebaseCollection=collection;window.firebaseAddDoc=addDoc;window.firebaseServerTimestamp=serverTimestamp;window.firebaseReady=true}catch(e){window.firebaseReady=false;console.error(e)}</script><script src="script.js?v=20260820-11"></script><script src="cart-system.js?v=20260820-11"></script><script src="checkout-flow.js?v=20260820-11"></script><script src="restaurants-page.js?v=20260820-11"></script><script>document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('restaurantsCartButton');if(b)b.addEventListener('click',()=>window.openMandoubCart());const sync=()=>{const n=(window.getMandoubCart?.()||[]).reduce((s,x)=>s+Number(x.quantity||0),0);const e=document.getElementById('restaurantsCartCount');if(e)e.textContent=n};sync();window.addEventListener('mandoubCartChanged',sync)});</script></body></html>
