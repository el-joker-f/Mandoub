<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المطاعم | مندوب</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #020d1b;
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* NAVBAR */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      width: 100%;
      min-height: 65px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 8px 12px;

      background: rgba(2, 13, 27, .98);

      border-bottom:
        1px solid rgba(0, 224, 255, .2);

      backdrop-filter: blur(12px);
    }

    .brand img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 15px;

      overflow-x: auto;
      white-space: nowrap;

      scrollbar-width: none;
    }

    .nav-links::-webkit-scrollbar {
      display: none;
    }

    .nav-links a {
      font-size: 13px;
      color: #c7d5df;
      flex-shrink: 0;
    }

    .nav-links a.active {
      color: #00dfff;
      font-weight: 800;
    }

    .cart-btn {
      width: 48px;
      height: 48px;

      border: 1px solid rgba(0,224,255,.3);
      border-radius: 13px;

      background: #06233a;
      color: white;

      font-size: 21px;

      position: relative;
    }

    .cart-count {
      position: absolute;

      top: -5px;
      left: -5px;

      min-width: 20px;
      height: 20px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #00dfff;
      color: #00121d;

      font-size: 11px;
      font-weight: 900;
    }

    /* PAGE */

    .page {
      width: 100%;
      max-width: 1000px;

      margin: auto;

      padding: 30px 16px 60px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .page-title small {
      display: block;

      color: #00dfff;

      font-size: 14px;
      font-weight: 800;

      margin-bottom: 8px;
    }

    .page-title h1 {
      font-size: 30px;
      font-weight: 900;
    }

    .page-title p {
      color: #8fa2b2;
      margin-top: 10px;
      font-size: 14px;
    }

    /* RESTAURANTS */

    .restaurants-grid {
      display: grid;

      grid-template-columns: 1fr;

      gap: 16px;
    }

    .restaurant-card {
      overflow: hidden;

      border-radius: 18px;

      background: #061a2d;

      border:
        1px solid rgba(0,224,255,.15);

      box-shadow:
        0 10px 30px rgba(0,0,0,.25);

      transition: .2s;
    }

    .restaurant-card:active {
      transform: scale(.98);
    }

    .restaurant-image {
      width: 100%;
      height: 170px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle,
          #123b51,
          #061725
        );

      overflow: hidden;
    }

    .restaurant-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .restaurant-placeholder {
      font-size: 65px;
    }

    .restaurant-body {
      padding: 17px;
    }

    .restaurant-body h2 {
      font-size: 19px;
      margin-bottom: 7px;
    }

    .restaurant-category {
      color: #91a4b3;
      font-size: 13px;
      margin-bottom: 13px;
    }

    .restaurant-info {
      display: flex;
      justify-content: space-between;

      gap: 10px;

      color: #00dfff;

      font-size: 12px;

      margin-bottom: 15px;
    }

    .restaurant-info span:last-child {
      color: #91a4b3;
    }

    .open-button {
      width: 100%;
      height: 47px;

      border: 0;
      border-radius: 11px;

      background:
        linear-gradient(
          90deg,
          #00dfff,
          #08b9d4
        );

      color: #00121d;

      font-weight: 900;
      font-size: 14px;
    }

    /* LOADING */

    .loading {
      text-align: center;

      padding: 50px 15px;

      color: #8fa2b2;
    }

    .loading-icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

    /* EMPTY */

    .empty {
      text-align: center;

      padding: 50px 20px;

      border:
        1px solid rgba(0,224,255,.12);

      border-radius: 18px;

      background: #061a2d;
    }

    .empty div {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .empty p {
      color: #8fa2b2;
      margin-top: 8px;
    }

    @media (min-width: 600px) {

      .restaurants-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (min-width: 900px) {

      .restaurants-grid {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }

  </style>
</head>

<body>

  <header class="navbar">

    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="مندوب">
    </a>

    <nav class="nav-links">

      <a href="index.html">
        الرئيسية
      </a>

      <a href="restaurants.html" class="active">
        المطاعم
      </a>

      <a href="index.html#offers">
        العروض
      </a>

      <a href="index.html#track">
        تتبع الطلب
      </a>

    </nav>

    <button
      class="cart-btn"
      onclick="openCart()">

      🛒

      <span
        id="cartCount"
        class="cart-count">
        0
      </span>

    </button>

  </header>


  <main class="page">

    <div class="page-title">

      <small>
        مندوب 🍔
      </small>

      <h1>
        المطاعم
      </h1>

      <p>
        اختار المطعم وشوف المنتجات المتاحة
      </p>

    </div>


    <div
      id="restaurantsList"
      class="restaurants-grid">

      <div class="loading">

        <div class="loading-icon">
          ⏳
        </div>

        جاري تحميل المطاعم...

      </div>

    </div>

  </main>


  <script type="module">

    import {
      initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
      getFirestore,
      collection,
      getDocs,
      query,
      where
    }
    from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyB6-RVH7-8NrN-AaOOv6QjL9APDeyj7oIU",

      authDomain:
        "mandoub-dv.firebaseapp.com",

      projectId:
        "mandoub-dv",

      storageBucket:
        "mandoub-dv.firebasestorage.app",

      messagingSenderId:
        "311140400335",

      appId:
        "1:311140400335:web:db198b7c53259c53594bba",

      measurementId:
        "G-7V1LJQYYXD"

    };


    const app =
      initializeApp(firebaseConfig);


    const db =
      getFirestore(app);


    const list =
      document.getElementById(
        "restaurantsList"
      );


    /* =========================
       السلة
    ========================= */

    function updateCartCount() {

      const cart =
        JSON.parse(
          localStorage.getItem("mandoubCart")
          || "[]"
        );

      document.getElementById(
        "cartCount"
      ).textContent = cart.length;

    }


    window.openCart = function() {

      const cart =
        JSON.parse(
          localStorage.getItem("mandoubCart")
          || "[]"
        );

      if (!cart.length) {

        alert("السلة فارغة 🛒");

        return;

      }

      let text =
        "المنتجات في السلة:\\n\\n";

      cart.forEach(item => {

        text +=
          `${item.name} - ${item.price} جنيه\\n`;

      });

      alert(text);

    };


    updateCartCount();


    /* =========================
       تحميل المطاعم
    ========================= */

    async function loadRestaurants() {

      try {

        const restaurantsRef =
          collection(
            db,
            "restaurants"
          );


        const snapshot =
          await getDocs(
            restaurantsRef
          );


        if (snapshot.empty) {

          list.innerHTML = `

            <div class="empty">

              <div>🍽️</div>

              <h2>
                لا توجد مطاعم حاليًا
              </h2>

              <p>
                أضف المطاعم من صفحة الأدمن
              </p>

            </div>

          `;

          return;

        }


        list.innerHTML = "";


        snapshot.forEach(doc => {

          const restaurant =
            doc.data();


          if (
            restaurant.active === false
          ) {
            return;
          }


          const id =
            doc.id;


          const name =
            restaurant.name
            || "مطعم بدون اسم";


          const category =
            restaurant.category
            || "مطعم";


          const rating =
            restaurant.rating
            || "جديد";


          const deliveryFee =
            restaurant.deliveryFee
            ?? 25;


          const image =
            restaurant.image
            || "";


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "restaurant-card";


          card.innerHTML = `

            <div class="restaurant-image">

              ${
                image
                ?
                `<img
                  src="${image}"
                  alt="${name}">
                `
                :
                `
                <div class="restaurant-placeholder">
                  🍔
                </div>
                `
              }

            </div>


            <div class="restaurant-body">

              <h2>
                ${name}
              </h2>

              <p class="restaurant-category">
                ${category}
              </p>

              <div class="restaurant-info">

                <span>
                  ⭐ ${rating}
                </span>

                <span>
                  توصيل ${deliveryFee}ج
                </span>

              </div>

              <button
                class="open-button"
                onclick="openRestaurant('${id}')">

                عرض المنتجات

              </button>

            </div>

          `;


          list.appendChild(card);

        });

      }

      catch (error) {

        console.error(error);

        list.innerHTML = `

          <div class="empty">

            <div>⚠️</div>

            <h2>
              حصلت مشكلة في تحميل المطاعم
            </h2>

            <p>
              تأكد من اتصال Firebase وقواعد Firestore
            </p>

          </div>

        `;

      }

    }


    window.openRestaurant =
      function(id) {

        window.location.href =
          "restaurant.html?id="
          + encodeURIComponent(id);

      };


    loadRestaurants();

  </script>

</body>
</html>
``
