<!-- ================= TRACK ================= -->

<section
  id="track"
  class="track">

  <div>

    <p class="eyebrow">
      تتبع طلبك
    </p>

    <h2>
      اعرف طلبك وصل لفين
    </h2>

    <p>
      أدخل رقم الطلب لمتابعة حالته.
    </p>

  </div>


  <div class="track-form">

    <input
      type="text"
      id="orderNumber"
      placeholder="رقم الطلب">


    <button
      type="button"
      onclick="trackOrder()">

      تتبع الطلب

    </button>

  </div>


  <p id="trackMsg"></p>

</section>
