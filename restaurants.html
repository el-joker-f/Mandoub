<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>مندوب | المطاعم والأقسام</title><link rel="stylesheet" href="style.css">
<style>:root{--cyan:#00dfff;--bg:#020d1b;--card:#061a2d;--line:#16415e;--muted:#91a4b3}html,body{width:100%;max-width:100%;overflow-x:hidden!important}body{background:var(--bg)!important;color:#fff!important}.rest-page{max-width:900px;margin:auto;padding:14px 12px 55px;background:var(--bg)}.rest-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 14px}.rest-head h1{font-size:25px;color:#fff}.rest-head a{color:var(--cyan);font-size:13px}.pills{display:flex;gap:8px;overflow-x:auto;padding:3px 0 10px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}.pill{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:#d8e5ed;border-radius:999px;padding:10px 15px;font-weight:800;white-space:nowrap}.pill.active{background:var(--cyan);border-color:var(--cyan);color:#061a2d}.rest-search{width:100%;height:48px;border:1px solid var(--line);outline:0;border-radius:14px;background:var(--card);color:#fff;padding:0 15px;font-size:15px;margin:3px 0 12px}.rest-search::placeholder{color:#718697}.location-box{margin:0 0 12px!important;background:var(--card)!important;border:1px solid var(--line)!important;color:#fff!important}.location-box input{background:#031321!important;color:#fff!important}.location-box button{background:var(--cyan)!important;color:#061a2d!important}#foodFilters{border-bottom:1px solid rgba(0,223,255,.12);margin-bottom:13px}.restaurants-message{padding:35px 12px;text-align:center;color:var(--muted)}</style>
</head>
<body>
<header class="navbar"><a class="brand" href="index.html"><img src="assets/logo.png" alt="مندوب"></a><nav><a href="index.html">الرئيسية</a><a class="active" href="restaurants.html">المطاعم</a><a href="offers.html">العروض</a><a href="orders.html">طلباتي</a><a href="support.html">دعم ومساعدة</a></nav><div class="nav-actions"><button type="button" class="login account-button" id="accountButton">👤 تسجيل الدخول</button><button type="button" class="cart" onclick="location.href='cart.html'">🛒 <span id="cartCount">0</span></button></div></header>
<main class="rest-page"><div class="rest-head"><h1>المطاعم والأقسام 🍔</h1><a href="index.html">الرئيسية ←</a></div><div id="typeFilters" class="pills"><button class="pill active" data-type="all">الكل</button><button class="pill" data-type="restaurant">🍔 مطاعم</button><button class="pill" data-type="bakery">🥐 مخبوزات</button><button class="pill" data-type="pharmacy">💊 صيدليات</button><button class="pill" data-type="supermarket">🛒 سوبر ماركت</button></div><input id="search" class="rest-search" placeholder="🔎 ابحث عن مطعم أو محل"><div id="foodFilters" class="pills"></div><div class="location-box"><span>📍</span><input type="text" id="locationInput" placeholder="حدد موقعك لحساب رسوم التوصيل" readonly><button type="button" onclick="setMandoubLocation()">تحديد موقعي</button></div><p id="locationMsg" class="location-msg"></p><div id="restaurantsContainer"><div class="restaurants-message">⏳ جاري تحميل المطاعم...</div></div></main>
<footer id="contact"><img src="assets/logo.png" alt="مندوب"><p>نوصل طلبك.. بسرعة وأمان</p><small>© 2026 مندوب — جميع الحقوق محفوظة</small></footer>
<script type="module">import{auth,authReady}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';const b=document.getElementById('accountButton');function setup(u){if(u){b.textContent='👤 حسابي';b.classList.add('logged-in');b.onclick=()=>location.href='account.html'}else{b.textContent='👤 تسجيل الدخول';b.classList.remove('logged-in');b.onclick=()=>location.href='login.html'}}(async()=>{await authReady;setup(auth.currentUser);onAuthStateChanged(auth,setup)})();</script>

</body></html>
