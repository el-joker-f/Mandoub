  <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

  <a
    class="brand"
    href="index.html">

    <img
      src="assets/logo.png"
      alt="مندوب">

  </a>


  <nav>

    <a href="index.html">
      الرئيسية

    <a

      href="restaurants.html">

    <a href="index.html#track">

    <button

      onclick="openCart()">

    </button>

</header>



<!-- ================= MAIN ================= -->

<main>


  <!-- ================= RESTAURANTS ================= -->

  <section class="section">


    <div class="section-head">

      <h2>

      <a href="index.html">

  <small>

<!-- ================= FIREBASE ================= -->

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp,
  doc,
  getDoc
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyB6-RVH7-8NrN-AaOOv6QjL9APDeyj7oIU",

  authDomain:
    "mandoub-dv.firebaseapp.com",

  projectId:
    "mandoub-dv",

  storageBucket:
    "mandoub-dv.firebasestorage.app",

  messagingSenderId:
    "311140400335",

  appId:
    "1:311140400335:web:db198b7c53259c53594bba",

  measurementId:
    "G-7V1LJQYYXD"

};


try {

  const app =
    initializeApp(firebaseConfig);


  const db =
    getFirestore(app);


  window.firebaseDB =
    db;


  window.firebaseCollection =
    collection;


  window.firebaseAddDoc =
    addDoc;


  window.firebaseServerTimestamp =
    serverTimestamp;


  window.firebaseDoc =
    doc;


  window.firebaseGetDoc =
    getDoc;


  window.firebaseReady =
    true;


  console.log(
    "Firebase متصل بنجاح ✅"
  );


} catch (error) {

  window.firebaseReady =
    false;


  console.error(
    "Firebase Error:",
    error
  );

}

</script>



<!-- ================= MAIN SCRIPT ================= -->

<script src="script.js"></script>


</body>

</html>
