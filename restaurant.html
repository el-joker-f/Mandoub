<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>مطعم | مندوب</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020d1b;color:#fff;font-family:Tahoma,Arial,sans-serif;padding-bottom:95px}header{position:sticky;top:0;z-index:20;height:70px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:#020d1bf7;border-bottom:1px solid #16415e}.logo{width:50px;height:50px;object-fit:contain}.back{background:#06233a;border:1px solid #16415e;color:#fff;padding:10px 15px;border-radius:11px;text-decoration:none;font-weight:700}main{max-width:1050px;margin:auto;padding:20px 15px 120px}.restaurant-head{text-align:center;padding:20px 0 28px}.restaurant-head img{width:105px;height:105px;border-radius:24px;object-fit:cover;border:2px solid #16415e}.restaurant-head h1{margin:12px 0 7px;font-size:28px}.restaurant-head p{color:#91a4b3;line-height:1.8;margin:0}.rating{color:#00dfff;font-weight:800;margin-top:9px}.title{font-size:22px;margin:0 0 16px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product{background:#061b2e;border:1px solid #16415e;border-radius:18px;overflow:hidden}.product img{width:100%;height:180px;object-fit:cover;background:#09243a}.body{padding:15px}.body h2{font-size:18px;margin:0 0 7px}.body p{color:#91a4b3;font-size:13px;line-height:1.7;min-height:44px;margin:0 0 12px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.price{color:#00dfff;font-weight:900;font-size:18px}.add{border:0;border-radius:10px;background:#00dfff;color:#00121d;padding:11px 14px;font-weight:900;cursor:pointer}.empty{text-align:center;padding:45px;color:#91a4b3}
.cart-bar{position:fixed;left:15px;right:15px;bottom:15px;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 18px;border-radius:18px;background:#00dfff;color:#00121d;box-shadow:0 12px 40px #0009;cursor:pointer}.cart-bar-info{display:flex;align-items:center;gap:9px}.cart-bar-icon{width:40px;height:40px;border-radius:12px;background:#00121d;color:#00dfff;display:grid;place-items:center;font-size:20px}.cart-bar small{display:block;opacity:.7;margin-top:2px}.cart-bar button{border:0;border-radius:11px;padding:11px 16px;background:#00121d;color:#fff;font-weight:900;cursor:pointer}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:300;display:none;background:#00dfff;color:#00121d;padding:12px 18px;border-radius:12px;font-weight:800}.toast.show{display:block}
.cart-overlay{position:fixed;inset:0;background:#0009;z-index:500;display:none;align-items:flex-end;justify-content:center}.cart-overlay.show{display:flex}.cart-sheet{width:min(650px,100%);max-height:88vh;overflow:auto;background:#061b2e;border:1px solid #16415e;border-bottom:0;border-radius:25px 25px 0 0;box-shadow:0 -15px 50px #0009;padding:18px}.cart-sheet-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #16415e;padding-bottom:14px;margin-bottom:8px}.cart-sheet-head h2{margin:0}.cart-close{border:0;background:#102f45;color:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}.cart-restaurant{color:#91a4b3;font-size:13px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}.cart-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #15364d}.cart-item-main{display:flex;align-items:center;gap:11px;min-width:0}.cart-item-main img{width:58px;height:58px;border-radius:13px;object-fit:cover;background:#09243a}.cart-item-main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cart-item-main small{display:block;color:#91a4b3;margin-top:5px}.cart-qty{display:flex;align-items:center;gap:7px}.cart-qty button{border:0;border-radius:9px;min-width:34px;height:34px;font-weight:900;cursor:pointer}.cart-plus,.cart-minus{background:#00dfff;color:#00121d}.cart-delete{background:#481527;color:#ff9ab5}.cart-total{padding-top:13px;line-height:2}.cart-total-row{display:flex;justify-content:space-between;color:#c9d6df}.cart-total-row.grand{font-size:20px;font-weight:900;color:#00dfff;border-top:1px solid #16415e;margin-top:8px;padding-top:8px}.checkout-button{width:100%;border:0;border-radius:13px;background:#00dfff;color:#00121d;padding:14px;font-weight:900;font-size:16px;margin-top:13px;cursor:pointer}.cart-empty{text-align:center;padding:35px 10px;color:#91a4b3}.clear-cart-button{border:0;border-radius:9px;background:#481527;color:#ff9ab5;padding:8px 11px;font-weight:bold;cursor:pointer}@media(max-width:850px){.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.products{grid-template-columns:1fr}.cart-bar{left:10px;right:10px;bottom:10px}.cart-sheet{max-height:92vh;border-radius:22px 22px 0 0}.cart-item{align-items:flex-start}.cart-qty{flex-wrap:wrap;justify-content:flex-end}}
</style></head><body>
<header><a href="index.html"><img src="assets/logo.png" class="logo" alt="مندوب"></a><a href="restaurants.html" class="back">← المطاعم</a></header>
<main><section id="restaurantHead" class="restaurant-head"><div class="empty">⏳ جاري تحميل المطعم...</div></section><h2 class="title">🍔 المنتجات</h2><section id="products" class="products"><div class="empty">⏳ جاري تحميل المنتجات...</div></section></main>
<div class="cart-bar" id="cartBar"><div class="cart-bar-info"><div class="cart-bar-icon">🛒</div><div><strong><span id="cartCount">0</span> منتجات في السلة</strong><small id="cartBarTotal">اضغط لعرض السلة</small></div></div><button type="button">عرض السلة</button></div><div id="toast" class="toast"></div>
<div id="cartOverlay" class="cart-overlay"><div class="cart-sheet"><div class="cart-sheet-head"><h2>🛒 سلة الطلب</h2><button class="cart-close" type="button" id="closeCartButton">×</button></div><div id="cartContent"></div></div></div>
<script src="cart-system.js?v=20260820-7"></script>
<script>
(function(){
 const $=id=>document.getElementById(id);
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function getCart(){return window.getMandoubCart?window.getMandoubCart():[]}
 function sub(){return getCart().reduce((s,x)=>s+(Number(x.price)||0)*x.quantity,0)}
 function render(){const cart=getCart(),box=$('cartContent');$('cartCount').textContent=cart.reduce((s,x)=>s+x.quantity,0);$('cartBarTotal').textContent=cart.length?sub().toLocaleString('ar-EG')+' جنيه • اضغط لعرض السلة':'اضغط لعرض السلة';if(!box)return;if(!cart.length){box.innerHTML='<div class="cart-empty">🛒<br><strong>السلة فارغة</strong><br><small>أضف منتجات من المطعم وستظهر هنا</small></div>';return}const r=window.__selectedRestaurant,d=r&&window.getMandoubDelivery?window.getMandoubDelivery(r):{fee:null},feeText=d.fee===-1?'غير متاح لأكثر من 15 كم':d.fee==null?'حدد موقعك لمعرفة الرسوم':d.fee+' جنيه',total=d.fee>0?sub()+d.fee:sub();box.innerHTML='<p class="cart-restaurant"><span>'+esc(cart[0].restaurantName)+'</span><button class="clear-cart-button" onclick="clearMandoubCart()">تفريغ السلة</button></p>'+cart.map(x=>'<div class="cart-item"><div class="cart-item-main">'+(x.image?'<img src="'+esc(x.image)+'">':'')+'<div><strong>'+esc(x.name)+'</strong><small>'+Number(x.price).toLocaleString('ar-EG')+' جنيه</small></div></div><div class="cart-qty"><button class="cart-plus" onclick="changeMandoubQty(\''+esc(x.productId)+'\',1)">+</button><b>'+x.quantity+'</b><button class="cart-minus" onclick="changeMandoubQty(\''+esc(x.productId)+'\',-1)">−</button><button class="cart-delete" onclick="removeMandoubItem(\''+esc(x.productId)+'\')">حذف</button></div></div>').join('')+'<div class="cart-total"><div class="cart-total-row"><span>المنتجات</span><b>'+sub().toLocaleString('ar-EG')+' جنيه</b></div><div class="cart-total-row"><span>رسوم التوصيل</span><b>'+feeText+'</b></div><div class="cart-total-row grand"><span>الإجمالي</span><b>'+total.toLocaleString('ar-EG')+' جنيه</b></div></div><button class="checkout-button" onclick="openCheckout()">إتمام الطلب</button>'}
 window.openCart=function(){render();$('cartOverlay').classList.add('show');document.body.style.overflow='hidden'};
 window.closeCart=function(){$('cartOverlay').classList.remove('show');document.body.style.overflow=''};
 $('cartBar').onclick=window.openCart;$('closeCartButton').onclick=window.closeCart;$('cartOverlay').onclick=e=>{if(e.target===e.currentTarget)window.closeCart()};
 window.addEventListener('mandoubCartChanged',render);window.addEventListener('mandoubLocationChanged',render);document.addEventListener('DOMContentLoaded',render);
})();
</script>
<script type="module">
import{db,authReady}from'./auth.js';import{doc,getDoc,collection,getDocs}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
async function load(){if(!id){$('restaurantHead').innerHTML='<div class="empty">⚠️ لم يتم تحديد المطعم</div>';return}try{await authReady;const rs=await getDoc(doc(db,'restaurants',id));if(!rs.exists())throw Error('not-found');const r={id,...rs.data()};window.__selectedRestaurant=r;$('restaurantHead').innerHTML='<img src="'+(r.image||'assets/logo.png')+'" onerror="this.src=\'assets/logo.png\'" alt=""><h1>'+(r.name||'مطعم')+'</h1><p>'+(r.description||'')+'</p><div class="rating">⭐ '+(r.rating||'4.5')+'</div>';const snap=await getDocs(collection(db,'restaurants',id,'products'));if(snap.empty){$('products').innerHTML='<div class="empty">🍔 لا توجد منتجات حاليًا</div>';return}$('products').innerHTML='';snap.forEach(p=>{const x={id:p.id,...p.data()},card=document.createElement('article');card.className='product';card.innerHTML='<img src="'+(x.image||'assets/logo.png')+'" onerror="this.src=\'assets/logo.png\'" alt=""><div class="body"><h2>'+(x.name||'منتج')+'</h2><p>'+(x.description||'منتج لذيذ من المطعم')+'</p><div class="bottom"><span class="price">'+Number(x.price||0)+' جنيه</span><button class="add" type="button">+ إضافة للسلة</button></div></div>';card.querySelector('.add').onclick=()=>{window.addToCart(x,r);toast('تمت إضافة المنتج للسلة 🛒')};$('products').appendChild(card)}) ;window.dispatchEvent(new CustomEvent('mandoubCartChanged'))}catch(e){console.error(e);$('restaurantHead').innerHTML='<div class="empty">❌ تعذر تحميل المطعم</div>';$('products').innerHTML=''}}load();
</script></body></html>
