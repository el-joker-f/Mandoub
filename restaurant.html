<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>مطعم | مندوب</title>
<style>*{box-sizing:border-box}body{margin:0;background:#020d1b;color:#fff;font-family:Tahoma,Arial,sans-serif}header{position:sticky;top:0;z-index:20;height:70px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:#020d1bf7;border-bottom:1px solid #16415e}.logo{width:50px;height:50px;object-fit:contain}.back{background:#06233a;border:1px solid #16415e;color:#fff;padding:10px 15px;border-radius:11px;text-decoration:none;font-weight:700}main{max-width:1050px;margin:auto;padding:20px 15px 120px}.restaurant-head{text-align:center;padding:20px 0 28px}.restaurant-head img{width:105px;height:105px;border-radius:24px;object-fit:cover;border:2px solid #16415e}.restaurant-head h1{margin:12px 0 7px;font-size:28px}.restaurant-head p{color:#91a4b3;line-height:1.8;margin:0}.rating{color:#00dfff;font-weight:800;margin-top:9px}.title{font-size:22px;margin:0 0 16px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product{background:#061b2e;border:1px solid #16415e;border-radius:18px;overflow:hidden}.product img{width:100%;height:180px;object-fit:cover;background:#09243a}.body{padding:15px}.body h2{font-size:18px;margin:0 0 7px}.body p{color:#91a4b3;font-size:13px;line-height:1.7;min-height:44px;margin:0 0 12px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.price{color:#00dfff;font-weight:900;font-size:18px}.add{border:0;border-radius:10px;background:#00dfff;color:#00121d;padding:11px 14px;font-weight:900;cursor:pointer}.empty{text-align:center;padding:45px;color:#91a4b3}.cart-bar{position:fixed;left:15px;right:15px;bottom:15px;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-radius:16px;background:#00dfff;color:#00121d;box-shadow:0 10px 35px #0008}.cart-bar button{border:0;border-radius:9px;padding:10px 14px;background:#00121d;color:#fff;font-weight:800;cursor:pointer}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:200;display:none;background:#00dfff;color:#00121d;padding:12px 18px;border-radius:12px;font-weight:800}.toast.show{display:block}.restaurant-cart{margin-top:25px;background:#061a2d;border:1px solid #16415e;border-radius:20px;padding:16px}.restaurant-cart:empty{display:none}.restaurant-cart-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.restaurant-cart-head h3{margin:0 0 4px}.restaurant-cart-head small{color:#91a4b3}.clear-cart-button{border:0;border-radius:9px;background:#481527;color:#ff9ab5;padding:9px 12px;font-weight:bold}.restaurant-cart-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #15364d}.restaurant-cart-item>div:first-child{display:flex;align-items:center;gap:10px}.restaurant-cart-item img{width:52px;height:52px;border-radius:10px;object-fit:cover}.restaurant-cart-item small{display:block;color:#91a4b3;margin-top:4px}.qty{display:flex;align-items:center;gap:7px}.qty button{border:0;border-radius:8px;padding:7px 10px;font-weight:bold}.qty-plus,.qty-minus{background:#00dfff;color:#00121d}.item-delete{background:#481527;color:#ff9ab5}.restaurant-cart-summary{margin-top:12px;line-height:2}.restaurant-cart-summary div{display:flex;justify-content:space-between}.restaurant-cart-summary .grand{font-size:20px;color:#00dfff;font-weight:900;border-top:1px solid #16415e;margin-top:8px;padding-top:8px}.checkout-button{width:100%;border:0;border-radius:12px;background:#00dfff;color:#00121d;padding:13px;font-weight:900;font-size:16px;margin-top:12px}@media(max-width:850px){.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.products{grid-template-columns:1fr}.restaurant-cart-item{align-items:flex-start}.qty{flex-wrap:wrap;justify-content:flex-end}}</style></head>
<body>
<header><a href="index.html"><img src="assets/logo.png" class="logo" alt="مندوب"></a><a href="restaurants.html" class="back">← المطاعم</a></header>
<main><section id="restaurantHead" class="restaurant-head"><div class="empty">⏳ جاري تحميل المطعم...</div></section><h2 class="title">🍔 المنتجات</h2><section id="products" class="products"><div class="empty">⏳ جاري تحميل المنتجات...</div></section><section id="restaurantCart" class="restaurant-cart"></section></main>
<div class="cart-bar"><strong>🛒 السلة: <span id="cartCount">0</span></strong><button type="button" id="openCartButton">عرض السلة</button></div><div id="toast" class="toast"></div>
<script src="cart-system.js?v=20260820-3"></script>
<script>window.openCart=function(){const box=document.getElementById('restaurantCart');if(box){box.scrollIntoView({behavior:'smooth',block:'center'});return false}return false};document.getElementById('openCartButton').onclick=window.openCart;</script>
<script type="module">
import{db,authReady}from'./auth.js';import{doc,getDoc,collection,getDocs}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
async function load(){if(!id){$('restaurantHead').innerHTML='<div class="empty">⚠️ لم يتم تحديد المطعم</div>';return}try{await authReady;const rs=await getDoc(doc(db,'restaurants',id));if(!rs.exists())throw Error('not-found');const r={id,...rs.data()};window.__selectedRestaurant=r;$('restaurantHead').innerHTML=`<img src="${r.image||'assets/logo.png'}" onerror="this.src='assets/logo.png'" alt=""><h1>${r.name||'مطعم'}</h1><p>${r.description||''}</p><div class="rating">⭐ ${r.rating||'4.5'}</div>`;const snap=await getDocs(collection(db,'restaurants',id,'products'));if(snap.empty){$('products').innerHTML='<div class="empty">🍔 لا توجد منتجات حاليًا</div>';return}$('products').innerHTML='';snap.forEach(p=>{const x={id:p.id,...p.data()},card=document.createElement('article');card.className='product';card.innerHTML=`<img src="${x.image||'assets/logo.png'}" onerror="this.src='assets/logo.png'" alt=""><div class="body"><h2>${x.name||'منتج'}</h2><p>${x.description||'منتج لذيذ من المطعم'}</p><div class="bottom"><span class="price">${Number(x.price||0)} جنيه</span><button class="add" type="button">+ إضافة للسلة</button></div></div>`;card.querySelector('.add').onclick=()=>{window.addToCart(x,r);toast('تمت إضافة المنتج للسلة 🛒')};$('products').appendChild(card)});window.renderMandoubCart?.();updateCount()}catch(e){console.error(e);$('restaurantHead').innerHTML='<div class="empty">❌ تعذر تحميل المطعم</div>';$('products').innerHTML=''}}
function updateCount(){const c=(window.getMandoubCart?.()||[]).reduce((s,x)=>s+x.quantity,0);$('cartCount').textContent=c}window.addEventListener('mandoubCartChanged',updateCount);load();
</script></body></html>
