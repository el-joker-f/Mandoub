<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>منتجات المطعم | مندوب</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #020d1b;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 70px;
      padding: 10px 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(2, 13, 27, .97);
      border-bottom: 1px solid rgba(0, 224, 255, .2);
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .back {
      border: 1px solid rgba(0, 224, 255, .3);
      background: #06233a;
      color: white;
      padding: 10px 15px;
      border-radius: 11px;
      text-decoration: none;
      font-weight: 700;
    }

    main {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    .restaurant-header {
      text-align: center;
      padding: 20px 0 30px;
    }

    .restaurant-image {
      width: 100px;
      height: 100px;
      margin: 0 auto 15px;

      object-fit: cover;

      border-radius: 25px;

      border: 2px solid rgba(0, 224, 255, .3);

      background: #09243a;
    }

    .restaurant-header h1 {
      font-size: 27px;
      margin-bottom: 7px;
    }

    .restaurant-header p {
      color: #91a4b3;
      font-size: 14px;
      line-height: 1.8;
    }

    .rating {
      margin-top: 10px;
      color: #00dfff;
      font-weight: 800;
    }

    .title {
      font-size: 22px;
      margin-bottom: 18px;
    }

    #loading {
      text-align: center;
      color: #00dfff;
      padding: 30px;
    }

    #error {
      display: none;
      text-align: center;
      color: #ff557f;
      padding: 25px;
    }

    .products {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .product {
      overflow: hidden;

      border-radius: 18px;

      background: #061b2e;

      border: 1px solid rgba(0, 224, 255, .14);

      box-shadow:
        0 10px 30px rgba(0,0,0,.2);
    }

    .product-image {
      width: 100%;
      height: 170px;

      object-fit: cover;

      background:
        radial-gradient(
          circle,
          #123a50,
          #061725
        );
    }

    .product-body {
      padding: 16px;
    }

    .product-body h2 {
      font-size: 19px;
      margin-bottom: 7px;
    }

    .product-body p {
      color: #91a4b3;
      font-size: 13px;
      line-height: 1.8;
      min-height: 45px;
      margin-bottom: 12px;
    }

    .product-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .price {
      color: #00dfff;
      font-size: 18px;
      font-weight: 900;
    }

    .add-button {
      border: 0;
      border-radius: 10px;

      padding: 11px 15px;

      background: #00dfff;
      color: #00121d;

      font-weight: 900;

      cursor: pointer;
    }

    .add-button:active {
      transform: scale(.96);
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #91a4b3;
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .cart-bar {
      position: fixed;
      left: 15px;
      right: 15px;
      bottom: 15px;

      z-index: 500;

      display: none;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding: 13px 15px;

      border-radius: 16px;

      background: #00dfff;
      color: #00121d;

      box-shadow:
        0 10px 35px rgba(0,0,0,.4);
    }

    .cart-bar.show {
      display: flex;
    }

    .cart-bar button {
      border: 0;
      border-radius: 9px;

      padding: 9px 13px;

      background: #00121d;
      color: white;

      font-weight: 800;
    }

    #message {
      position: fixed;

      left: 50%;
      bottom: 85px;

      transform: translateX(-50%);

      z-index: 9999;

      max-width: calc(100% - 30px);

      display: none;

      padding: 12px 18px;

      border-radius: 12px;

      background: #00dfff;
      color: #00121d;

      font-weight: 800;

      text-align: center;
    }

    @media (min-width: 600px) {

      .products {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    @media (min-width: 900px) {

      .products {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }
  </style>
</head>

<body>

  <header>

    <a href="index.html">
      <img
        src="assets/logo.png"
        class="logo"
        alt="مندوب"
      >
    </a>

    <a
      href="restaurants.html"
      class="back">
      ← المطاعم
    </a>

  </header>


  <main>

    <section
      id="restaurantHeader"
      class="restaurant-header">

      <div id="loading">
        جاري تحميل المطعم...
      </div>

    </section>


    <h2 class="title">
      🍔 المنتجات
    </h2>


    <div id="error">
      حصل خطأ أثناء تحميل المنتجات.
    </div>


    <section
      id="products"
      class="products">
    </section>

  </main>


  <div
    id="cartBar"
    class="cart-bar">

    <strong>
      🛒 السلة:
      <span id="cartCount">0</span>
    </strong>

    <button
      type="button"
      onclick="goHome()">
      متابعة الطلب
    </button>

  </div>


  <div id="message"></div>


  <!-- ================= FIREBASE ================= -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      getDocs
    } from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyB6-RVH7-8NrN-AaOOv6QjL9APDeyj7oIU",

      authDomain:
        "mandoub-dv.firebaseapp.com",

      projectId:
        "mandoub-dv",

      storageBucket:
        "mandoub-dv.firebasestorage.app",

      messagingSenderId:
        "311140400335",

      appId:
        "1:311140400335:web:db198b7c53259c53594bba",

      measurementId:
        "G-7V1LJQYYXD"

    };


    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    const params =
      new URLSearchParams(
        window.location.search
      );


    const restaurantId =
      params.get("id");


    const header =
      document.getElementById(
        "restaurantHeader"
      );


    const productsContainer =
      document.getElementById(
        "products"
      );


    const errorBox =
      document.getElementById(
        "error"
      );


    const cartBar =
      document.getElementById(
        "cartBar"
      );


    const cartCount =
      document.getElementById(
        "cartCount"
      );


    let cart = [];


    function showMessage(text) {

      const message =
        document.getElementById(
          "message"
        );

      message.textContent =
        text;

      message.style.display =
        "block";


      setTimeout(() => {

        message.style.display =
          "none";

      }, 2200);

    }


    function updateCart() {

      cartCount.textContent =
        cart.length;


      if (cart.length > 0) {

        cartBar.classList.add(
          "show"
        );

      } else {

        cartBar.classList.remove(
          "show"
        );

      }

    }


    window.addProduct =
      function (
        name,
        price
      ) {

        cart.push({
          name: name,
          price: price
        });


        updateCart();


        showMessage(
          "تمت إضافة " +
          name +
          " للسلة 🛒"
        );

      };


    window.goHome =
      function () {

        window.location.href =
          "index.html";

      };


    async function loadRestaurant() {

      if (!restaurantId) {

        header.innerHTML = `
          <div class="empty">
            <div class="empty-icon">
              ⚠️
            </div>
            <h2>
              لم يتم تحديد المطعم
            </h2>
          </div>
        `;

        return;

      }


      try {

        const restaurantRef =
          doc(
            db,
            "restaurants",
            restaurantId
          );


        const restaurantSnapshot =
          await getDoc(
            restaurantRef
          );


        if (
          !restaurantSnapshot.exists()
        ) {

          header.innerHTML = `
            <div class="empty">
              <div class="empty-icon">
                😔
              </div>
              <h2>
                المطعم غير موجود
              </h2>
            </div>
          `;

          return;

        }


        const restaurant =
          restaurantSnapshot.data();


        const name =
          restaurant.name ||
          "مطعم";


        const description =
          restaurant.description ||
          "";


        const rating =
          restaurant.rating ||
          "4.5";


        const image =
          restaurant.image ||
          "assets/logo.png";


        header.innerHTML = `

          <img
            class="restaurant-image"
            src="${image}"
            alt="${name}"
            onerror="this.src='assets/logo.png'"
          >

          <h1>
            ${name}
          </h1>

          <p>
            ${description}
          </p>

          <div class="rating">
            ⭐ ${rating}
          </div>

        `;


        await loadProducts();


      } catch (error) {

        console.error(
          error
        );

        header.innerHTML =
          "<h2>حدث خطأ أثناء تحميل المطعم ❌</h2>";

        errorBox.style.display =
          "block";

      }

    }


    async function loadProducts() {

      try {

        const productsRef =
          collection(
            db,
            "restaurants",
            restaurantId,
            "products"
          );


        const snapshot =
          await getDocs(
            productsRef
          );


        document.getElementById(
          "loading"
        )?.remove();


        if (snapshot.empty) {

          productsContainer.innerHTML = `

            <div class="empty">

              <div class="empty-icon">
                🍔
              </div>

              <h2>
                لا توجد منتجات حاليًا
              </h2>

              <p>
                المنتجات التي تضيفها من لوحة الأدمن
                ستظهر هنا.
              </p>

            </div>

          `;

          return;

        }


        snapshot.forEach(
          (productDoc) => {

            const product =
              productDoc.data();


            const name =
              product.name ||
              "منتج";


            const description =
              product.description ||
              "منتج لذيذ من المطعم";


            const price =
              Number(
                product.price || 0
              );


            const image =
              product.image ||
              "assets/logo.png";


            const card =
              document.createElement(
                "article"
              );


            card.className =
              "product";


            card.innerHTML = `

              <img
                class="product-image"
                src="${image}"
                alt="${name}"
                onerror="this.src='assets/logo.png'"
              >

              <div class="product-body">

                <h2>
                  ${name}
                </h2>

                <p>
                  ${description}
                </p>

                <div class="product-bottom">

                  <span class="price">
                    ${price} جنيه
                  </span>

                  <button
                    class="add-button"
                    type="button"
                  >
                    + إضافة
                  </button>

                </div>

              </div>

            `;


            const button =
              card.querySelector(
                ".add-button"
              );


            button.addEventListener(
              "click",
              function () {

                addProduct(
                  name,
                  price
                );

              }
            );


            productsContainer.appendChild(
              card
            );

          }
        );


      } catch (error) {

        console.error(
          "Products Error:",
          error
        );

        errorBox.style.display =
          "block";

        errorBox.textContent =
          "حصل خطأ أثناء تحميل المنتجات ❌";

      }

    }


    loadRestaurant();

  </script>

  <script src="delivery-fees.js"></script>
</body>

</html>
