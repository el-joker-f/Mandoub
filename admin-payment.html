<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | إعدادات الدفع</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#020b15,#061a2d);color:#fff}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:22px;margin:16px 0}.field{margin:14px 0}.field label{display:block;margin-bottom:7px;color:#b9c5ce}.field input{width:100%;background:#031321;border:2px solid #21445f;color:#fff;padding:13px;border-radius:12px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer}.primary{background:#00dfff;color:#00131e;width:100%}.back{display:inline-block;color:#fff;text-decoration:none;background:#123650;padding:11px 16px;border-radius:11px}.logos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.logos img{width:100%;height:70px;object-fit:contain;background:#031321;border-radius:12px;padding:7px}.insta{max-width:160px;height:70px;object-fit:contain;background:#031321;border-radius:12px;padding:7px}.msg{margin-top:12px;font-weight:800}@media(max-width:600px){.logos{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="admin.html">← العودة للوحة التحكم</a><h1>💳 إعدادات الدفع</h1><p>الأرقام التي تكتبها هنا ستظهر للعميل في صفحة الدفع.</p><div class="card"><h2>📱 المحفظة</h2><div class="logos"><img src="assets/vodafone-cash.svg" alt="Vodafone Cash"><img src="assets/orange-cash.svg" alt="Orange Cash"><img src="assets/etisalat-cash.svg" alt="Etisalat Cash"></div><div class="field"><label>رقم المحفظة</label><input id="walletNumber" inputmode="tel" placeholder="مثال: 010xxxxxxxx"></div></div><div class="card"><h2>🏦 InstaPay</h2><img class="insta" src="assets/instapay.svg" alt="InstaPay"><div class="field"><label>رقم / عنوان InstaPay</label><input id="instapayNumber" placeholder="مثال: 010xxxxxxxx أو عنوان InstaPay"></div></div><button class="btn primary" id="save">💾 حفظ إعدادات الدفع</button><p id="msg" class="msg"></p></div><script type="module">import{auth,authReady}from'./auth.js';import{getFirestore,doc,getDoc,setDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const db=getFirestore();const wallet=document.getElementById('walletNumber'),insta=document.getElementById('instapayNumber'),msg=document.getElementById('msg');async function init(){try{await authReady;const u=auth.currentUser;if(!u){msg.textContent='❌ سجل الدخول كمسؤول أولاً';return}const s=await getDoc(doc(db,'paymentSettings','main'));if(s.exists()){const d=s.data();wallet.value=d.walletNumber||'';insta.value=d.instapayNumber||''}}catch(e){console.error(e);msg.textContent='❌ تعذر تحميل الإعدادات'}}document.getElementById('save').onclick=async()=>{try{const u=auth.currentUser;if(!u){msg.textContent='❌ سجل الدخول كمسؤول أولاً';return}await setDoc(doc(db,'paymentSettings','main'),{walletNumber:wallet.value.trim(),instapayNumber:insta.value.trim(),updatedAt:new Date()},{merge:true});msg.textContent='✅ تم حفظ إعدادات الدفع';}catch(e){console.error(e);msg.textContent='❌ لا تملك صلاحية تعديل إعدادات الدفع'}};init();</script></body></html>
