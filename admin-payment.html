<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | إعدادات الدفع</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(135deg,#020b15,#061a2d);color:#fff}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:22px;margin:16px 0}.field{margin:14px 0}.field label{display:block;margin-bottom:7px;color:#b9c5ce}.field input{width:100%;background:#031321;border:2px solid #21445f;color:#fff;padding:13px;border-radius:12px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer}.primary{background:#00dfff;color:#00131e;width:100%}.back{display:inline-block;color:#fff;text-decoration:none;background:#123650;padding:11px 16px;border-radius:11px}.wallet-art{width:100%;border-radius:16px;overflow:hidden;background:#031321;margin-bottom:14px}.insta-art{width:100%;height:150px;border-radius:16px;background:#031321;display:grid;place-items:center;margin-bottom:14px}.msg{margin-top:12px;font-weight:800}.lock{background:#102c42;border:1px solid #16415e;border-radius:13px;padding:12px;line-height:1.8}</style></head><body><div class="wrap"><a class="back" href="admin.html">← العودة للوحة التحكم</a><h1>💳 إعدادات الدفع</h1><div class="lock">🔐 هذه الصفحة للعنتيل و<strong>إدارة عالية</strong> فقط. الـAdmin العادي والعملاء لا يمكنهم تعديل الأرقام.</div><div class="card"><h2>📱 الدفع بالمحفظة</h2><div class="wallet-art"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="180"><rect width="900" height="220" rx="32" fill="#061a2d"/><rect x="30" y="30" width="250" height="160" rx="24" fill="#b00020"/><text x="155" y="92" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Vodafone Cash</text><text x="155" y="135" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18">محفظة</text><rect x="325" y="30" width="250" height="160" rx="24" fill="#ff7900"/><text x="450" y="92" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Orange Cash</text><text x="450" y="135" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18">محفظة</text><rect x="620" y="30" width="250" height="160" rx="24" fill="#087a4b"/><text x="745" y="92" text-anchor="middle" fill="#fff" font-family="Arial" font-size="27" font-weight="700">e&amp; cash</text><text x="745" y="135" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18">محفظة</text></svg></div><div class="field"><label>رقم المحفظة</label><input id="walletNumber" inputmode="tel" placeholder="مثال: 010xxxxxxxx"></div></div><div class="card"><h2>🏦 InstaPay</h2><div class="insta-art"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" width="90%" height="120"><rect x="5" y="5" width="510" height="140" rx="28" fill="#132f52"/><circle cx="145" cy="75" r="42" fill="#00dfff"/><path d="M125 75h40M145 55v40" stroke="#00131e" stroke-width="9" stroke-linecap="round"/><text x="330" y="86" text-anchor="middle" fill="#fff" font-family="Arial" font-size="42" font-weight="700">InstaPay</text></svg></div><div class="field"><label>رقم / عنوان InstaPay</label><input id="instapayNumber" placeholder="مثال: 010xxxxxxxx أو عنوان InstaPay"></div></div><button class="btn primary" id="save">💾 حفظ إعدادات الدفع</button><p id="msg" class="msg"></p></div><script type="module">import{auth,authReady,isHighAdmin}from'./auth.js';import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const db=getFirestore(),wallet=document.getElementById('walletNumber'),insta=document.getElementById('instapayNumber'),msg=document.getElementById('msg'),save=document.getElementById('save');async function init(){try{await authReady;const u=auth.currentUser;if(!u){msg.textContent='❌ سجل الدخول أولاً';save.disabled=true;return}if(!(await isHighAdmin())){msg.textContent='❌ ليس لديك صلاحية. هذه الصفحة للعنتيل وإدارة عالية فقط.';save.disabled=true;wallet.disabled=true;insta.disabled=true;return}const s=await getDoc(doc(db,'paymentSettings','main'));if(s.exists()){const d=s.data();wallet.value=d.walletNumber||'';insta.value=d.instapayNumber||''}}catch(e){console.error(e);msg.textContent='❌ تعذر تحميل الإعدادات';save.disabled=true}}save.onclick=async()=>{try{if(!(await isHighAdmin())){msg.textContent='❌ ليس لديك صلاحية تعديل إعدادات الدفع';return}await setDoc(doc(db,'paymentSettings','main'),{walletNumber:wallet.value.trim(),instapayNumber:insta.value.trim(),updatedAt:serverTimestamp(),updatedBy:auth.currentUser?.uid||null},{merge:true});msg.textContent='✅ تم حفظ إعدادات الدفع'}catch(e){console.error(e);msg.textContent='❌ تعذر حفظ الإعدادات'}};init();</script></body></html>
