<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | أكواد الخصم</title><style>*{box-sizing:border-box}body{margin:0;background:#020d18;color:#fff;font-family:Arial,Tahoma}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#061a2d;border:1px solid #16415e;border-radius:20px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;margin-bottom:7px}.field input{width:100%;padding:12px;border-radius:11px;border:2px solid #21445f;background:#031321;color:#fff}.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#00dfff;color:#00131e}.danger{background:#7b1834;color:#fff}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#031321;border:1px solid #16415e;padding:14px;border-radius:14px;margin:9px 0}.muted{color:#91a4b3}@media(max-width:600px){.grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="card"><h1>🎟️ أكواد الخصم</h1><p class="muted">إنشاء كود خصم وتحديد نسبة الخصم وعدد الاستخدامات.</p><button class="btn" style="background:#123650;color:#fff" onclick="location.href='admin.html'">← العودة للوحة التحكم</button></div><div id="app"></div></main><script type="module">import{auth,authReady,db,isSuperAdmin}from'./auth.js';import{collection,query,where,getDocs,addDoc,doc,getDoc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const $=id=>document.getElementById(id);async function init(){await authReady;if(!(await isSuperAdmin())){document.body.innerHTML='<div style="padding:40px;text-align:center;color:#ff8ea8">❌ غير مصرح لك بالدخول</div>';return}document.getElementById('app').innerHTML='<div class="card"><h2>➕ إنشاء كود</h2><div class="grid"><div class="field"><label>الكود *</label><input id="code" placeholder="WELCOME10"></div><div class="field"><label>نسبة الخصم % *</label><input id="percent" type="number" min="1" max="100"></div><div class="field"><label>عدد الاستخدامات (0 = غير محدود)</label><input id="max" type="number" min="0" value="0"></div><div class="field"><label>تاريخ الانتهاء</label><input id="end" type="datetime-local"></div></div><button class="btn primary" id="save">➕ إنشاء الكود</button></div><div class="card"><h2>📋 الأكواد الحالية</h2><div id="list">جاري التحميل...</div></div>';$('save').onclick=async()=>{const code=$('code').value.trim().toUpperCase(),percent=Number($('percent').value),maxUses=Number($('max').value||0),end=$('end').value;if(!/^[A-Z0-9_-]{3,30}$/.test(code)||percent<1||percent>100)return alert('تحقق من الكود ونسبة الخصم ❌');const old=await getDocs(query(collection(db,'coupons'),where('code','==',code)));if(!old.empty)return alert('الكود موجود بالفعل ❌');await addDoc(collection(db,'coupons'),{code,percent,maxUses,usedCount:0,active:true,expiresAt:end?new Date(end):null,createdAt:serverTimestamp(),createdBy:auth.currentUser.uid});alert('تم إنشاء الكود ✅');$('code').value='';$('percent').value='';load()};async function load(){const s=await getDocs(collection(db,'coupons'));$('list').innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="item"><div><b>🎟️ ${x.code}</b><br><span class="muted">خصم ${x.percent}% — الاستخدام ${x.usedCount||0}/${x.maxUses||'∞'}</span></div><button class="btn danger" data-id="${d.id}">${x.active===false?'تفعيل':'تعطيل'}</button></div>`}).join('')||'<p class="muted">لا توجد أكواد.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{const r=doc(db,'coupons',b.dataset.id),s=await getDoc(r);await updateDoc(r,{active:s.data().active===false,updatedAt:serverTimestamp()});load()})}load()}init();</script></body></html>
