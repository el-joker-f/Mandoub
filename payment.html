<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | الدفع وتأكيد الطلب</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#020d18;color:#fff}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:22px;margin:16px 0}.summary div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #16415e}.summary .discount{color:#7ff0ff}.summary .grand{font-size:21px;border:0}.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.method{border:2px solid #21445f;background:#031321;color:#fff;border-radius:14px;padding:15px;cursor:pointer;text-align:center}.method.active{border-color:#00dfff;background:#09283d}.proof{display:none;margin-top:15px}.proof.show{display:block}.field{margin:12px 0}.field label{display:block;margin-bottom:7px}.field input{width:100%;padding:12px;border-radius:12px;border:2px solid #21445f;background:#031321;color:#fff}.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:900;cursor:pointer;width:100%}.primary{background:#00dfff;color:#00131e}.primary:disabled{opacity:.45;cursor:not-allowed}.muted{color:#91a4b3}.msg{margin-top:12px;font-weight:800}.coupon{display:flex;gap:8px}.coupon input{flex:1}.coupon button{width:auto}.notice{background:#102c42;border-radius:12px;padding:12px;line-height:1.8}.upload-ok{color:#7ff0a8;font-weight:800;margin-top:8px}@media(max-width:600px){.methods{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>💳 الدفع وتأكيد الطلب</h1><p class="muted">راجع المبلغ، اختر طريقة الدفع، ثم أكد الطلب.</p><div class="card"><h2>ملخص الطلب</h2><div id="summary" class="summary"></div></div><div class="card"><h2>🎟️ كود الخصم</h2><div class="coupon"><input id="couponCode" placeholder="اكتب كود الخصم"><button id="couponBtn" class="btn primary" onclick="applyCoupon()">تطبيق</button></div><p id="couponMsg" class="msg"></p></div><div class="card"><h2>💰 طريقة الدفع</h2><div class="methods"><button class="method" data-method="cash" onclick="chooseMethod('cash')">💵<br>كاش</button><button class="method" data-method="wallet" onclick="chooseMethod('wallet')">📱<br>محفظة</button><button class="method" data-method="instapay" onclick="chooseMethod('instapay')">🏦<br>InstaPay</button></div><div id="paymentInfo" class="proof"></div><div id="proofBox" class="proof"><div class="field"><label>صورة إثبات التحويل *</label><input id="proofFile" type="file" accept="image/*"></div><div class="field"><label>رقم العملية / المرجع (اختياري)</label><input id="transactionRef"></div><p id="uploadMsg" class="muted">لازم ترفع صورة واضحة لإثبات التحويل قبل تأكيد الطلب.</p></div></div><button id="confirmBtn" class="btn primary" onclick="confirmOrder()" disabled>تأكيد الطلب</button><p id="msg" class="msg"></p></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{getFirestore,collection,addDoc,serverTimestamp,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';import{getStorage,ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js';const firebaseConfig={apiKey:'AIzaSyB6-RVH7-8NrN-AaOOv6Qj9APDeyj7oIU',authDomain:'mandoub-dv.firebaseapp.com',projectId:'mandoub-dv',storageBucket:'mandoub-dv.firebasestorage.app',messagingSenderId:'311140400335',appId:'1:311140400335:web:db198b7c53259c53594bba',measurementId:'G-7V1LJQYYXD'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);let user=null,method='',discountPercent=0,discountValue=0,proofReady=false;const confirmBtn=document.getElementById('confirmBtn'),proofFile=document.getElementById('proofFile');onAuthStateChanged(auth,u=>{user=u;if(!u){document.getElementById('msg').textContent='❌ يجب تسجيل الدخول لإتمام الطلب.';confirmBtn.disabled=true;return}render()});function cart(){try{return JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]')}catch{return[]}}function draft(){try{return JSON.parse(localStorage.getItem('mandoub_checkout_draft')||'{}')}catch{return{}}}function customer(){try{return JSON.parse(localStorage.getItem('mandoub_customer_data')||'{}')}catch{return{}}}function updateConfirm(){confirmBtn.disabled=!user||!method||(method!=='cash'&&!proofReady)}function render(){const d=draft();const base=(d.subtotal||0)+(d.deliveryFee||0);discountValue=Math.min(discountValue,base);const after=base-discountValue;document.getElementById('summary').innerHTML=`<div><span>سعر المنتجات</span><b>${(d.subtotal||0).toLocaleString('ar-EG')} ج</b></div><div><span>رسوم التوصيل</span><b>${(d.deliveryFee||0).toLocaleString('ar-EG')} ج</b></div><div class="discount"><span>الخصم ${discountPercent?`(${discountPercent}%)`:''}</span><b>${discountValue?'- '+discountValue.toLocaleString('ar-EG')+' ج':'0 ج'}</b></div><div><span>بعد الخصم</span><b>${after.toLocaleString('ar-EG')} ج</b></div><div class="grand"><span>الإجمالي النهائي</span><b>${after.toLocaleString('ar-EG')} ج</b></div>`;updateConfirm()}window.chooseMethod=function(m){method=m;proofReady=false;proofFile.value='';document.querySelectorAll('.method').forEach(x=>x.classList.toggle('active',x.dataset.method===m));const info=document.getElementById('paymentInfo'),proof=document.getElementById('proofBox');if(m==='cash'){info.className='proof show';info.innerHTML='<div class="notice">💵 سيتم الدفع نقدًا عند استلام الطلب.</div>';proof.className='proof';proofFile.value=''}else if(m==='wallet'){info.className='proof show';info.innerHTML='<div class="notice">📱 حوّل قيمة الطلب إلى رقم المحفظة المعتمد من مندوب، ثم ارفع صورة التحويل.</div>';proof.className='proof show'}else{info.className='proof show';info.innerHTML='<div class="notice">🏦 حوّل قيمة الطلب عبر InstaPay إلى الحساب المعتمد من مندوب، ثم ارفع صورة التحويل.</div>';proof.className='proof show'}document.getElementById('uploadMsg').textContent=m==='cash'?'': 'لازم ترفع صورة واضحة لإثبات التحويل قبل تأكيد الطلب.';document.getElementById('uploadMsg').className='muted';updateConfirm()};proofFile.addEventListener('change',()=>{proofReady=!!proofFile.files?.[0]&&proofFile.files[0].type.startsWith('image/');const msg=document.getElementById('uploadMsg');msg.textContent=proofReady?'✅ تم اختيار صورة الإثبات. يمكنك الآن تأكيد الطلب.':'❌ اختر صورة إثبات صحيحة.';msg.className=proofReady?'upload-ok':'muted';updateConfirm()});window.applyCoupon=async function(){const code=document.getElementById('couponCode').value.trim().toUpperCase(),msg=document.getElementById('couponMsg');if(!code){msg.textContent='اكتب الكود أولاً';return}try{const s=await getDoc(doc(db,'coupons',code));if(!s.exists()){discountPercent=0;discountValue=0;msg.textContent='❌ كود الخصم غير صحيح';render();return}const c=s.data(),now=Date.now(),start=c.startAt?.toMillis?.()||0,end=c.endAt?.toMillis?.()||Infinity;if(c.active===false||now<start||now>end){discountPercent=0;discountValue=0;msg.textContent='❌ الكود غير متاح حاليًا';render();return}discountPercent=Math.max(0,Math.min(100,Number(c.percent)||0));const d=draft(),base=(d.subtotal||0)+(d.deliveryFee||0);discountValue=base*discountPercent/100;msg.textContent=`✅ خصم ${discountPercent}% = ${discountValue.toFixed(2)} جنيه`;render()}catch(e){console.error(e);msg.textContent='❌ تعذر التحقق من الكود'}};window.confirmOrder=async function(){const msg=document.getElementById('msg'),d=draft(),c=cart(),cust=customer();if(!user){msg.textContent='❌ سجل الدخول أولاً';return}if(!c.length){msg.textContent='❌ السلة فارغة';return}if(!cust.name||!cust.phone||!cust.address||!cust.location){location.href='checkout.html';return}if(!method){msg.textContent='❌ اختر طريقة الدفع';return}let proofUrl=null;if(method!=='cash'){const file=proofFile.files?.[0];if(!file||!proofReady){msg.textContent='❌ لازم تختار صورة إثبات التحويل أولاً';return}if(file.size>8*1024*1024){msg.textContent='❌ الصورة كبيرة جدًا. الحد الأقصى 8MB.';return}}msg.textContent='⏳ جاري إنشاء الطلب...';confirmBtn.disabled=true;try{if(method!=='cash'){const safeName=fileName(file.name);const path=`payment-proofs/${user.uid}/${Date.now()}-${safeName}`;const storageRef=ref(storage,path);await uploadBytes(storageRef,file,{contentType:file.type});proofUrl=await getDownloadURL(storageRef)}const base=(d.subtotal||0)+(d.deliveryFee||0),total=base-discountValue;const refOrder=await addDoc(collection(db,'orders'),{customerId:user.uid,customerName:cust.name,customerPhone:cust.phone,customerAddress:cust.address,location:cust.location,latitude:d.latitude,longitude:d.longitude,restaurantId:d.restaurantId,restaurantName:d.restaurantName,items:c.map(x=>({productId:x.productId,name:x.name,price:x.price,quantity:x.quantity})),subtotal:d.subtotal||0,deliveryFee:d.deliveryFee||0,deliveryDistanceKm:d.distanceKm||0,discountPercent,discountValue,paymentMethod:method,paymentStatus:method==='cash'?'غير مطلوب':'في انتظار المراجعة',paymentProofUrl:proofUrl,transactionRef:document.getElementById('transactionRef')?.value.trim()||'',total,status:'جديد',createdAt:serverTimestamp()});localStorage.setItem('mandoub_last_order_id',refOrder.id);localStorage.removeItem('mandoub_cart_v2');localStorage.removeItem('mandoub_customer_data');localStorage.removeItem('mandoub_checkout_draft');location.href=`track.html?order=${encodeURIComponent(refOrder.id)}`}catch(e){console.error(e);msg.textContent='❌ تعذر إنشاء الطلب: '+(e?.message||'خطأ غير معروف');updateConfirm()}};function fileName(name){return String(name||'proof.jpg').replace(/[^a-zA-Z0-9._-]/g,'_').slice(-80)}</script></body></html>
