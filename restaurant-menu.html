<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>المطعم | مندوب</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--cyan:#00dfff;--navy:#061a2d;--deep:#020d1b;--line:#16415e;--muted:#91a4b3}
html,body{width:100%;max-width:100%;overflow-x:hidden!important}body{background:var(--deep)!important;color:#fff!important;padding-bottom:0!important}.menu-main{width:100%;max-width:920px;margin:auto;background:var(--deep);padding-bottom:35px}.menu-top{position:sticky;top:0;z-index:30;background:#061a2d;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 12px;height:64px}.menu-top a,.menu-top button{border:1px solid var(--line);background:var(--deep);color:#fff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:19px;text-decoration:none}.menu-top .logo{width:46px;height:46px;object-fit:contain;border-radius:12px}.restaurant-hero{background:var(--navy);overflow:hidden;border-bottom:1px solid var(--line)}.hero-cover{height:185px;background:#031321}.hero-cover img{width:100%;height:100%;object-fit:cover;display:block}.hero-info{padding:14px}.hero-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.hero-info h1{font-size:25px;margin:0 0 6px;color:#fff}.hero-info p{color:var(--muted);line-height:1.6;margin:0}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;color:#d8e5ed;font-size:12px}.meta span{background:#031321;border:1px solid var(--line);border-radius:999px;padding:6px 8px}.meta .delivery{color:var(--cyan);background:#061a2d}.location{margin-top:9px}.location button{border:0;border-radius:10px;background:var(--cyan);color:var(--navy);font-weight:900;padding:10px 14px;width:100%}.restaurant-offer-link{display:inline-flex;margin-top:9px;background:var(--cyan);color:var(--navy);text-decoration:none;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:900}.menu-pills{display:flex;gap:7px;overflow-x:auto;padding:9px 10px;border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:64px;z-index:20;background:#061a2d}.menu-pills::-webkit-scrollbar{display:none}.menu-pill{flex:0 0 auto;border:1px solid var(--line);background:var(--deep);color:#d8e5ed;border-radius:999px;padding:8px 11px;font-size:13px;font-weight:800;white-space:nowrap}.menu-pill.active{background:var(--cyan);color:var(--navy);border-color:var(--cyan)}.content-wrap{padding:0 10px}.section-title{font-size:22px;margin:17px 0 11px;color:#fff}.products{display:flex;flex-direction:column;gap:9px;width:100%}.product{position:relative;display:flex;direction:rtl;align-items:stretch;width:100%;height:128px;min-height:128px;background:var(--navy);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 5px 16px rgba(0,0,0,.24);box-sizing:border-box}.product-image-wrap{position:relative;flex:0 0 116px;width:116px;height:126px}.product img{width:116px;height:126px;object-fit:cover;background:#031321;display:block}.add{position:absolute;bottom:8px;left:8px;width:38px;height:38px;border:2px solid var(--cyan);border-radius:50%;background:var(--cyan);color:var(--navy);font-size:25px;line-height:1;box-shadow:0 4px 12px rgba(0,223,255,.18);z-index:2}.body{min-width:0;flex:1;padding:12px 12px 10px;display:flex;flex-direction:column;justify-content:center}.body h2{font-size:17px;color:#fff;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body p{font-size:11px;color:var(--muted);line-height:1.5;height:33px;overflow:hidden;margin:0}.price{font-size:16px;font-weight:900;color:var(--cyan);margin-top:6px}.old-price{text-decoration:line-through;color:#718697;font-size:11px;margin-right:5px;font-weight:500}.controls{display:flex;align-items:center;justify-content:flex-start;gap:6px;margin-top:6px}.controls button{width:28px;height:28px;border:0;border-radius:8px;font-size:18px;font-weight:900;cursor:pointer}.plus{background:var(--cyan);color:var(--navy)}.minus{background:#031321;color:#d8e5ed;border:1px solid var(--line)!important}.qty{min-width:20px;text-align:center;color:#fff}.product-offer{position:absolute;top:8px;right:124px;background:var(--cyan);color:var(--navy);border-radius:6px;padding:4px 6px;font-size:9px;font-weight:900;z-index:3}.offers-section{background:#031321;border-top:1px solid var(--line);margin:18px 0 0;padding:14px 10px 18px}.offers-row{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}.offers-row::-webkit-scrollbar{display:none}.offer-card{flex:0 0 205px;background:var(--navy);border-radius:15px;overflow:hidden;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}.offer-card img{width:100%;height:110px;object-fit:cover;background:#031321}.offer-card .offer-body{padding:9px}.offer-card strong{display:block;color:#fff;font-size:13px}.offer-card small{display:block;color:var(--muted);line-height:1.5;margin-top:4px}.offer-price{font-weight:900;font-size:15px;margin-top:6px;color:var(--cyan)}.offer-price del{color:#718697;font-size:11px;margin-right:5px}.empty{text-align:center;padding:40px 10px;color:var(--muted)}.error{color:#ff7180;text-align:center;padding:30px}@media(min-width:700px){.menu-main{border-left:1px solid var(--line);border-right:1px solid var(--line)}.product{height:145px;min-height:145px}.product-image-wrap,.product img{width:135px;height:143px;flex-basis:135px}.product-offer{right:143px}}@media(max-width:520px){.hero-cover{height:155px}.hero-info h1{font-size:23px}.product{height:116px;min-height:116px}.product-image-wrap,.product img{width:94px;height:114px;flex-basis:94px}.add{width:34px;height:34px;left:6px;bottom:6px;font-size:22px}.body{padding:9px}.body h2{font-size:15px}.body p{font-size:10px;height:30px}.price{font-size:15px}.controls{margin-top:4px}.controls button{width:26px;height:26px;font-size:17px}.product-offer{right:101px;top:7px;font-size:8px}.content-wrap{padding:0 8px}}@media(max-width:380px){.product{height:108px;min-height:108px}.product-image-wrap,.product img{width:84px;height:106px;flex-basis:84px}.body p{display:none}.body h2{font-size:14px}.product-offer{right:91px}.menu-top{height:60px}.menu-pills{top:60px}}
</style>
</head>
<body>
<header class="menu-top"><a href="restaurants.html" aria-label="رجوع">→</a><img class="logo" src="assets/logo.png" alt="مندوب"><button id="favRestaurant" type="button" aria-label="مفضلة">♡</button></header>
<main class="menu-main"><section id="hero" class="restaurant-hero"><div class="empty">جاري تحميل المطعم...</div></section><div id="categoryPills" class="menu-pills"></div><div class="content-wrap"><h2 class="section-title">🔥 اختيارات على ذوقك</h2><div id="products" class="products"></div></div><section class="offers-section"><div class="content-wrap"><h2 class="section-title" style="margin-top:0">🎁 عروض المطعم</h2><div id="offers" class="offers-row"></div></div></section><div id="error" class="error" hidden></div></main>
<script src="cart-system.js?v=20260822-2"></script><script src="delivery-fees.js?v=20260822-5"></script><script src="checkout-flow.js?v=20260822-2"></script>
<script type="module">
import{getFirestore,doc,getDoc,collection,getDocs}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';import{auth,authReady}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
const db=getFirestore(),id=new URLSearchParams(location.search).get('id');let restaurant=null,products=[],offers=[],category='all';
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ar-EG')+' ج.م';
function getCart(){try{return JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]')}catch{return []}}function saveCart(c){localStorage.setItem('mandoub_cart_v2',JSON.stringify(c));window.dispatchEvent(new CustomEvent('mandoubCartChanged'))}function qty(pid){return getCart().find(x=>x.productId===pid)?.quantity||0}
window.addToCartFromMenu=(p,r)=>{const c=getCart();if(c.length&&c[0].restaurantId!==r.id){alert(`⚠️ السلة تحتوي منتجات من «${c[0].restaurantName}».\nلا يمكن خلط طلبين من مطعمين مختلفين.\nافتح السلة وافرغها أولاً ثم اختر من «${r.name}».`);return}const old=c.find(x=>x.productId===p.id);if(old)old.quantity++;else c.push({productId:p.id,restaurantId:r.id,restaurantName:r.name,name:p.name,price:Number(p.price)||0,image:p.image||'',quantity:1});saveCart(c);renderProducts()};
window.changeProduct=(pid,delta)=>{const p=products.find(x=>x.id===pid);if(!p)return;if(delta>0){window.addToCartFromMenu(p,restaurant);return}const c=getCart(),x=c.find(i=>i.productId===pid);if(x){x.quantity--;if(x.quantity<=0)c.splice(c.indexOf(x),1);saveCart(c)}renderProducts()};window.setLocation=()=>window.setMandoubLocation?.();
function activeOffer(o){if(o.active===false)return false;const now=Date.now(),s=o.startAt?.toDate?o.startAt.toDate().getTime():o.startAt?new Date(o.startAt).getTime():0,e=o.endAt?.toDate?o.endAt.toDate().getTime():o.endAt?new Date(o.endAt).getTime():0;return(!s||now>=s)&&(!e||now<=e)}
function renderCategories(){const cats=[...new Set(products.map(p=>p.category||p.foodCategory).filter(Boolean))];document.getElementById('categoryPills').innerHTML='<button class="menu-pill active" data-cat="all">الكل</button>'+cats.map(c=>`<button class="menu-pill" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('.menu-pill').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('.menu-pill').forEach(x=>x.classList.toggle('active',x===b));renderProducts()})}
function renderProducts(){const list=products.filter(p=>category==='all'||(p.category||p.foodCategory||'')===category);document.getElementById('products').innerHTML=list.length?list.map(p=>`<article class="product"><div class="product-image-wrap"><img src="${esc(p.image||'assets/logo.png')}" onerror="this.onerror=null;this.src='assets/logo.png'" alt="${esc(p.name||'منتج')}">${p.discount?`<span class="product-offer">خصم ${esc(p.discount)}%</span>`:''}<button class="add" onclick="changeProduct('${esc(p.id)}',1)">+</button></div><div class="body"><h2>${esc(p.name||'منتج')}</h2><p>${esc(p.description||'منتج مميز من المطعم')}</p><div class="price">${money(p.price)} ${p.oldPrice?`<del class="old-price">${money(p.oldPrice)}</del>`:''}</div><div class="controls"><button class="minus" onclick="changeProduct('${esc(p.id)}',-1)">−</button><b class="qty" id="q-${esc(p.id)}">${qty(p.id)}</b><button class="plus" onclick="changeProduct('${esc(p.id)}',1)">+</button></div></div></article>`).join(''):'<div class="empty">🍔 لا توجد منتجات في هذا القسم حاليًا</div>'}
function renderOffers(){const box=document.getElementById('offers');const list=offers.filter(activeOffer);box.innerHTML=list.length?list.map(o=>`<article class="offer-card" onclick="location.href='offers.html?restaurantId=${encodeURIComponent(restaurant.id)}'"><img src="${esc(o.image||'assets/logo.png')}" onerror="this.onerror=null;this.src='assets/logo.png'" alt="${esc(o.title||'عرض')}"><div class="offer-body"><strong>${esc(o.title||'عرض')}</strong><small>${esc(o.description||'عرض خاص من المطعم')}</small><div class="offer-price">${money(o.price)} ${o.oldPrice?`<del>${money(o.oldPrice)}</del>`:''}</div></div></article>`).join(''):'<div class="empty">لا توجد عروض حالية لهذا المطعم</div>'}
function refresh(){products.forEach(p=>{const e=document.getElementById('q-'+p.id);if(e)e.textContent=qty(p.id)});const e=document.getElementById('delivery');if(e&&restaurant&&window.getMandoubDelivery){const d=window.getMandoubDelivery(restaurant);e.textContent=d?.fee==null?'حدد موقعك لمعرفة رسوم التوصيل':d.fee===-1?'خارج نطاق التوصيل':`التوصيل ${d.fee} ج${d.distance!=null?' • '+Number(d.distance).toFixed(1)+' كم':''}`}}
window.addEventListener('mandoubCartChanged',refresh);window.addEventListener('mandoubLocationChanged',refresh);window.addEventListener('storage',refresh);
async function load(){if(!id){document.getElementById('hero').innerHTML='<div class="empty">لم يتم تحديد المطعم.</div>';return}try{const s=await getDoc(doc(db,'restaurants',id));if(!s.exists())throw Error('not found');restaurant={id,...s.data()};const heroImg=restaurant.coverImage||restaurant.image||'assets/logo.png';const os=await getDocs(collection(db,'offers'));offers=os.docs.map(d=>({id:d.id,...d.data()})).filter(o=>o.restaurantId===id&&activeOffer(o));const offerLink=offers.length?`<a class="restaurant-offer-link" href="offers.html?restaurantId=${encodeURIComponent(id)}">🎁 ${offers.length===1?'يوجد عرض متاح الآن':`${offers.length} عروض متاحة الآن`}</a>`:'';document.getElementById('hero').innerHTML=`<div class="hero-cover"><img src="${esc(heroImg)}" onerror="this.onerror=null;this.src='assets/logo.png'" alt="${esc(restaurant.name||'مطعم')}"></div><div class="hero-info"><div class="hero-title-row"><div><h1>${esc(restaurant.name||'مطعم')}</h1><p>${esc(restaurant.description||'اطلب أشهى المنتجات من مطعمك المفضل')}</p></div><span style="font-size:24px">⭐</span></div><div class="meta"><span>⭐ ${esc(restaurant.rating||'—')}</span><span>${esc(restaurant.category||restaurant.foodCategory||'مطعم')}</span><span id="delivery" class="delivery">حدد موقعك لمعرفة رسوم التوصيل</span></div><div class="location"><button onclick="setLocation()">📍 تحديد موقعي</button></div>${offerLink}</div>`;const ps=await getDocs(collection(db,'restaurants',id,'products'));products=ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false);renderCategories();renderProducts();renderOffers();refresh()}catch(e){console.error(e);document.getElementById('error').hidden=false;document.getElementById('error').textContent='❌ تعذر تحميل المطعم أو المنتجات'}}
(async()=>{try{await authReady}catch{}onAuthStateChanged(auth,()=>{});load()})();
window.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{const s=document.createElement('style');s.id='mandoubFinalMenuCards';s.textContent=`html,body{overflow-x:hidden!important;width:100%!important;max-width:100%!important}.menu-main{width:100%!important;max-width:920px!important;background:#020d1b!important;color:#fff!important}.products{display:flex!important;flex-direction:column!important;gap:9px!important;width:100%!important}.product{display:flex!important;direction:rtl!important;align-items:stretch!important;width:100%!important;height:128px!important;min-height:128px!important;max-height:128px!important;box-sizing:border-box!important;background:#061a2d!important;border:1px solid #16415e!important;border-radius:17px!important;overflow:hidden!important}.product-image-wrap,.product img{width:116px!important;height:126px!important;flex:0 0 116px!important;object-fit:cover!important}.body{min-width:0!important;flex:1!important;overflow:hidden!important}.body h2,.body p{overflow:hidden!important;text-overflow:ellipsis!important}.product-offer{right:124px!important}@media(max-width:520px){.product{height:116px!important;min-height:116px!important;max-height:116px!important}.product-image-wrap,.product img{width:94px!important;height:114px!important;flex-basis:94px!important}.product-offer{right:101px!important}}@media(max-width:380px){.product{height:108px!important;min-height:108px!important;max-height:108px!important}.product-image-wrap,.product img{width:84px!important;height:106px!important;flex-basis:84px!important}.product-offer{right:91px!important}}`;document.head.appendChild(s)},0)});
</script>
</body>
</html>
