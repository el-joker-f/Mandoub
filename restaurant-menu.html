<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>المطعم | مندوب</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--cyan:#00dfff;--navy:#061a2d;--line:#cfe2e9;--muted:#718794}
html,body{width:100%;max-width:100%;overflow-x:hidden}body{background:#f7fbfd;color:var(--navy);padding-bottom:0}.menu-main{max-width:920px;margin:auto;padding:0 0 35px;background:#f7fbfd}.menu-top{position:sticky;top:0;z-index:30;background:rgba(247,251,253,.96);backdrop-filter:blur(12px);border-bottom:1px solid #d9e8ed;display:flex;align-items:center;justify-content:space-between;padding:8px 12px}.menu-top a,.menu-top button{border:1px solid #cfe2e9;background:#fff;color:var(--navy);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:19px;text-decoration:none}.menu-top .logo{width:46px;height:46px;object-fit:contain;border-radius:12px}.restaurant-hero{background:#fff;overflow:hidden;border-bottom:1px solid #dce9ee}.hero-cover{height:185px;background:#eaf4f7}.hero-cover img{width:100%;height:100%;object-fit:cover}.hero-info{padding:15px 16px 12px}.hero-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.hero-info h1{font-size:26px;margin:0 0 6px;color:var(--navy)}.hero-info p{color:#687f8b;line-height:1.7;margin:0}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;color:#4b6572;font-size:13px}.meta span{background:#eef7f9;border:1px solid #d8eaf0;border-radius:999px;padding:6px 9px}.meta .delivery{color:#007f9b;background:#e9fbff}.location{margin-top:10px}.location button{border:0;border-radius:10px;background:var(--cyan);color:var(--navy);font-weight:900;padding:10px 14px;width:100%}.restaurant-offer-link{display:inline-flex;margin-top:10px;background:var(--navy);color:#fff;text-decoration:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:900}.menu-pills{display:flex;gap:8px;overflow:auto;padding:10px 12px;border-bottom:1px solid #dce9ee;scrollbar-width:none;position:sticky;top:59px;z-index:20;background:rgba(247,251,253,.96);backdrop-filter:blur(10px)}.menu-pills::-webkit-scrollbar{display:none}.menu-pill{flex:0 0 auto;border:1px solid #cfe2e9;background:#fff;color:#526c79;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:800;white-space:nowrap}.menu-pill.active{background:var(--cyan);color:var(--navy);border-color:var(--cyan)}.content-wrap{padding:0 12px}.section-title{font-size:24px;margin:18px 0 12px;color:var(--navy)}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{position:relative;background:#fff;border:1px solid #d7e7ec;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px rgba(6,26,45,.07)}.product-image-wrap{position:relative}.product img{width:100%;height:145px;object-fit:cover;background:#eaf4f7;display:block}.add{position:absolute;bottom:-15px;right:12px;width:44px;height:44px;border:2px solid var(--cyan);border-radius:50%;background:#fff;color:var(--navy);font-size:28px;line-height:1;box-shadow:0 4px 12px rgba(6,26,45,.14);z-index:2}.body{padding:21px 12px 12px}.body h2{font-size:16px;color:var(--navy);margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body p{font-size:12px;color:#758b96;line-height:1.6;height:39px;overflow:hidden;margin:0}.price{font-size:17px;font-weight:900;color:var(--navy);margin-top:7px}.old-price{text-decoration:line-through;color:#9aaab2;font-size:12px;margin-right:5px;font-weight:500}.controls{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}.controls button{width:30px;height:30px;border:0;border-radius:9px;font-size:19px;font-weight:900;cursor:pointer}.plus{background:var(--cyan);color:var(--navy)}.minus{background:#e8f1f4;color:#344f5c}.qty{min-width:20px;text-align:center;color:var(--navy)}.product-offer{position:absolute;top:9px;right:9px;background:var(--cyan);color:var(--navy);border-radius:7px;padding:4px 7px;font-size:10px;font-weight:900;z-index:3}.offers-section{background:#eef8fa;border-top:1px solid #dcecef;margin:22px 0 0;padding:16px 12px 20px}.offers-row{display:flex;gap:10px;overflow:auto;scrollbar-width:none}.offers-row::-webkit-scrollbar{display:none}.offer-card{flex:0 0 210px;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #cfe2e9;box-shadow:0 4px 14px rgba(6,26,45,.06);cursor:pointer}.offer-card img{width:100%;height:115px;object-fit:cover;background:#eaf4f7}.offer-card .offer-body{padding:10px}.offer-card strong{display:block;color:var(--navy);font-size:14px}.offer-card small{display:block;color:#718792;line-height:1.5;margin-top:4px}.offer-price{font-weight:900;font-size:16px;margin-top:6px;color:var(--navy)}.offer-price del{color:#9da7ad;font-size:12px;margin-right:5px}.empty{text-align:center;padding:45px 10px;color:#738995}.error{color:#d84d5f;text-align:center;padding:30px}@media(min-width:700px){.menu-main{border-left:1px solid #dce8ed;border-right:1px solid #dce8ed}.products{grid-template-columns:repeat(3,minmax(0,1fr))}.hero-cover{height:230px}}@media(max-width:420px){.hero-cover{height:150px}.hero-info h1{font-size:23px}.products{gap:9px}.product img{height:125px}.body{padding-left:9px;padding-right:9px}.body h2{font-size:15px}}
</style>
</head>
<body>
<header class="menu-top"><a href="restaurants.html" aria-label="رجوع">→</a><img class="logo" src="assets/logo.png" alt="مندوب"><button id="favRestaurant" type="button" aria-label="مفضلة">♡</button></header>
<main class="menu-main"><section id="hero" class="restaurant-hero"><div class="empty">جاري تحميل المطعم...</div></section><div id="categoryPills" class="menu-pills"></div><div class="content-wrap"><h2 class="section-title">🔥 اختيارات على ذوقك</h2><div id="products" class="products"></div></div><section class="offers-section"><div class="content-wrap"><h2 class="section-title" style="margin-top:0">🎁 عروض المطعم</h2><div id="offers" class="offers-row"></div></div></section><div id="error" class="error" hidden></div></main>
<script src="cart-system.js?v=20260822-2"></script><script src="delivery-fees.js?v=20260822-2"></script><script src="checkout-flow.js?v=20260822-2"></script>
<script type="module">
import{getFirestore,doc,getDoc,collection,getDocs}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';import{auth,authReady}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
const db=getFirestore(),id=new URLSearchParams(location.search).get('id');let restaurant=null,products=[],offers=[],category='all';
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ar-EG')+' ج.م';
function getCart(){try{return JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]')}catch{return []}}function saveCart(c){localStorage.setItem('mandoub_cart_v2',JSON.stringify(c));window.dispatchEvent(new CustomEvent('mandoubCartChanged'))}function qty(pid){return getCart().find(x=>x.productId===pid)?.quantity||0}
window.addToCartFromMenu=(p,r)=>{const c=getCart();if(c.length&&c[0].restaurantId!==r.id){alert(`⚠️ السلة تحتوي منتجات من «${c[0].restaurantName}».\nلا يمكن خلط طلبين من مطعمين مختلفين.\nافتح السلة وافرغها أولاً ثم اختر من «${r.name}».`);return}const old=c.find(x=>x.productId===p.id);if(old)old.quantity++;else c.push({productId:p.id,restaurantId:r.id,restaurantName:r.name,name:p.name,price:Number(p.price)||0,image:p.image||'',quantity:1});saveCart(c);renderProducts()};
window.changeProduct=(pid,delta)=>{const p=products.find(x=>x.id===pid);if(!p)return;if(delta>0){window.addToCartFromMenu(p,restaurant);return}const c=getCart(),x=c.find(i=>i.productId===pid);if(x){x.quantity--;if(x.quantity<=0)c.splice(c.indexOf(x),1);saveCart(c)}renderProducts()};window.setLocation=()=>window.setMandoubLocation?.();
function activeOffer(o){if(o.active===false)return false;const now=Date.now(),s=o.startAt?.toDate?o.startAt.toDate().getTime():o.startAt?new Date(o.startAt).getTime():0,e=o.endAt?.toDate?o.endAt.toDate().getTime():o.endAt?new Date(o.endAt).getTime():0;return(!s||now>=s)&&(!e||now<=e)}
function renderCategories(){const cats=[...new Set(products.map(p=>p.category||p.foodCategory).filter(Boolean))];document.getElementById('categoryPills').innerHTML='<button class="menu-pill active" data-cat="all">الكل</button>'+cats.map(c=>`<button class="menu-pill" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('.menu-pill').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('.menu-pill').forEach(x=>x.classList.toggle('active',x===b));renderProducts()})}
function renderProducts(){const list=products.filter(p=>category==='all'||(p.category||p.foodCategory||'')===category);document.getElementById('products').innerHTML=list.length?list.map(p=>`<article class="product"><div class="product-image-wrap"><img src="${esc(p.image||'assets/logo.png')}" onerror="this.onerror=null;this.src='assets/logo.png'" alt="${esc(p.name)}">${p.discount?`<span class="product-offer">خصم ${esc(p.discount)}%</span>`:''}<button class="add" onclick="changeProduct('${esc(p.id)}',1)">+</button></div><div class="body"><h2>${esc(p.name||'منتج')}</h2><p>${esc(p.description||'منتج مميز من المطعم')}</p><div class="price">${money(p.price)} ${p.oldPrice?`<del class="old-price">${money(p.oldPrice)}</del>`:''}</div><div class="controls"><button class="minus" onclick="changeProduct('${esc(p.id)}',-1)">−</button><b class="qty" id="q-${esc(p.id)}">${qty(p.id)}</b><button class="plus" onclick="changeProduct('${esc(p.id)}',1)">+</button></div></div></article>`).join(''):'<div class="empty">🍔 لا توجد منتجات في هذا القسم حاليًا</div>'}
function renderOffers(){const box=document.getElementById('offers');const list=offers.filter(activeOffer);box.innerHTML=list.length?list.map(o=>`<article class="offer-card" onclick="location.href='offers.html?restaurantId=${encodeURIComponent(restaurant.id)}'"><img src="${esc(o.image||'assets/logo.png')}" onerror="this.onerror=null;this.src='assets/logo.png'" alt="${esc(o.title)}"><div class="offer-body"><strong>${esc(o.title||'عرض')}</strong><small>${esc(o.description||'عرض خاص من المطعم')}</small><div class="offer-price">${money(o.price)} ${o.oldPrice?`<del>${money(o.oldPrice)}</del>`:''}</div></div></article>`).join(''):'<div class="empty">لا توجد عروض حالية لهذا المطعم</div>'}
function refresh(){products.forEach(p=>{const e=document.getElementById('q-'+p.id);if(e)e.textContent=qty(p.id)});const e=document.getElementById('delivery');if(e&&restaurant&&window.getMandoubDelivery){const d=window.getMandoubDelivery(restaurant);e.textContent=d?.fee==null?'حدد موقعك لمعرفة رسوم التوصيل':d.fee===-1?'خارج نطاق التوصيل':`التوصيل ${d.fee} ج${d.distance!=null?' • '+Number(d.distance).toFixed(1)+' كم':''}`}}window.addEventListener('mandoubCartChanged',refresh);window.addEventListener('mandoubLocationChanged',refresh);window.addEventListener('storage',refresh);
async function load(){if(!id){document.getElementById('hero').innerHTML='<div class="empty">لم يتم تحديد المطعم.</div>';return}try{const s=await getDoc(doc(db,'restaurants',id));if(!s.exists())throw Error('not found');restaurant={id,...s.data()};const heroImg=restaurant.coverImage||restaurant.image||'assets/logo.png';const os=await getDocs(collection(db,'offers'));offers=os.docs.map(d=>({id:d.id,...d.data()})).filter(o=>o.restaurantId===id&&activeOffer(o));const offerLink=offers.length?`<a class="restaurant-offer-link" href="offers.html?restaurantId=${encodeURIComponent(id)}">🎁 ${offers.length===1?'يوجد عرض متاح الآن':`${offers.length} عروض متاحة الآن`}</a>`:'';document.getElementById('hero').innerHTML=`<div class="hero-cover"><img src="${esc(heroImg)}" onerror="this.onerror=null;this.src='assets/logo.png'" alt="${esc(restaurant.name)}"></div><div class="hero-info"><div class="hero-title-row"><div><h1>${esc(restaurant.name||'مطعم')}</h1><p>${esc(restaurant.description||'اطلب أشهى المنتجات من مطعمك المفضل')}</p></div><span style="font-size:24px">⭐</span></div><div class="meta"><span>⭐ ${esc(restaurant.rating||'—')}</span><span>${esc(restaurant.category||restaurant.foodCategory||'مطعم')}</span><span id="delivery" class="delivery">حدد موقعك لمعرفة رسوم التوصيل</span></div><div class="location"><button onclick="setLocation()">📍 تحديد موقعي</button></div>${offerLink}</div>`;const ps=await getDocs(collection(db,'restaurants',id,'products'));products=ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false);renderCategories();renderProducts();renderOffers();refresh()}catch(e){console.error(e);document.getElementById('error').hidden=false;document.getElementById('error').textContent='❌ تعذر تحميل المطعم أو المنتجات'}}
(async()=>{try{await authReady}catch{}onAuthStateChanged(auth,()=>{});load()})();
</script>
</body></html>
