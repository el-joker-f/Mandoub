<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>المطعم | مندوب</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--cyan:#00dfff;--navy:#061a2d;--deep:#020d1b;--line:#16415e;--muted:#91a4b3}
html,body{width:100%;max-width:100%;overflow-x:hidden!important}body{background:var(--deep)!important;color:#fff!important;padding-bottom:0!important}.menu-main{width:100%;max-width:920px;margin:auto;background:var(--deep);padding-bottom:95px}.menu-top{position:sticky;top:0;z-index:30;background:#061a2d;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 12px;height:64px}.menu-top a,.menu-top button{border:1px solid var(--line);background:var(--deep);color:#fff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:19px;text-decoration:none}.menu-top .logo{width:46px;height:46px;object-fit:contain;border-radius:12px}.restaurant-hero{background:var(--navy);overflow:hidden;border-bottom:1px solid var(--line)}.hero-cover{height:185px;background:#031321}.hero-cover img{width:100%;height:100%;object-fit:cover;display:block}.hero-info{padding:14px}.hero-info h1{font-size:25px;margin:0 0 6px;color:#fff}.hero-info p{color:var(--muted);line-height:1.6;margin:0}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;color:#d8e5ed;font-size:12px}.meta span{background:#031321;border:1px solid var(--line);border-radius:999px;padding:6px 8px}.menu-pills{display:flex;gap:7px;overflow-x:auto;padding:9px 10px;border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:64px;z-index:20;background:#061a2d}.menu-pills::-webkit-scrollbar{display:none}.menu-pill{flex:0 0 auto;border:1px solid var(--line);background:var(--deep);color:#d8e5ed;border-radius:999px;padding:8px 11px;font-size:13px;font-weight:800;white-space:nowrap}.menu-pill.active{background:var(--cyan);color:var(--navy);border-color:var(--cyan)}.content-wrap{padding:0 10px}.section-title{font-size:22px;margin:17px 0 11px;color:#fff}.products{display:flex;flex-direction:column;gap:9px;width:100%}.product{position:relative;display:flex;direction:rtl;align-items:stretch;width:100%;height:128px;min-height:128px;background:var(--navy);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 5px 16px rgba(0,0,0,.24);box-sizing:border-box}.product-image-wrap{position:relative;flex:0 0 116px;width:116px;height:126px}.product img{width:116px;height:126px;object-fit:cover;background:#031321;display:block}.add{position:absolute;bottom:8px;left:8px;width:38px;height:38px;border:2px solid var(--cyan);border-radius:50%;background:var(--cyan);color:var(--navy);font-size:25px;line-height:1;box-shadow:0 4px 12px rgba(0,223,255,.18);z-index:2;cursor:pointer}.body{min-width:0;flex:1;padding:12px;display:flex;flex-direction:column;justify-content:center}.body h2{font-size:17px;color:#fff;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body p{font-size:11px;color:var(--muted);line-height:1.5;height:33px;overflow:hidden;margin:0}.price{font-size:16px;font-weight:900;color:var(--cyan);margin-top:6px}.controls{display:flex;align-items:center;gap:5px;margin-top:5px}.controls button{width:30px;height:30px;border:0;border-radius:50%;font-size:18px;font-weight:900;cursor:pointer}.plus{background:var(--cyan);color:var(--navy)}.minus{background:#031321;color:#d8e5ed;border:1px solid var(--line)!important}.qty{min-width:22px;text-align:center;color:#fff}.product-offer{position:absolute;top:8px;right:124px;background:var(--cyan);color:var(--navy);border-radius:6px;padding:4px 6px;font-size:9px;font-weight:900;z-index:3}.offers-section{background:#031321;border-top:1px solid var(--line);margin:18px 0 0;padding:14px 10px 18px}.offers-row{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}.offer-card{flex:0 0 205px;background:var(--navy);border-radius:15px;overflow:hidden;border:1px solid var(--line)}.offer-card img{width:100%;height:110px;object-fit:cover}.offer-card .offer-body{padding:9px}.offer-card strong{display:block;color:#fff;font-size:13px}.offer-card small{display:block;color:var(--muted);line-height:1.5;margin-top:4px}.offer-price{font-weight:900;font-size:15px;margin-top:6px;color:var(--cyan)}.empty{text-align:center;padding:40px 10px;color:var(--muted)}.error{color:#ff7180;text-align:center;padding:30px}.menu-cart-bar{position:fixed;display:none;right:10px;left:10px;bottom:10px;z-index:9999;max-width:900px;margin:auto;background:#061a2d;color:#fff;border:2px solid var(--cyan);border-radius:16px;padding:12px 15px;align-items:center;justify-content:space-between;box-shadow:0 8px 25px #0008;cursor:pointer}.menu-cart-bar.show{display:flex}.menu-cart-bar .cart-info{display:flex;align-items:center;gap:9px}.menu-cart-bar .cart-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--cyan);color:var(--navy)}.menu-cart-bar small{display:block;color:var(--muted);margin-top:2px}.menu-cart-bar .total{font-size:18px;font-weight:900;color:var(--cyan)}
@media(max-width:520px){.hero-cover{height:155px}.hero-info h1{font-size:23px}.product{height:116px;min-height:116px}.product-image-wrap,.product img{width:94px;height:114px;flex-basis:94px}.add{width:34px;height:34px;left:6px;bottom:6px;font-size:22px}.body{padding:9px}.body h2{font-size:15px}.body p{font-size:10px;height:30px}.price{font-size:15px}.controls{margin-top:4px}.controls button{width:28px;height:28px;font-size:17px}.product-offer{right:101px;top:7px;font-size:8px}.content-wrap{padding:0 8px}}
</style></head><body>
<header class="menu-top"><a href="restaurants.html" aria-label="رجوع">→</a><img class="logo" src="assets/logo.png" alt="مندوب"><button id="favRestaurant" type="button" aria-label="مفضلة">♡</button></header>
<main class="menu-main"><section id="hero" class="restaurant-hero"><div class="empty">جاري تحميل المطعم...</div></section><div id="categoryPills" class="menu-pills"></div><div class="content-wrap"><h2 class="section-title">🔥 اختيارات على ذوقك</h2><div id="products" class="products"></div></div><section class="offers-section"><div class="content-wrap"><h2 class="section-title" style="margin-top:0">🎁 عروض المطعم</h2><div id="offers" class="offers-row"></div></div></section><div id="error" class="error" hidden></div></main>
<div id="menuCartBar" class="menu-cart-bar" onclick="location.href='cart.html'"><div class="cart-info"><span class="cart-icon">🛒</span><div><strong>عرض السلة</strong><small id="menuCartCount">0 منتج</small></div></div><b id="menuCartTotal" class="total">0 ج.م</b></div>
<script src="cart-system.js?v=20260822-99"></script><script src="delivery-fees.js?v=20260822-5"></script><script src="checkout-flow.js?v=20260822-2"></script>
<script type="module">
import './auth.js';import{getFirestore,doc,getDoc,collection,getDocs}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
const db=getFirestore(),id=new URLSearchParams(location.search).get('id');let restaurant=null,products=[],offers=[],category='all';
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ar-EG')+' ج.م';function getCart(){try{return JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]')}catch{return[]}}function saveCart(c){localStorage.setItem('mandoub_cart_v2',JSON.stringify(c));window.dispatchEvent(new CustomEvent('mandoubCartChanged'))}function qty(pid){return getCart().find(x=>x.productId===pid)?.quantity||0}
window.changeProduct=(pid,delta)=>{const p=products.find(x=>x.id===pid);if(!p)return;const c=getCart();if(delta>0){if(c.length&&c[0].restaurantId!==restaurant.id){alert(`⚠️ السلة تحتوي منتجات من «${c[0].restaurantName}».\nلا يمكن خلط طلبين من مطعمين مختلفين.`);return}const x=c.find(i=>i.productId===pid);if(x)x.quantity++;else c.push({productId:p.id,restaurantId:restaurant.id,restaurantName:restaurant.name,name:p.name,price:Number(p.price)||0,image:p.image||'',quantity:1})}else{const x=c.find(i=>i.productId===pid);if(x){x.quantity--;if(x.quantity<=0)c.splice(c.indexOf(x),1)}}saveCart(c);renderProducts()};
function renderBar(){const c=getCart(),count=c.reduce((s,x)=>s+Number(x.quantity||0),0),total=c.reduce((s,x)=>s+Number(x.price||0)*Number(x.quantity||0),0),b=document.getElementById('menuCartBar');b.classList.toggle('show',count>0);document.getElementById('menuCartCount').textContent=`${count} ${count===1?'منتج':'منتجات'}`;document.getElementById('menuCartTotal').textContent=money(total)}
function renderCategories(){const cats=[...new Set(products.map(p=>p.category||p.foodCategory).filter(Boolean))];document.getElementById('categoryPills').innerHTML='<button class="menu-pill active" data-cat="all">الكل</button>'+cats.map(c=>`<button class="menu-pill" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('.menu-pill').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('.menu-pill').forEach(x=>x.classList.toggle('active',x===b));renderProducts()})}
function renderProducts(){const list=products.filter(p=>category==='all'||(p.category||p.foodCategory||'')===category);document.getElementById('products').innerHTML=list.length?list.map(p=>{const q=qty(p.id);return `<article class="product"><div class="product-image-wrap"><img src="${esc(p.image||'assets/logo.png')}" onerror="this.onerror=null;this.src='assets/logo.png'" alt="${esc(p.name||'منتج')}"><button class="add" onclick="changeProduct('${esc(p.id)}',1)" style="display:${q?'none':'grid'}">+</button></div><div class="body"><h2>${esc(p.name||'منتج')}</h2><p>${esc(p.description||'منتج مميز من المطعم')}</p><div class="price">${money(p.price)}</div>${q?`<div class="controls"><button class="minus" onclick="changeProduct('${esc(p.id)}',-1)">−</button><b class="qty">${q}</b><button class="plus" onclick="changeProduct('${esc(p.id)}',1)">+</button></div>`:''}</div></article>`}).join(''):'<div class="empty">🍔 لا توجد منتجات في هذا القسم حاليًا</div>';renderBar()}
function activeOffer(o){if(o.active===false)return false;return true}function renderOffers(){const box=document.getElementById('offers');const list=offers.filter(activeOffer);box.innerHTML=list.length?list.map(o=>`<article class="offer-card"><img src="${esc(o.image||'assets/logo.png')}" alt="${esc(o.title||'عرض')}"><div class="offer-body"><strong>${esc(o.title||'عرض')}</strong><small>${esc(o.description||'عرض خاص من المطعم')}</small><div class="offer-price">${money(o.price)}</div></div></article>`).join(''):'<div class="empty">لا توجد عروض حالية لهذا المطعم</div>'}window.addEventListener('mandoubCartChanged',renderProducts);window.addEventListener('storage',renderProducts);
async function load(){if(!id){document.getElementById('hero').innerHTML='<div class="empty">لم يتم تحديد المطعم.</div>';return}try{const s=await getDoc(doc(db,'restaurants',id));if(!s.exists())throw Error('not found');restaurant={id,...s.data()};document.getElementById('hero').innerHTML=`<div class="hero-cover"><img src="${esc(restaurant.coverImage||restaurant.image||'assets/logo.png')}" alt="${esc(restaurant.name||'المطعم')}"></div><div class="hero-info"><h1>${esc(restaurant.name||'المطعم')}</h1><p>${esc(restaurant.description||'')}</p><div class="meta"><span>⭐ ${esc(restaurant.rating||'جديد')}</span></div></div>`;const ps=await getDocs(collection(db,'products'));products=ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.restaurantId===id&&p.active!==false);const os=await getDocs(collection(db,'offers'));offers=os.docs.map(d=>({id:d.id,...d.data()})).filter(o=>o.restaurantId===id);renderCategories();renderProducts();renderOffers()}catch(e){console.error(e);document.getElementById('error').hidden=false;document.getElementById('error').textContent='❌ تعذر تحميل بيانات المطعم.'}}load();
</script></body></html>
