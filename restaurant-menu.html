<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>المطعم | مندوب</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--cyan:#00dfff;--bg:#020d1b;--card:#061a2d;--line:#16415e;--muted:#91a4b3}
body{background:#fff;color:#101820;padding-bottom:105px}.menu-main{max-width:920px;margin:auto;padding:0 0 120px}.menu-top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid #e6eaee;display:flex;align-items:center;justify-content:space-between;padding:10px 12px}.menu-top a,.menu-top button{border:1px solid #e2e7eb;background:#fff;color:#17202a;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:19px}.menu-top .logo{width:46px;height:46px;object-fit:contain;border-radius:12px}.restaurant-hero{background:#fff;overflow:hidden}.hero-cover{height:185px;background:#e8edf0}.hero-cover img{width:100%;height:100%;object-fit:cover}.hero-info{padding:15px 16px 10px}.hero-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.hero-info h1{font-size:26px;margin:0 0 6px;color:#101820}.hero-info p{color:#687785;line-height:1.7;margin:0}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;color:#4b5c68;font-size:13px}.meta span{background:#f4f6f7;border-radius:999px;padding:6px 9px}.meta .delivery{color:#007f9b;background:#e9fbff}.location{margin-top:10px}.location button{border:0;border-radius:10px;background:#00cfe8;color:#00131e;font-weight:900;padding:10px 14px;width:100%}
.menu-pills{display:flex;gap:8px;overflow:auto;padding:10px 12px;border-bottom:1px solid #e8ecef;scrollbar-width:none;position:sticky;top:63px;z-index:20;background:#fff}.menu-pills::-webkit-scrollbar{display:none}.menu-pill{flex:0 0 auto;border:0;background:#fff;color:#667581;padding:8px 10px;font-size:14px;font-weight:800;white-space:nowrap;border-bottom:3px solid transparent}.menu-pill.active{color:#111;border-color:#00cfe8}
.content-wrap{padding:0 12px}.section-title{font-size:24px;margin:18px 0 12px;color:#111820}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{position:relative;background:#fff;border:1px solid #e4e9ed;border-radius:18px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.07)}.product-image-wrap{position:relative}.product img{width:100%;height:145px;object-fit:cover;background:#f0f2f4}.add{position:absolute;bottom:-15px;right:12px;width:44px;height:44px;border:1px solid #dce2e6;border-radius:50%;background:#fff;color:#e85d24;font-size:28px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.14);z-index:2}.body{padding:21px 12px 12px}.body h2{font-size:16px;color:#111820;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body p{font-size:12px;color:#75838d;line-height:1.6;height:39px;overflow:hidden;margin:0}.price{font-size:17px;font-weight:900;color:#111820;margin-top:7px}.old-price{text-decoration:line-through;color:#a3adb4;font-size:12px;margin-right:5px;font-weight:500}.controls{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}.controls button{width:30px;height:30px;border:0;border-radius:9px;font-size:19px;font-weight:900;cursor:pointer}.plus{background:#00cfe8;color:#00131e}.minus{background:#edf1f3;color:#34414b}.qty{min-width:20px;text-align:center;color:#111820}.product-offer{position:absolute;top:9px;right:9px;background:#dfff00;color:#152000;border-radius:6px;padding:4px 7px;font-size:11px;font-weight:900;z-index:3}
.offers-section{background:#f7f5ef;margin:22px 0 0;padding:16px 12px 20px}.offers-row{display:flex;gap:10px;overflow:auto;scrollbar-width:none}.offers-row::-webkit-scrollbar{display:none}.offer-card{flex:0 0 210px;background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e4e1d8}.offer-card img{width:100%;height:115px;object-fit:cover;background:#f2f0ea}.offer-card .offer-body{padding:10px}.offer-card strong{display:block;color:#1a2026;font-size:14px}.offer-card small{display:block;color:#71808a;line-height:1.5;margin-top:4px}.offer-price{font-weight:900;font-size:16px;margin-top:6px}.offer-price del{color:#9da7ad;font-size:12px;margin-right:5px}.empty{text-align:center;padding:45px 10px;color:#73818b}.error{color:#d84d5f;text-align:center;padding:30px}.cart-bar{position:fixed;left:10px;right:10px;bottom:9px;z-index:1000;display:none;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#00dff2;color:#00131e;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.3)}.cart-bar.show{display:flex}.cart-info{display:flex;align-items:center;gap:8px}.cart-icon{width:42px;height:42px;border-radius:12px;background:#00131e;color:#00dfff;display:grid;place-items:center}.cart-info strong,.cart-info small{display:block}.cart-info small{font-size:11px;margin-top:2px}.cart-open{border:0;border-radius:11px;padding:10px 14px;background:#00131e;color:#fff;font-weight:900;white-space:nowrap}
@media(min-width:700px){.menu-main{border-left:1px solid #e7ebee;border-right:1px solid #e7ebee}.products{grid-template-columns:repeat(3,minmax(0,1fr))}.hero-cover{height:230px}}
@media(max-width:420px){.hero-cover{height:150px}.hero-info h1{font-size:23px}.products{gap:9px}.product img{height:125px}.body{padding-left:9px;padding-right:9px}.body h2{font-size:15px}}
</style>
</head>
<body>
<header class="menu-top"><a href="restaurants.html" aria-label="رجوع">→</a><img class="logo" src="assets/logo.png" alt="مندوب"><button id="favRestaurant" type="button" aria-label="مفضلة">♡</button></header>
<main class="menu-main">
<section id="hero" class="restaurant-hero"><div class="empty">جاري تحميل المطعم...</div></section>
<div id="categoryPills" class="menu-pills"></div>
<div class="content-wrap"><h2 class="section-title">🔥 اختيارات على ذوقك</h2><div id="products" class="products"></div></div>
<section class="offers-section"><div class="content-wrap"><h2 class="section-title" style="margin-top:0">🎁 العروض</h2><div id="offers" class="offers-row"></div></div></section>
<div id="error" class="error" hidden></div>
</main>
<div id="cartBar" class="cart-bar"><div class="cart-info"><div class="cart-icon">🛒</div><div><strong><span id="cartCount">0</span> منتجات في السلة</strong><small id="cartTotal">السلة فارغة</small></div></div><button type="button" class="cart-open">عرض السلة</button></div>
<script src="cart-system.js?v=20260822-1"></script><script src="delivery-fees.js?v=20260822-1"></script><script src="checkout-flow.js?v=20260822-1"></script>
<script type="module">
import{getFirestore,doc,getDoc,collection,getDocs}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';import{auth,authReady}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
const db=getFirestore(),id=new URLSearchParams(location.search).get('id');let restaurant=null,products=[],offers=[],category='all';
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ar-EG')+' ج.م';
function getCart(){try{return JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]')}catch{return []}}function saveCart(c){localStorage.setItem('mandoub_cart_v2',JSON.stringify(c));window.dispatchEvent(new CustomEvent('mandoubCartChanged'))}
function qty(pid){return getCart().find(x=>x.productId===pid)?.quantity||0}
function updateCartBar(){const c=getCart(),count=c.reduce((s,x)=>s+Number(x.quantity||0),0),total=c.reduce((s,x)=>s+Number(x.price||0)*Number(x.quantity||0),0);document.getElementById('cartCount').textContent=count;document.getElementById('cartTotal').textContent=count?`الإجمالي ${money(total)}`:'السلة فارغة';document.getElementById('cartBar').classList.toggle('show',count>0)}
function openCart(){location.href='cart.html'}document.getElementById('cartBar').onclick=openCart;document.querySelector('.cart-open').onclick=e=>{e.stopPropagation();openCart()};
window.addToCart=(p,r)=>{const c=getCart();if(c.length&&c[0].restaurantId!==r.id){alert(`⚠️ السلة تحتوي منتجات من «${c[0].restaurantName}».\nافرغ السلة أولًا ثم اختر من «${r.name}».`);return}const old=c.find(x=>x.productId===p.id);if(old)old.quantity++;else c.push({productId:p.id,restaurantId:r.id,restaurantName:r.name,name:p.name,price:Number(p.price)||0,image:p.image||'',quantity:1});saveCart(c);renderProducts();updateCartBar()};
window.changeProduct=(pid,delta)=>{const p=products.find(x=>x.id===pid);if(!p)return;if(delta>0){window.addToCart(p,restaurant);return}const c=getCart(),x=c.find(i=>i.productId===pid);if(x){x.quantity--;if(x.quantity<=0)c.splice(c.indexOf(x),1);saveCart(c)}renderProducts();updateCartBar()};
window.setLocation=()=>window.setMandoubLocation?.();
function activeOffer(o){if(o.active===false)return false;const now=Date.now(),s=o.startAt?.toDate?o.startAt.toDate().getTime():o.startAt?new Date(o.startAt).getTime():0,e=o.endAt?.toDate?o.endAt.toDate().getTime():o.endAt?new Date(o.endAt).getTime():0;return(!s||now>=s)&&(!e||now<=e)}
function renderCategories(){const cats=[...new Set(products.map(p=>p.category||p.foodCategory).filter(Boolean))];document.getElementById('categoryPills').innerHTML='<button class="menu-pill active" data-cat="all">الكل</button>'+cats.map(c=>`<button class="menu-pill" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('.menu-pill').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('.menu-pill').forEach(x=>x.classList.toggle('active',x===b));renderProducts()})}
function renderProducts(){const list=products.filter(p=>category==='all'||(p.category||p.foodCategory||'')===category);document.getElementById('products').innerHTML=list.length?list.map(p=>`<article class="product"><div class="product-image-wrap"><img src="${esc(p.image||'assets/logo.png')}" onerror="this.onerror=null;this.src='assets/logo.png'" alt="${esc(p.name)}">${p.discount?`<span class="product-offer">خصم ${esc(p.discount)}%</span>`:''}<button class="add" onclick="changeProduct('${esc(p.id)}',1)">+</button></div><div class="body"><h2>${esc(p.name||'منتج')}</h2><p>${esc(p.description||'منتج مميز من المطعم')}</p><div class="price">${money(p.price)} ${p.oldPrice?`<del class="old-price">${money(p.oldPrice)}</del>`:''}</div><div class="controls"><button class="minus" onclick="changeProduct('${esc(p.id)}',-1)">−</button><b class="qty" id="q-${esc(p.id)}">${qty(p.id)}</b><button class="plus" onclick="changeProduct('${esc(p.id)}',1)">+</button></div></div></article>`).join(''):'<div class="empty">🍔 لا توجد منتجات في هذا القسم حاليًا</div>'}
function renderOffers(){const box=document.getElementById('offers');const list=offers.filter(activeOffer);box.innerHTML=list.length?list.map(o=>`<article class="offer-card"><img src="${esc(o.image||'assets/logo.png')}" onerror="this.onerror=null;this.src='assets/logo.png'" alt="${esc(o.title)}"><div class="offer-body"><strong>${esc(o.title||'عرض')}</strong><small>${esc(o.description||'عرض خاص من المطعم')}</small><div class="offer-price">${money(o.price)} ${o.oldPrice?`<del>${money(o.oldPrice)}</del>`:''}</div></div></article>`).join(''):'<div class="empty">لا توجد عروض حاليًا</div>'}
function refresh(){products.forEach(p=>{const e=document.getElementById('q-'+p.id);if(e)e.textContent=qty(p.id)});updateCartBar();const e=document.getElementById('delivery');if(e&&restaurant&&window.getMandoubDelivery){const d=window.getMandoubDelivery(restaurant);e.textContent=d?.fee==null?'حدد موقعك لمعرفة رسوم التوصيل':d.fee===-1?'خارج نطاق التوصيل':`التوصيل ${d.fee} ج${d.distance!=null?' • '+Number(d.distance).toFixed(1)+' كم':''}`}}
window.addEventListener('mandoubCartChanged',refresh);window.addEventListener('mandoubLocationChanged',refresh);window.addEventListener('storage',refresh);
async function load(){if(!id){document.getElementById('hero').innerHTML='<div class="empty">لم يتم تحديد المطعم.</div>';return}try{const s=await getDoc(doc(db,'restaurants',id));if(!s.exists())throw Error('not found');restaurant={id,...s.data()};const heroImg=restaurant.coverImage||restaurant.image||'assets/logo.png';document.getElementById('hero').innerHTML=`<div class="hero-cover"><img src="${esc(heroImg)}" onerror="this.onerror=null;this.src='assets/logo.png'" alt="${esc(restaurant.name)}"></div><div class="hero-info"><div class="hero-title-row"><div><h1>${esc(restaurant.name||'مطعم')}</h1><p>${esc(restaurant.description||'اطلب أشهى المنتجات من مطعمك المفضل')}</p></div><span style="font-size:24px">⭐</span></div><div class="meta"><span>⭐ ${esc(restaurant.rating||'—')}</span><span>${esc(restaurant.category||restaurant.foodCategory||'مطعم')}</span><span id="delivery" class="delivery">حدد موقعك لمعرفة رسوم التوصيل</span></div><div class="location"><button onclick="setLocation()">📍 تحديد موقعي</button></div></div>`;const ps=await getDocs(collection(db,'restaurants',id,'products'));products=ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false);try{const os=await getDocs(collection(db,'offers'));offers=os.docs.map(d=>({id:d.id,...d.data()})).filter(o=>(o.restaurantId===id||!o.restaurantId)&&activeOffer(o))}catch{offers=[]}renderCategories();renderProducts();renderOffers();refresh()}catch(e){console.error(e);document.getElementById('error').hidden=false;document.getElementById('error').textContent='❌ تعذر تحميل المطعم أو المنتجات'}}
(async()=>{try{await authReady}catch{}const u=auth.currentUser;if(u){}onAuthStateChanged(auth,()=>{});load()})();
</script>
</body></html>
