<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>المطعم | مندوب</title>
<link rel="stylesheet" href="style.css">
<style>body{background:#020d1b;color:#fff}.menu-main{max-width:1050px;margin:auto;padding:18px 14px 100px}.top{position:sticky;top:0;z-index:20;background:rgba(2,13,27,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,223,255,.15);padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.top a{padding:9px 13px;border:1px solid #16415e;border-radius:12px;background:#061a2d}.restaurant-hero{background:linear-gradient(145deg,#09253b,#031321);border:1px solid #16415e;border-radius:24px;overflow:hidden;margin:10px 0 22px;box-shadow:0 15px 40px rgba(0,0,0,.22)}.hero-cover{height:170px;background:#061a2d}.hero-cover img{width:100%;height:100%;object-fit:cover}.hero-info{padding:18px;text-align:right}.hero-info h1{font-size:27px;margin-bottom:7px}.hero-info p{color:#9fb0bb;line-height:1.7}.meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.meta span{background:#082238;border:1px solid #16415e;border-radius:10px;padding:7px 10px;color:#dceaf0}.delivery{color:#00dfff!important}.location{margin-top:13px;display:flex;gap:8px}.location button{border:0;border-radius:11px;background:#00dfff;color:#00131e;font-weight:900;padding:10px 13px}.section-title{margin:20px 0 13px;font-size:22px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product{background:#061a2d;border:1px solid #16415e;border-radius:19px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.16)}.product img{width:100%;height:190px;object-fit:cover}.body{padding:14px}.body h2{font-size:18px}.body p{color:#91a4b3;line-height:1.6;min-height:42px;margin:6px 0}.price{font-size:19px;font-weight:900;color:#00dfff}.controls{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:12px}.controls button{width:38px;height:38px;border:0;border-radius:11px;font-size:21px;font-weight:900;cursor:pointer}.plus{background:#00dfff;color:#00131e}.minus{background:#173b55;color:#fff}.qty{min-width:28px;text-align:center;font-weight:900}.cart-float{position:fixed;bottom:14px;left:14px;right:14px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#00dfff;color:#00131e;padding:12px 14px;border-radius:17px;box-shadow:0 12px 35px rgba(0,0,0,.4)}.cart-float button{border:0;border-radius:11px;background:#00131e;color:#fff;padding:10px 14px;font-weight:900}.restaurant-cart{margin-top:26px;background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:18px}.restaurant-cart:empty{display:none}.empty{text-align:center;padding:45px;color:#91a4b3}.error{color:#ff668b;text-align:center;padding:30px}@media(max-width:800px){.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.products{grid-template-columns:1fr}.hero-cover{height:145px}.hero-info h1{font-size:23px}.location{flex-direction:column}.location button{width:100%}}</style>
</head>
<body>
<header class="top"><a href="restaurants.html">← المطاعم</a><a href="index.html"><img src="assets/logo.png" style="width:42px;height:42px;object-fit:contain" alt="مندوب"></a><button id="account" class="login account-button" type="button">👤 تسجيل الدخول</button></header>
<main class="menu-main"><section id="hero" class="restaurant-hero"><div class="empty">جاري تحميل المطعم...</div></section><h2 class="section-title">🍔 قائمة المنتجات</h2><div id="products" class="products"></div><div id="restaurantCart" class="restaurant-cart"></div><div id="error" class="error" hidden></div></main>
<div id="cartFloat" class="cart-float" hidden><strong>🛒 السلة: <span id="cartCount">0</span></strong><button type="button" onclick="window.openCart?.()">عرض السلة</button></div>
<script src="cart-system.js?v=20260820-2"></script><script src="delivery-fees.js?v=20260820-2"></script><script src="checkout-flow.js?v=20260820-2"></script>
<script type="module">
import{getFirestore,doc,getDoc,collection,getDocs}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';import{auth}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
const db=getFirestore();const id=new URLSearchParams(location.search).get('id');let restaurant=null,products=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ar-EG')+' ج';
function getCart(){try{return JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]')}catch{return []}}function saveCart(c){localStorage.setItem('mandoub_cart_v2',JSON.stringify(c));window.dispatchEvent(new CustomEvent('mandoubCartChanged'))}
window.addToCart=(p,r)=>{if(!p||!r)return;const c=getCart();if(c.length&&c[0].restaurantId!==r.id){alert(`⚠️ السلة تحتوي منتجات من «${c[0].restaurantName}».\nلا يمكن خلط طلبين من مطعمين مختلفين.\nافرغ السلة أولاً ثم اختر من «${r.name}».`);return}const old=c.find(x=>x.productId===p.id);if(old)old.quantity++;else c.push({productId:p.id,restaurantId:r.id,restaurantName:r.name,name:p.name,price:Number(p.price)||0,image:p.image||'',quantity:1});saveCart(c);refresh()};
function qty(pid){return getCart().find(x=>x.productId===pid)?.quantity||0}
function refresh(){const c=getCart().reduce((s,x)=>s+x.quantity,0);document.getElementById('cartCount').textContent=c;document.getElementById('cartFloat').hidden=!c;products.forEach(p=>{const e=document.getElementById('q-'+p.id);if(e)e.textContent=qty(p.id)});if(restaurant&&window.getMandoubDelivery){const d=window.getMandoubDelivery(restaurant),e=document.getElementById('delivery');if(e)e.textContent=d.fee==null?'حدد موقعك لمعرفة رسوم التوصيل':d.fee===-1?'خارج نطاق التوصيل':`التوصيل ${d.fee} ج${d.distance!=null?' • '+d.distance.toFixed(2)+' كم':''}`}}
window.changeProduct=(pid,delta)=>{const p=products.find(x=>x.id===pid);if(!p||!restaurant)return;if(delta>0)window.addToCart(p,restaurant);else{const c=getCart(),x=c.find(i=>i.productId===pid);if(x){x.quantity--;if(x.quantity<=0)c.splice(c.indexOf(x),1);saveCart(c)}}refresh()};window.setLocation=()=>window.setMandoubLocation?.();window.addEventListener('mandoubCartChanged',refresh);window.addEventListener('mandoubLocationChanged',refresh);
onAuthStateChanged(auth,u=>{const b=document.getElementById('account');if(!b)return;if(u){b.textContent='👤 حسابي';b.classList.add('logged-in');b.onclick=()=>location.href='account.html'}else{b.textContent='👤 تسجيل الدخول';b.classList.remove('logged-in');b.onclick=()=>location.href='login.html'}});
async function load(){if(!id){document.getElementById('hero').innerHTML='<div class="empty">لم يتم تحديد المطعم.</div>';return}try{const s=await getDoc(doc(db,'restaurants',id));if(!s.exists())throw Error('not found');restaurant={id,...s.data()};window.__selectedRestaurant=restaurant;document.getElementById('hero').innerHTML=`<div class="hero-cover"><img src="${esc(restaurant.image||'assets/logo.png')}" onerror="this.src='assets/logo.png'"></div><div class="hero-info"><h1>${esc(restaurant.name||'مطعم')}</h1><p>${esc(restaurant.description||'اختر منتجاتك من المطعم')}</p><div class="meta"><span>⭐ ${esc(restaurant.rating||'—')}</span><span>🍔 ${esc(restaurant.category||'مطعم')}</span><span id="delivery" class="delivery">حدد موقعك لمعرفة رسوم التوصيل</span></div><div class="location"><button onclick="setLocation()">📍 تحديد موقعي</button></div></div>`;const ps=await getDocs(collection(db,'restaurants',id,'products'));products=ps.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false);const box=document.getElementById('products');box.innerHTML=products.length?products.map(p=>`<article class="product"><img src="${esc(p.image||'assets/logo.png')}" onerror="this.src='assets/logo.png'" alt="${esc(p.name)}"><div class="body"><h2>${esc(p.name||'منتج')}</h2><p>${esc(p.description||'')}</p><div class="price">${money(p.price)}</div><div class="controls"><button class="plus" onclick="changeProduct('${esc(p.id)}',1)">+</button><b class="qty" id="q-${esc(p.id)}">${qty(p.id)}</b><button class="minus" onclick="changeProduct('${esc(p.id)}',-1)">−</button></div></div></article>`).join(''):'<div class="empty">🍔 لا توجد منتجات حاليًا</div>';refresh();window.renderMandoubCart?.()}catch(e){console.error(e);document.getElementById('error').hidden=false;document.getElementById('error').textContent='❌ تعذر تحميل المطعم أو المنتجات'}}load();
</script>
</body></html>
