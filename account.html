<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>مندوب | حسابي</title>
<style>*{box-sizing:border-box}body{margin:0;background:#020d18;color:#fff;font-family:Tahoma,Arial,sans-serif;padding:20px 12px 50px}.container{max-width:700px;margin:auto}.top{text-align:center;margin:10px 0 22px}.top img{width:70px;height:70px;object-fit:contain}.top h1{color:#00dfff;margin:8px 0}.top p{color:#91a5b5}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:20px;margin-bottom:16px}.profile{text-align:center}.avatar{width:82px;height:82px;margin:auto;border-radius:50%;background:#00dfff;color:#00131e;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900}.profile h2{margin:13px 0 5px}.email{color:#9db0bf;direction:ltr;word-break:break-word}.status{display:inline-block;margin-top:12px;padding:7px 12px;border-radius:18px;background:#073d30;color:#5df0bb}.status.no{background:#493b08;color:#ffe26b}.title{color:#00dfff;margin:0 0 16px;font-size:20px}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #15364d}.row:last-child{border:0}.label{color:#8fa4b5}.value{font-weight:bold;text-align:left;word-break:break-word}.field{margin-bottom:12px}.field label{display:block;color:#aab9c7;margin-bottom:7px}.field input{width:100%;height:52px;border:2px solid #21445f;border-radius:14px;background:#031321;color:#fff;padding:0 14px;font-size:16px}.button{width:100%;height:52px;border:0;border-radius:14px;cursor:pointer;font-weight:bold;font-size:16px}.primary{background:#00dfff;color:#00131e}.secondary{background:#12344d;color:#fff;margin-top:10px}.logout{background:#481527;color:#ff8eae;border:1px solid #b92859}.message{display:none;padding:12px;border-radius:12px;text-align:center;margin-bottom:15px;font-weight:bold}.message.show{display:block}.success{background:#073d30;color:#5df0bb}.error{background:#481527;color:#ff8eae}.loading{text-align:center;color:#91a5b5;padding:40px}.hidden{display:none!important}.back{display:block;text-align:center;color:#00dfff;text-decoration:none;margin-top:18px}</style></head>
<body><div class="container"><div class="top"><img src="assets/logo.png" alt="مندوب"><h1>حسابي 👤</h1><p>إدارة حسابك وبياناتك</p></div><div id="loading" class="card loading">⏳ جاري التحقق من تسجيل الدخول...</div><div id="content" class="hidden"><div class="card profile"><div id="avatar" class="avatar">👤</div><h2 id="userName">العميل</h2><div id="userEmail" class="email"></div><span id="verifyStatus" class="status">جاري التحقق...</span></div><div id="message" class="message"></div><div class="card"><h3 class="title">👤 بيانات الحساب</h3><div class="row"><span class="label">الاسم</span><strong id="infoName" class="value"></strong></div><div class="row"><span class="label">البريد</span><strong id="infoEmail" class="value"></strong></div><div class="row"><span class="label">حالة البريد</span><strong id="infoVerified" class="value"></strong></div></div><div class="card"><h3 class="title">✏️ تعديل الاسم</h3><div class="field"><label>الاسم الجديد</label><input id="newName" maxlength="80" autocomplete="name" placeholder="اكتب اسمك"></div><button id="saveName" class="button primary">حفظ الاسم</button></div><div class="card"><h3 class="title">🔐 كلمة المرور</h3><p style="color:#91a5b5;line-height:1.8">سيتم إرسال رابط آمن إلى بريدك الإلكتروني لتغيير كلمة المرور.</p><button id="passwordButton" class="button secondary">إرسال رابط تغيير كلمة المرور</button><button id="verifyButton" class="button secondary hidden">📧 إرسال رابط تأكيد البريد</button></div><div class="card"><button id="logoutButton" class="button logout">🚪 تسجيل الخروج</button></div><a href="index.html" class="back">← العودة للرئيسية</a></div></div>
<script type="module">
import{auth,db,authReady}from'./auth.js';import{onAuthStateChanged,updateProfile,sendPasswordResetEmail,sendEmailVerification,signOut}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
const $=id=>document.getElementById(id);let currentUser=null;
function msg(t,k='error'){$('message').textContent=t;$('message').className='message show '+k}
function paint(u,d={}){const n=d.name||u.displayName||'العميل';$('userName').textContent=n;$('userEmail').textContent=u.email||'';$('infoName').textContent=n;$('infoEmail').textContent=u.email||'—';$('infoVerified').textContent=u.emailVerified?'مؤكد ✅':'غير مؤكد';$('verifyStatus').textContent=u.emailVerified?'البريد مؤكد ✅':'البريد غير مؤكد ⚠️';$('verifyStatus').className='status'+(u.emailVerified?'':' no');$('newName').value=n}
async function loadUser(u){currentUser=u;try{const s=await getDoc(doc(db,'customers',u.uid));paint(u,s.exists()?s.data():{});$('loading').classList.add('hidden');$('content').classList.remove('hidden')}catch(e){console.error(e);$('loading').textContent='❌ تعذر تحميل بيانات الحساب'}}
$('saveName').onclick=async()=>{if(!currentUser)return;const n=$('newName').value.trim();if(!n)return msg('اكتب الاسم أولاً.');const b=$('saveName');b.disabled=true;try{await updateProfile(currentUser,{displayName:n});await setDoc(doc(db,'customers',currentUser.uid),{uid:currentUser.uid,name:n,email:currentUser.email,updatedAt:serverTimestamp()},{merge:true});paint(currentUser,{name:n});msg('تم حفظ الاسم بنجاح ✅','success')}catch(e){msg(e.message||'تعذر حفظ الاسم.')}finally{b.disabled=false}};
$('passwordButton').onclick=async()=>{try{await sendPasswordResetEmail(auth,currentUser.email);msg('تم إرسال رابط تغيير كلمة المرور إلى بريدك الإلكتروني ✅','success')}catch(e){msg(e.message||'تعذر إرسال الرابط.')}};$('verifyButton').onclick=async()=>{try{await sendEmailVerification(currentUser);msg('تم إرسال رابط تأكيد البريد ✅','success')}catch(e){msg(e.message||'تعذر إرسال رابط التأكيد.')}};$('logoutButton').onclick=async()=>{await signOut(auth);location.replace('login.html')};
await authReady;const user=auth.currentUser;if(user)loadUser(user);else{onAuthStateChanged(auth,u=>{if(u)loadUser(u);else location.replace('login.html')})}
</script></body></html>
