<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | حسابي</title><style>*{box-sizing:border-box}body{margin:0;background:#020d18;color:#fff;font-family:Tahoma,Arial,sans-serif;padding:20px 12px 50px}.container{max-width:760px;margin:auto}.top{text-align:center}.top img{width:70px}.top h1{color:#00dfff}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:20px;margin:15px 0}.title{color:#00dfff}.row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #15364d}.label{color:#91a4b3}.field{margin:12px 0}.field label{display:block;margin-bottom:7px}.field input{width:100%;padding:13px;border-radius:12px;border:2px solid #21445f;background:#031321;color:#fff}.button{width:100%;padding:13px;border:0;border-radius:12px;font-weight:900;cursor:pointer;margin-top:8px}.primary{background:#00dfff;color:#00131e}.secondary{background:#12344d;color:#fff}.logout{background:#481527;color:#ff8eae}.address{background:#031321;border:1px solid #21445f;padding:12px;border-radius:12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.address-info{min-width:0;flex:1}.delete-address{flex:0 0 auto;border:1px solid #7b2844;background:#481527;color:#ff9ab5;border-radius:10px;padding:9px 11px;font-weight:900;cursor:pointer}.delete-address:disabled{opacity:.6}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}.links a{background:#12344d;color:#fff;text-decoration:none;padding:14px;border-radius:12px;text-align:center}.message{display:none;padding:12px;border-radius:12px}.message.show{display:block}.success{background:#073d30;color:#7ff0a8}.error{background:#481527;color:#ff8eae}</style></head><body><div class="container"><div class="top"><img src="assets/logo.png" alt="مندوب"><h1>حسابي 👤</h1><p style="color:#91a4b3">بياناتك محفوظة هنا وتستخدم تلقائيًا عند الطلب.</p></div><div id="loading" class="card">⏳ جاري التحقق...</div><div id="content" style="display:none"><div id="message" class="message"></div><div class="card"><h2 id="userName">العميل</h2><div id="userEmail" style="color:#91a4b3;direction:ltr"></div></div><div class="card"><h3 class="title">✏️ بياناتي</h3><div class="field"><label>الاسم</label><input id="name"></div><div class="field"><label>رقم الهاتف</label><input id="phone" type="tel"></div><button id="save" class="button primary">حفظ بياناتي</button></div><div class="card"><h3 class="title">📍 عناويني المحفوظة</h3><div id="addresses">لا توجد عناوين محفوظة.</div><p style="color:#91a4b3">يمكنك إضافة عنوان جديد تلقائيًا عند إتمام أي طلب.</p></div><div class="card"><h3 class="title">📦 الوصول السريع</h3><div class="links"><a href="orders.html">📦 طلباتي</a><a href="restaurants.html">🍔 اطلب الآن</a><a href="support.html">🆘 الدعم</a><a href="index.html">🏠 الرئيسية</a></div></div><div class="card"><button id="password" class="button secondary">🔐 إرسال رابط تغيير كلمة المرور</button><button id="logout" class="button logout">🚪 تسجيل الخروج</button></div></div></div><script type="module">import{auth,db,authReady}from'./auth.js';import{onAuthStateChanged,updateProfile,sendPasswordResetEmail,signOut}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const $=id=>document.getElementById(id);let user=null,currentData={};function show(t,ok=false){$('message').textContent=t;$('message').className='message show '+(ok?'success':'error')}function paint(d){currentData=d||{};$('userName').textContent=d.name||user.displayName||'العميل';$('userEmail').textContent=user.email||'';$('name').value=d.name||user.displayName||'';$('phone').value=d.phone||'';const a=Array.isArray(d.addresses)?d.addresses:[];$('addresses').innerHTML=a.length?a.map((x,i)=>`<div class="address"><div class="address-info">📍 <b>${String(x.label||'عنوان')}</b><br><span style="color:#91a4b3">${String(x.address||'')}</span></div><button type="button" class="delete-address" data-address-index="${i}">🗑️ حذف</button></div>`).join(''):'لا توجد عناوين محفوظة.';document.querySelectorAll('[data-address-index]').forEach(b=>b.onclick=()=>deleteAddress(Number(b.dataset.addressIndex)))}async function load(u){user=u;const s=await getDoc(doc(db,'customers',u.uid)),d=s.exists()?s.data():{};paint(d);$('loading').style.display='none';$('content').style.display='block'}async function deleteAddress(index){const addresses=Array.isArray(currentData.addresses)?[...currentData.addresses]:[];if(!addresses[index])return;if(!confirm('هل تريد حذف هذا العنوان؟'))return;const buttons=document.querySelectorAll('[data-address-index]');const b=[...buttons].find(x=>Number(x.dataset.addressIndex)===index);if(b){b.disabled=true;b.textContent='جاري الحذف...'}try{addresses.splice(index,1);await setDoc(doc(db,'customers',user.uid),{addresses,updatedAt:serverTimestamp()},{merge:true});currentData={...currentData,addresses};paint(currentData);show('تم حذف العنوان ✅',true)}catch(e){console.error(e);if(b){b.disabled=false;b.textContent='🗑️ حذف'}show('تعذر حذف العنوان ❌')}}$('save').onclick=async()=>{const n=$('name').value.trim(),p=$('phone').value.trim();if(!n||!p)return show('اكتب الاسم ورقم الهاتف.');try{await updateProfile(user,{displayName:n});await setDoc(doc(db,'customers',user.uid),{uid:user.uid,name:n,phone:p,email:user.email||'',updatedAt:serverTimestamp()},{merge:true});currentData={...currentData,name:n,phone:p};paint(currentData);show('تم حفظ بياناتك ✅',true)}catch(e){console.error(e);show('تعذر حفظ البيانات ❌')}};$('password').onclick=async()=>{try{await sendPasswordResetEmail(auth,user.email);show('تم إرسال رابط تغيير كلمة المرور ✅',true)}catch(e){show('تعذر إرسال الرابط ❌')}};$('logout').onclick=async()=>{await signOut(auth);location.replace('login.html')};await authReady;onAuthStateChanged(auth,u=>u?load(u):location.replace('login.html'));</script></body></html>
