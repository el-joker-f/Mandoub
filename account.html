<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>مندوب | حسابي</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#020d18;color:#fff;min-height:100vh;padding:20px 12px 50px}.container{max-width:700px;margin:auto}.top{text-align:center;margin:10px 0 22px}.top img{width:70px;height:70px;object-fit:contain}.top h1{color:#00dfff;margin:8px 0}.top p{color:#91a5b5}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 15px 40px #0004}.profile{text-align:center}.avatar{width:82px;height:82px;margin:auto;border-radius:50%;background:#00dfff;color:#00131e;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900}.profile h2{margin:13px 0 5px}.email{color:#9db0bf;direction:ltr;word-break:break-word}.status{display:inline-block;margin-top:12px;padding:7px 12px;border-radius:18px;background:#073d30;color:#5df0bb;border:1px solid #16a879}.status.no{background:#493b08;color:#ffe26b;border-color:#a88b12}.title{color:#00dfff;margin:0 0 16px;font-size:20px}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #15364d}.row:last-child{border-bottom:0}.label{color:#8fa4b5}.value{font-weight:bold;text-align:left;word-break:break-word}.field{margin-bottom:12px}.field label{display:block;color:#aab9c7;margin-bottom:7px}.field input{width:100%;height:52px;border:2px solid #21445f;border-radius:14px;background:#031321;color:#fff;padding:0 14px;font-size:16px;outline:none}.field input:focus{border-color:#00dfff}button{width:100%;height:52px;border:0;border-radius:14px;cursor:pointer;font-weight:bold;font-size:16px}.primary{background:#00dfff;color:#00131e}.secondary{background:#12344d;color:#fff;margin-top:10px}.logout{background:#481527;border:1px solid #b92859;color:#ff8eae}.message{display:none;padding:12px;border-radius:12px;text-align:center;margin-bottom:15px;font-weight:bold}.message.show{display:block}.success{background:#073d30;color:#5df0bb}.error{background:#481527;color:#ff8eae}.loading{text-align:center;color:#91a5b5;padding:40px}.hidden{display:none!important}.back{display:block;text-align:center;color:#00dfff;text-decoration:none;margin-top:18px}
</style></head>
<body><div class="container">
<div class="top"><img src="assets/logo.png" alt="مندوب"><h1>حسابي 👤</h1><p>إدارة حسابك وبياناتك</p></div>
<div id="loading" class="card loading">⏳ جاري تحميل الحساب...</div>
<div id="content" class="hidden">
<div class="card profile"><div id="avatar" class="avatar">👤</div><h2 id="userName">العميل</h2><div id="userEmail" class="email"></div><span id="verifyStatus" class="status">جاري التحقق...</span></div>
<div id="message" class="message"></div>
<div class="card"><h3 class="title">👤 بيانات الحساب</h3><div class="row"><span class="label">الاسم</span><strong id="infoName" class="value"></strong></div><div class="row"><span class="label">البريد</span><strong id="infoEmail" class="value"></strong></div><div class="row"><span class="label">حالة البريد</span><strong id="infoVerified" class="value"></strong></div></div>
<div class="card"><h3 class="title">✏️ تعديل الاسم</h3><div class="field"><label>الاسم الجديد</label><input id="newName" maxlength="80" autocomplete="name" placeholder="اكتب اسمك"></div><button id="saveName" class="primary">حفظ الاسم</button></div>
<div class="card"><h3 class="title">🔐 كلمة المرور</h3><p style="color:#91a5b5;line-height:1.8">سيتم إرسال رابط آمن إلى بريدك الإلكتروني لتغيير كلمة المرور.</p><button id="passwordButton" class="secondary">إرسال رابط تغيير كلمة المرور</button><button id="verifyButton" class="secondary hidden">📧 إرسال رابط تأكيد البريد</button></div>
<div class="card"><h3 class="title">📦 طلباتي</h3><div style="color:#91a5b5;line-height:2;text-align:center">طلباتك الجديدة والسابقة ستظهر هنا بعد تنفيذ الطلب.</div></div>
<div class="card"><button id="logoutButton" class="logout">🚪 تسجيل الخروج</button></div><a href="index.html" class="back">← العودة للرئيسية</a>
</div></div>
<script type="module">
import{auth,db}from'./auth.js';
import{onAuthStateChanged,updateProfile,sendPasswordResetEmail,sendEmailVerification,signOut}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
import{doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
const $=id=>document.getElementById(id);let currentUser=null;
function msg(text,type='error'){$('message').textContent=text;$('message').className='message show '+type}
function paint(user,data={}){const name=data.name||user.displayName||'العميل';$('userName').textContent=name;$('userEmail').textContent=user.email||'';$('infoName').textContent=name;$('infoEmail').textContent=user.email||'—';$('infoVerified').textContent=user.emailVerified?'مؤكد ✅':'غير مؤكد';$('verifyStatus').textContent=user.emailVerified?'البريد مؤكد ✅':'البريد غير مؤكد ⚠️';$('verifyStatus').className='status'+(user.emailVerified?'':' no');$('newName').value=name;if(user.emailVerified)$('verifyButton').classList.add('hidden');else $('verifyButton').classList.remove('hidden')}
async function loadUser(user){currentUser=user;try{const s=await getDoc(doc(db,'customers',user.uid));paint(user,s.exists()?s.data():{});$('loading').classList.add('hidden');$('content').classList.remove('hidden')}catch(e){console.error(e);$('loading').textContent='❌ تعذر تحميل بيانات الحساب'}}
$('saveName').onclick=async()=>{if(!currentUser)return;const name=$('newName').value.trim();if(!name)return msg('اكتب الاسم أولاً.');const b=$('saveName');b.disabled=true;try{await updateProfile(currentUser,{displayName:name});await setDoc(doc(db,'customers',currentUser.uid),{uid:currentUser.uid,name,email:currentUser.email,updatedAt:serverTimestamp()},{merge:true});paint(currentUser,{name});msg('تم حفظ الاسم بنجاح ✅','success')}catch(e){console.error(e);msg(e.message||'تعذر حفظ الاسم.')}finally{b.disabled=false}};
$('passwordButton').onclick=async()=>{if(!currentUser?.email)return;try{await sendPasswordResetEmail(auth,currentUser.email);msg('تم إرسال رابط تغيير كلمة المرور إلى بريدك الإلكتروني ✅','success')}catch(e){msg(e.message||'تعذر إرسال الرابط.')}};
$('verifyButton').onclick=async()=>{if(!currentUser)return;try{await sendEmailVerification(currentUser);msg('تم إرسال رابط تأكيد البريد ✅','success')}catch(e){msg(e.message||'تعذر إرسال رابط التأكيد.')}};
$('logoutButton').onclick=async()=>{try{await signOut(auth);location.replace('login.html')}catch(e){msg('تعذر تسجيل الخروج.')}};
onAuthStateChanged(auth,user=>{if(!user){location.replace('login.html');return}loadUser(user)});
</script></body></html>
