<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مندوب | لوحة التحكم</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#020d18;
color:#fff;
}

button{
cursor:pointer;
font-family:inherit;
}

.app{
display:flex;
min-height:100vh;
}


/* SIDEBAR */

.sidebar{

width:260px;
background:#061a2d;
padding:20px;
position:fixed;
right:0;
top:0;
bottom:0;

}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo img{

width:70px;
height:70px;

}

.logo h1{

color:#00dfff;

}


/* MENU */

.menu button{

width:100%;
padding:14px;
margin-bottom:8px;
border:0;
border-radius:12px;
background:none;
color:#ccc;
text-align:right;

}

.menu button.active{

background:#00dfff;
color:#00131e;

}


/* MAIN */

.main{

margin-right:260px;
width:calc(100% - 260px);

}


.topbar{

height:70px;
background:#061a2d;
display:flex;
align-items:center;
justify-content:space-between;
padding:20px;

}


.content{

padding:20px;

}


.page{

display:none;

}


.page.active{

display:block;

}


.card{

background:#061a2d;
border:1px solid #16415e;
border-radius:20px;
padding:20px;
margin-bottom:20px;

}


.form-grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}


.field label{

display:block;
margin-bottom:8px;
color:#aaa;

}


.field input,
.field textarea,
.field select{

width:100%;
background:#031321;
border:2px solid #21445f;
color:#fff;
padding:13px;
border-radius:12px;

}


.primary{

background:#00dfff;
border:0;
padding:15px 25px;
border-radius:12px;
font-weight:bold;

}


</style>

</head>


<body>


<div class="app">


<aside class="sidebar">


<div class="logo">

<img src="assets/logo.png">

<h1>مندوب</h1>

</div>


<div class="menu">


<button class="active" onclick="showPage('dashboard',this)">
📊 لوحة التحكم
</button>


<button onclick="showPage('restaurants',this)">
🍔 المطاعم
</button>


<button onclick="showPage('products',this)">
🍟 المنتجات
</button>


<button onclick="showPage('orders',this)">
📦 الطلبات
</button>


</div>


</aside>



<main class="main">


<div class="topbar">

<h2 id="pageTitle">
لوحة التحكم
</h2>


<div id="firebaseStatus">
جاري الاتصال...
</div>


</div>



<div class="content">



<section id="dashboard" class="page active">

<div class="card">

<h2>
مرحبا بك في لوحة التحكم
</h2>

</div>

</section>




<!-- المطاعم -->


<section id="restaurants" class="page">



<div class="card">


<h2>
إضافة مطعم جديد 🍔
</h2>



<div class="form-grid">



<div class="field">

<label>
اسم المطعم
</label>

<input id="restaurantName">

</div>



<div class="field">

<label>
التصنيف
</label>

<input id="restaurantCategory">

</div>


<div class="field">

<label>
رابط صورة المطعم
</label>

<input id="restaurantImage">

</div>


<div class="field">

<label>
خط العرض Latitude
</label>

<input 
id="restaurantLat"
type="number"
step="any"
placeholder="30.0444">

</div>


<div class="field">

<label>
خط الطول Longitude
</label>

<input 
id="restaurantLng"
type="number"
step="any"
placeholder="31.2357">

</div>


</div>


<br>


<button 
class="secondary"
onclick="getRestaurantLocation()">

      <button 
class="secondary"
onclick="getRestaurantLocation()">

📍 تحديد موقع المطعم

</button>

<input id="restaurantLat" type="hidden">

<input id="restaurantLng" type="hidden">
📍 تحديد موقع المطعم تلقائياً

</button>


<br><br>


<div class="field">

<label>
وصف المطعم
</label>


<textarea id="restaurantDescription"></textarea>


</div>



<button 
class="primary"
onclick="addRestaurant()">

➕ إضافة المطعم

</button>



</div>



<div class="card">

<h2>
المطاعم الحالية
</h2>


<div id="restaurantsList">

جاري التحميل...

</div>


</div>


</section>

      <!-- ================= PRODUCTS ================= -->

<section id="products" class="page">


<div class="card">

<h2>
إضافة منتج 🍟
</h2>


<div class="form-grid">


<div class="field">

<label>
المطعم
</label>

<select id="productRestaurant">

<option>
اختر المطعم
</option>

</select>

</div>



<div class="field">

<label>
اسم المنتج
</label>

<input id="productName">

</div>



<div class="field">

<label>
السعر
</label>

<input 
id="productPrice"
type="number">

</div>



<div class="field">

<label>
صورة المنتج
</label>

<input id="productImage">

</div>


</div>


<br>


<button 
class="primary"
onclick="addProduct()">

➕ إضافة المنتج

</button>


</div>


<div class="card">

<h2>
المنتجات الحالية
</h2>


<div id="productsList">

جاري التحميل...

</div>


</div>


</section>




<!-- ================= ORDERS ================= -->


<section id="orders" class="page">


<div class="card">

<h2>
الطلبات 📦
</h2>


<table width="100%">


<thead>

<tr>

<th>
رقم الطلب
</th>

<th>
العميل
</th>

<th>
الإجمالي
</th>

<th>
الحالة
</th>


</tr>


</thead>



<tbody id="ordersTable">


</tbody>


</table>


</div>


</section>



</div>

</main>


</div>




<div id="message">

</div>




<script type="module" src="admin.js"></script>


</body>

</html>
