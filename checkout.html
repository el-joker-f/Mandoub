<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | بيانات الطلب</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#020d18;color:#fff}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:22px;margin:16px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#91a4b3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border-radius:12px;border:2px solid #21445f;background:#031321;color:#fff}.field textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:#00dfff;color:#00131e;width:100%}.secondary{background:#123650;color:#fff}.summary div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #16415e}.summary .grand{font-size:20px;border:0}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #16415e}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h1>📦 بيانات الطلب</h1><button class="btn secondary" onclick="backToRestaurant()">🛒 السلة</button></div><p class="muted">لن تتمكن من الانتقال للدفع قبل إدخال بيانات التوصيل كاملة.</p><div class="card"><h2>بيانات العميل</h2><div class="grid"><div class="field"><label>الاسم *</label><input id="customerName" autocomplete="name"></div><div class="field"><label>رقم الهاتف *</label><input id="customerPhone" type="tel" autocomplete="tel"></div></div><div class="field"><label>العنوان بالتفصيل *</label><textarea id="customerAddress" placeholder="المنطقة، الشارع، رقم العقار، الدور، علامة مميزة"></textarea></div><div class="field"><label>موقع التوصيل *</label><input id="customerLocation" readonly></div><button class="btn secondary" type="button" onclick="setLocationNow()">📍 تحديد موقعي</button><p id="msg" class="msg"></p></div><div class="card"><h2>مراجعة السلة</h2><div id="items"></div><div id="summary" class="summary"></div></div><button id="continueBtn" class="btn primary" onclick="continueToPayment()">متابعة إلى الدفع 💳</button></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyBN-MtgWLi0lwBPTzEPYrpwxNe6BCn_3KQ',authDomain:'mandoub-dv.firebaseapp.com',projectId:'mandoub-dv',storageBucket:'mandoub-dv.firebasestorage.app',messagingSenderId:'311140400335',appId:'1:311140400335:web:db198b7c53259c53594bba',measurementId:'G-7V1LJQYYXD'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);window.backToRestaurant=()=>{try{const c=JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]');if(c[0]?.restaurantId){window.location.href='restaurant-menu.html?id='+encodeURIComponent(c[0].restaurantId);return}}catch{}window.location.href='restaurants.html'};let user=null;onAuthStateChanged(auth,async u=>{user=u;if(!u){document.getElementById('msg').textContent='❌ لازم تسجيل الدخول أولاً لإتمام الطلب.';document.getElementById('continueBtn').disabled=true;document.getElementById('continueBtn').textContent='تسجيل الدخول';document.getElementById('continueBtn').onclick=()=>window.location.href='login.html?return=checkout.html';return}try{const s=await getDoc(doc(db,'customers',u.uid));if(s.exists()){const d=s.data();document.getElementById('customerName').value=d.name||u.displayName||'';document.getElementById('customerPhone').value=d.phone||'';document.getElementById('customerAddress').value=d.address||''}}catch(e){console.error(e)}render()});function cart(){try{return JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]')}catch{return[]}}function coords(){try{return JSON.parse(localStorage.getItem('mandoub_location_coords')||'null')}catch{return null}}function fee(km){if(km<=3)return 25;if(km<=5)return 30;if(km<=7)return 35;if(km<=9)return 45;if(km<=15)return 55;return -1}function dist(a,b){const R=6371,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLon=(b.lng-a.lng)*r,x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}async function render(){const c=cart(),items=document.getElementById('items'),sum=document.getElementById('summary');if(!c.length){items.innerHTML='<p>السلة فارغة.</p>';document.getElementById('continueBtn').disabled=true;return}items.innerHTML=c.map(x=>`<div class="item"><span>${x.name} × ${x.quantity}</span><b>${(x.price*x.quantity).toLocaleString('ar-EG')} ج</b></div>`).join('');let subtotal=c.reduce((s,x)=>s+x.price*x.quantity,0),r=coords(),restaurant=null;try{restaurant=(await getDoc(doc(db,'restaurants',c[0].restaurantId))).data()}catch{}let km=null,delivery=null;if(r&&restaurant?.latitude&&restaurant?.longitude){km=dist(r,{lat:Number(restaurant.latitude),lng:Number(restaurant.longitude)});delivery=fee(km)}localStorage.setItem('mandoub_checkout_draft',JSON.stringify({restaurantId:c[0].restaurantId,restaurantName:c[0].restaurantName,subtotal,deliveryFee:delivery,distanceKm:km,location:localStorage.getItem('mandoub_location')||'',latitude:r?.lat||null,longitude:r?.lng||null}));sum.innerHTML=`<div><span>سعر المنتجات</span><b>${subtotal.toLocaleString('ar-EG')} ج</b></div><div><span>المسافة</span><b>${km==null?'—':km.toFixed(2)+' كم'}</b></div><div><span>رسوم التوصيل</span><b>${delivery==null?'حدد موقعك':delivery<0?'خارج النطاق':delivery+' ج'}</b></div><div class="grand"><span>الإجمالي قبل الخصم</span><b>${delivery>0?(subtotal+delivery).toLocaleString('ar-EG'):subtotal.toLocaleString('ar-EG')} ج</b></div>`;document.getElementById('customerLocation').value=localStorage.getItem('mandoub_location')||'';if(delivery===-1)document.getElementById('continueBtn').disabled=true}window.setLocationNow=function(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(async p=>{localStorage.setItem('mandoub_location_coords',JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude}));localStorage.setItem('mandoub_location',`${p.coords.latitude}, ${p.coords.longitude}`);document.getElementById('customerLocation').value=localStorage.getItem('mandoub_location');try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.coords.latitude}&lon=${p.coords.longitude}&accept-language=ar`),d=await r.json();if(d.display_name){localStorage.setItem('mandoub_location',d.display_name);document.getElementById('customerLocation').value=d.display_name}}catch{}render()},()=>document.getElementById('msg').textContent='❌ اسمح بالوصول للموقع أولاً',{enableHighAccuracy:true,timeout:15000})};window.continueToPayment=function(){const name=document.getElementById('customerName').value.trim(),phone=document.getElementById('customerPhone').value.trim(),address=document.getElementById('customerAddress').value.trim(),addressLocation=document.getElementById('customerLocation').value.trim();if(!name||!phone||!address||!addressLocation){document.getElementById('msg').textContent='❌ الاسم ورقم الهاتف والعنوان والموقع كلها مطلوبة.';return}const draft=JSON.parse(localStorage.getItem('mandoub_checkout_draft')||'{}');if(!draft.deliveryFee||draft.deliveryFee<0){document.getElementById('msg').textContent='❌ حدد موقعك وتأكد أن المطعم داخل نطاق التوصيل.';return}localStorage.setItem('mandoub_customer_data',JSON.stringify({name,phone,address,location:addressLocation}));window.location.href='payment.html'};</script></body></html>
