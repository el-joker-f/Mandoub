<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | بيانات الطلب</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#020d18;color:#fff}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:22px;margin:16px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#91a4b3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:13px;border-radius:12px;border:2px solid #21445f;background:#031321;color:#fff}.field textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:#00dfff;color:#00131e;width:100%}.secondary{background:#123650;color:#fff}.summary div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #16415e}.summary .grand{font-size:20px;border:0}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #16415e}.msg{color:#ff7180;line-height:1.8}.saved{background:#09283d;border-radius:12px;padding:12px;margin-bottom:14px}.address-list{display:grid;gap:8px}.address{border:1px solid #21445f;background:#031321;color:#fff;padding:12px;border-radius:12px;text-align:right;cursor:pointer}.address.active{border-color:#00dfff}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h1>📦 بيانات الطلب</h1><button class="btn secondary" onclick="backToRestaurant()">🛒 السلة</button></div><p class="muted">بياناتك محفوظة في حسابك، ولن تحتاج لكتابتها من جديد في كل طلب.</p><div class="card"><h2>👤 بيانات العميل</h2><div id="savedAddresses" class="saved" style="display:none"><b>📍 عناوينك المحفوظة</b><div id="addressList" class="address-list" style="margin-top:10px"></div></div><div class="grid"><div class="field"><label>الاسم *</label><input id="customerName" autocomplete="name"></div><div class="field"><label>رقم الهاتف *</label><input id="customerPhone" type="tel" autocomplete="tel"></div></div><div class="field"><label>العنوان بالتفصيل *</label><textarea id="customerAddress" placeholder="المنطقة، الشارع، رقم العقار، الدور، علامة مميزة"></textarea></div><div class="field"><label>موقع التوصيل *</label><input id="customerLocation" readonly></div><button class="btn secondary" type="button" onclick="setLocationNow()">📍 تحديد موقعي</button><p id="msg" class="msg"></p></div><div class="card"><h2>مراجعة السلة</h2><div id="items"></div><div id="summary" class="summary"></div></div><button id="continueBtn" class="btn primary" onclick="continueToPayment()">متابعة إلى الدفع 💳</button></div><script type="module">import{auth,authReady,db}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';window.backToRestaurant=()=>{try{const c=JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]');if(c[0]?.restaurantId){location.href='restaurant-menu.html?id='+encodeURIComponent(c[0].restaurantId);return}}catch{}location.href='restaurants.html'};const $=id=>document.getElementById(id);let user=null,profile={};function cart(){try{return JSON.parse(localStorage.getItem('mandoub_cart_v2')||'[]')}catch{return[]}}function coords(){try{return JSON.parse(localStorage.getItem('mandoub_location_coords')||'null')}catch{return null}}function fee(km){if(km<=3)return 25;if(km<=5)return 30;if(km<=7)return 35;if(km<=9)return 45;if(km<=15)return 55;return 60+(Math.ceil(km-15)*3)}function dist(a,b){const R=6371,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLon=(b.lng-a.lng)*r,x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}function renderAddresses(){const a=profile.addresses||[];if(!a.length){$('savedAddresses').style.display='none';return}$('savedAddresses').style.display='block';$('addressList').innerHTML=a.map((x,i)=>`<button class="address" onclick="useAddress(${i})">📍 ${String(x.label||x.address||'عنوان').replace(/[&<>]/g,'')}<br><small>${String(x.address||'')}</small></button>`).join('')}window.useAddress=i=>{const a=profile.addresses?.[i];if(!a)return;$('customerAddress').value=a.address||'';$('customerLocation').value=a.location||'';if(a.lat&&a.lng)localStorage.setItem('mandoub_location_coords',JSON.stringify({lat:a.lat,lng:a.lng}));if(a.location)localStorage.setItem('mandoub_location',a.location);render()};async function loadProfile(u){const s=await getDoc(doc(db,'customers',u.uid));profile=s.exists()?s.data():{};$('customerName').value=profile.name||u.displayName||'';$('customerPhone').value=profile.phone||'';renderAddresses()}async function render(){const c=cart();if(!c.length){$('items').innerHTML='<p>السلة فارغة.</p>';$('continueBtn').disabled=true;return}$('items').innerHTML=c.map(x=>`<div class="item"><span>${String(x.name).replace(/[&<>]/g,'')} × ${x.quantity}</span><b>${(x.price*x.quantity).toLocaleString('ar-EG')} ج</b></div>`).join('');const subtotal=c.reduce((s,x)=>s+x.price*x.quantity,0),r=coords();let km=null,delivery=null,restaurant=null;try{const s=await getDoc(doc(db,'restaurants',c[0].restaurantId));if(s.exists())restaurant=s.data()}catch{}if(r&&restaurant?.latitude&&restaurant?.longitude){km=dist(r,{lat:Number(restaurant.latitude),lng:Number(restaurant.longitude)});delivery=fee(km)}localStorage.setItem('mandoub_checkout_draft',JSON.stringify({restaurantId:c[0].restaurantId,restaurantName:c[0].restaurantName,subtotal,deliveryFee:delivery,distanceKm:km,location:localStorage.getItem('mandoub_location')||'',latitude:r?.lat||null,longitude:r?.lng||null}));$('summary').innerHTML=`<div><span>سعر المنتجات</span><b>${subtotal.toLocaleString('ar-EG')} ج</b></div><div><span>المسافة</span><b>${km==null?'—':km.toFixed(2)+' كم'}</b></div><div><span>رسوم التوصيل</span><b>${delivery==null?'حدد موقعك':delivery+' ج'}</b></div><div class="grand"><span>الإجمالي</span><b>${(subtotal+(delivery||0)).toLocaleString('ar-EG')} ج</b></div>`;$('customerLocation').value=localStorage.getItem('mandoub_location')||$('customerLocation').value}window.setLocationNow=()=>{if(!navigator.geolocation)return;$('msg').textContent='⏳ جاري تحديد الموقع...';navigator.geolocation.getCurrentPosition(async p=>{localStorage.setItem('mandoub_location_coords',JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude}));localStorage.setItem('mandoub_location',`${p.coords.latitude}, ${p.coords.longitude}`);$('customerLocation').value=localStorage.getItem('mandoub_location');try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.coords.latitude}&lon=${p.coords.longitude}&accept-language=ar`),d=await r.json();if(d.display_name){localStorage.setItem('mandoub_location',d.display_name);$('customerLocation').value=d.display_name}}catch{}$('msg').textContent='';render()},()=>$('msg').textContent='❌ اسمح بالوصول للموقع أولاً',{enableHighAccuracy:true,timeout:15000})};window.continueToPayment=async()=>{if(!user)return;$('msg').textContent='';const name=$('customerName').value.trim(),phone=$('customerPhone').value.trim(),address=$('customerAddress').value.trim(),locationText=$('customerLocation').value.trim();if(!name||!phone||!address||!locationText){$('msg').textContent='❌ الاسم ورقم الهاتف والعنوان والموقع كلها مطلوبة.';return}const draft=JSON.parse(localStorage.getItem('mandoub_checkout_draft')||'{}');if(draft.deliveryFee==null){$('msg').textContent='❌ حدد موقعك وتأكد من حساب رسوم التوصيل.';return}try{const old=Array.isArray(profile.addresses)?profile.addresses:[],coordsNow=coords(),entry={label:address.split('،')[0].slice(0,35)||'العنوان',address,location:locationText,lat:coordsNow?.lat||null,lng:coordsNow?.lng||null};const same=old.filter(x=>x.address!==address);await setDoc(doc(db,'customers',user.uid),{uid:user.uid,name,phone,email:user.email||'',addresses:[entry,...same].slice(0,5),lastAddress:entry,updatedAt:serverTimestamp()},{merge:true});localStorage.setItem('mandoub_customer_data',JSON.stringify({name,phone,address,location:locationText}));location.href='payment-new.html'}catch(e){console.error(e);$('msg').textContent='❌ تعذر حفظ بيانات الحساب. '+(e.message||'')}};async function init(){await authReady;user=auth.currentUser;if(!user)await new Promise(resolve=>{let done=false;const unsub=onAuthStateChanged(auth,u=>{if(u){user=u;done=true;unsub();resolve()}else if(!done)setTimeout(()=>{if(!done){unsub();resolve()}},3000)})});if(!user){$('msg').textContent='❌ يجب تسجيل الدخول لإتمام الطلب.';const b=$('continueBtn');b.textContent='تسجيل الدخول';b.onclick=()=>location.href='login.html?return=checkout.html';return}try{await loadProfile(user)}catch(e){console.error(e)}await render()}init();</script></body></html>
