<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>مندوب | تسجيل الدخول</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#020d18;
  color:#fff;
  min-height:100vh;
  padding:25px 15px 50px;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
}

.logo{
  text-align:center;
  margin:10px 0 25px;
}

.logo img{
  width:75px;
  height:75px;
  object-fit:contain;
}

.logo h1{
  color:#00dfff;
  font-size:25px;
  margin-top:8px;
}

.logo p{
  color:#9badbd;
  margin-top:8px;
}

.auth-box{
  background:#061a2d;
  border:1px solid #16415e;
  border-radius:25px;
  padding:25px;
  box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  background:#021321;
  padding:6px;
  border-radius:18px;
  margin-bottom:25px;
}

.tab{
  border:0;
  border-radius:14px;
  padding:16px 10px;
  background:transparent;
  color:#8295a6;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  background:#00dfff;
  color:#00131e;
}

.message{
  display:none;
  padding:15px;
  border-radius:15px;
  margin-bottom:20px;
  text-align:center;
  font-weight:bold;
  line-height:1.7;
}

.message.error{
  display:block;
  background:#481527;
  border:1px solid #b92859;
  color:#ff8eae;
}

.message.success{
  display:block;
  background:#073d30;
  border:1px solid #16a879;
  color:#5df0bb;
}

.form-title{
  font-size:27px;
  margin-bottom:8px;
}

.form-description{
  color:#94a8b8;
  line-height:1.8;
  margin-bottom:25px;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  color:#aab9c7;
  margin-bottom:8px;
  font-size:15px;
}

.input-box{
  position:relative;
}

.field input{
  width:100%;
  height:58px;
  background:#031321;
  border:2px solid #21445f;
  border-radius:16px;
  padding:0 17px;
  color:#fff;
  font-size:16px;
  outline:none;
}

.field input:focus{
  border-color:#00dfff;
}

.password-input{
  padding-left:65px !important;
}

.eye{
  position:absolute;
  left:7px;
  top:7px;
  width:48px;
  height:44px;
  border:0;
  border-radius:13px;
  background:#12344d;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.primary{
  width:100%;
  height:60px;
  border:0;
  border-radius:17px;
  background:#00dfff;
  color:#00131e;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
  margin-top:5px;
}

.primary:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.back{
  display:block;
  text-align:center;
  color:#00dfff;
  text-decoration:none;
  margin-top:20px;
}

.hidden{
  display:none;
}

@media(max-width:500px){

  body{
    padding:15px 10px 40px;
  }

  .auth-box{
    padding:18px;
    border-radius:20px;
  }

  .form-title{
    font-size:24px;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="logo">

    <img
      src="assets/logo.png"
      alt="مندوب">

    <h1>مندوب</h1>

    <p>
      اطلب أكلك بسهولة من أفضل المطاعم
    </p>

  </div>


  <div class="auth-box">

    <!-- TABS -->

    <div class="tabs">

      <button
        class="tab active"
        id="registerTab"
        onclick="showRegister()">

        إنشاء حساب

      </button>


      <button
        class="tab"
        id="loginTab"
        onclick="showLogin()">

        تسجيل الدخول

      </button>

    </div>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message">
    </div>


    <!-- ================= REGISTER ================= -->

    <div id="registerForm">

      <h2 class="form-title">
        إنشاء حساب جديد 📝
      </h2>

      <p class="form-description">
        أنشئ حسابك الآن وابدأ طلباتك بسهولة.
      </p>


      <div class="field">

        <label>
          الاسم
        </label>

        <input
          id="registerName"
          type="text"
          placeholder="اكتب اسمك"
          autocomplete="name">

      </div>


      <div class="field">

        <label>
          البريد الإلكتروني
        </label>

        <input
          id="registerEmail"
          type="email"
          placeholder="example@gmail.com"
          autocomplete="email">

      </div>


      <div class="field">

        <label>
          كلمة المرور
        </label>

        <div class="input-box">

          <input
            id="registerPassword"
            class="password-input"
            type="password"
            placeholder="6 أحرف على الأقل"
            autocomplete="new-password">

          <button
            type="button"
            class="eye"
            onclick="togglePassword('registerPassword',this)">

            👁️

          </button>

        </div>

      </div>


      <div class="field">

        <label>
          تأكيد كلمة المرور
        </label>

        <div class="input-box">

          <input
            id="registerConfirm"
            class="password-input"
            type="password"
            placeholder="أعد كتابة كلمة المرور"
            autocomplete="new-password">

          <button
            type="button"
            class="eye"
            onclick="togglePassword('registerConfirm',this)">

            👁️

          </button>

        </div>

      </div>


      <button
        id="registerButton"
        class="primary"
        onclick="registerUser()">

        إنشاء الحساب

      </button>

    </div>


    <!-- ================= LOGIN ================= -->

    <div
      id="loginForm"
      class="hidden">

      <h2 class="form-title">
        تسجيل الدخول 👋
      </h2>

      <p class="form-description">
        سجل دخولك للمتابعة وطلب الطعام.
      </p>


      <div class="field">

        <label>
          البريد الإلكتروني
        </label>

        <input
          id="loginEmail"
          type="email"
          placeholder="example@gmail.com"
          autocomplete="email">

      </div>


      <div class="field">

        <label>
          كلمة المرور
        </label>

        <div class="input-box">

          <input
            id="loginPassword"
            class="password-input"
            type="password"
            placeholder="كلمة المرور"
            autocomplete="current-password">

          <button
            type="button"
            class="eye"
            onclick="togglePassword('loginPassword',this)">

            👁️

          </button>

        </div>

      </div>


      <button
        id="loginButton"
        class="primary"
        onclick="loginUser()">

        تسجيل الدخول

      </button>


      <a
        href="#"
        class="back"
        onclick="forgotPassword();return false;">

        نسيت كلمة المرور؟

      </a>

    </div>


    <a
      href="index.html"
      class="back">

      ← العودة للرئيسية

    </a>

  </div>

</div>


<!-- =====================================================
     FIREBASE AUTH
===================================================== -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyB6-RVH7-8NrN-AaOOv6QjL9APDeyj7oIU",

  authDomain:
    "mandoub-dv.firebaseapp.com",

  projectId:
    "mandoub-dv",

  storageBucket:
    "mandoub-dv.firebasestorage.app",

  messagingSenderId:
    "311140400335",

  appId:
    "1:311140400335:web:db198b7c53259c53594bba",

  measurementId:
    "G-7V1LJQYYXD"

};


/* ================= INITIALIZE ================= */

const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* ================= MESSAGE ================= */

function showMessage(text,type="error"){

  const box =
    document.getElementById("message");

  box.textContent =
    text;

  box.className =
    "message " + type;

}


/* ================= REGISTER ================= */

window.registerUser =
async function(){

  const name =
    document.getElementById(
      "registerName"
    ).value.trim();


  const email =
    document.getElementById(
      "registerEmail"
    ).value.trim();


  const password =
    document.getElementById(
      "registerPassword"
    ).value;


  const confirmPassword =
    document.getElementById(
      "registerConfirm"
    ).value;


  const button =
    document.getElementById(
      "registerButton"
    );


  /* VALIDATION */

  if(!name){

    showMessage(
      "❌ اكتب اسمك أولاً"
    );

    return;

  }


  if(!email){

    showMessage(
      "❌ اكتب البريد الإلكتروني"
    );

    return;

  }


  if(password.length < 6){

    showMessage(
      "❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل"
    );

    return;

  }


  if(password !== confirmPassword){

    showMessage(
      "❌ كلمتا المرور غير متطابقتين"
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "⏳ جاري إنشاء الحساب...";


  try{

    /* CREATE FIREBASE ACCOUNT */

    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user =
      result.user;


    /* SAVE NAME */

    await updateProfile(
      user,
      {
        displayName:name
      }
    );


    /* SAVE CUSTOMER DATA */

    try{

      await setDoc(
        doc(
          db,
          "customers",
          user.uid
        ),
        {

          uid:user.uid,

          name:name,

          email:email,

          createdAt:
            serverTimestamp()

        }
      );

    }catch(error){

      console.log(
        "Customer profile save error:",
        error
      );

    }


    showMessage(
      "✅ تم إنشاء الحساب بنجاح، جاري الدخول...",
      "success"
    );


    setTimeout(()=>{

      window.location.href =
        "index.html";

    },1200);


  }catch(error){

    console.error(
      "REGISTER ERROR:",
      error
    );


    showMessage(
      firebaseError(error)
    );


    button.disabled =
      false;

    button.textContent =
      "إنشاء الحساب";

  }

};


/* ================= LOGIN ================= */

window.loginUser =
async function(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();


  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  const button =
    document.getElementById(
      "loginButton"
    );


  if(!email){

    showMessage(
      "❌ اكتب البريد الإلكتروني"
    );

    return;

  }


  if(!password){

    showMessage(
      "❌ اكتب كلمة المرور"
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "⏳ جاري تسجيل الدخول...";


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    showMessage(
      "✅ تم تسجيل الدخول بنجاح",
      "success"
    );


    setTimeout(()=>{

      window.location.href =
        "index.html";

    },800);


  }catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );


    showMessage(
      firebaseError(error)
    );


    button.disabled =
      false;

    button.textContent =
      "تسجيل الدخول";

  }

};


/* ================= FORGOT PASSWORD ================= */

window.forgotPassword =
async function(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();


  if(!email){

    showMessage(
      "❌ اكتب البريد الإلكتروني أولاً"
    );

    return;

  }


  try{

    await sendPasswordResetEmail(
      auth,
      email
    );


    showMessage(
      "✅ تم إرسال رابط تغيير كلمة المرور إلى بريدك",
      "success"
    );


  }catch(error){

    console.error(
      error
    );


    showMessage(
      firebaseError(error)
    );

  }

};


/* ================= FIREBASE ERRORS ================= */

function firebaseError(error){

  const code =
    error?.code || "";


  switch(code){

    case "auth/email-already-in-use":
      return "❌ البريد الإلكتروني مستخدم بالفعل";

    case "auth/invalid-email":
      return "❌ البريد الإلكتروني غير صحيح";

    case "auth/weak-password":
      return "❌ كلمة المرور ضعيفة، استخدم 6 أحرف أو أكثر";

    case "auth/invalid-credential":
      return "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة";

    case "auth/user-not-found":
      return "❌ الحساب غير موجود";

    case "auth/wrong-password":
      return "❌ كلمة المرور غير صحيحة";

    case "auth/too-many-requests":
      return "❌ محاولات كثيرة، حاول بعد قليل";

    case "auth/network-request-failed":
      return "❌ تحقق من اتصال الإنترنت";

    case "auth/operation-not-allowed":
      return "❌ تسجيل الدخول بالبريد الإلكتروني غير مفعّل في Firebase";

    default:
      return "❌ حدث خطأ: " + (error?.message || "حاول مرة أخرى");

  }

}

</script>


<script>

/* ================= TABS ================= */

function showRegister(){

  document
    .getElementById("registerForm")
    .classList.remove("hidden");


  document
    .getElementById("loginForm")
    .classList.add("hidden");


  document
    .getElementById("registerTab")
    .classList.add("active");


  document
    .getElementById("loginTab")
    .classList.remove("active");


  document
    .getElementById("message")
    .className="message";

}


function showLogin(){

  document
    .getElementById("registerForm")
    .classList.add("hidden");


  document
    .getElementById("loginForm")
    .classList.remove("hidden");


  document
    .getElementById("registerTab")
    .classList.remove("active");


  document
    .getElementById("loginTab")
    .classList.add("active");


  document
    .getElementById("message")
    .className="message";

}


function togglePassword(id,button){

  const input =
    document.getElementById(id);


  if(input.type === "password"){

    input.type =
      "text";

    button.textContent =
      "🙈";

  }else{

    input.type =
      "password";

    button.textContent =
      "👁️";

  }

}

</script>

</body>
</html>
