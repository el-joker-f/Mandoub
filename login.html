<body>

          نسيت كلمة المرور؟

      </section>


      <!-- إنشاء حساب -->

      <section id="registerForm" class="hidden">

        <h2 class="form-title">
          إنشاء حساب 📝
        </h2>

        <p class="form-description">
          أنشئ حسابك الآن وابدأ طلب الطعام بسهولة.
        </p>

        <div class="field">

          <label for="registerName">
            الاسم
          </label>

          <input
            id="registerName"
            type="text"

            placeholder="اكتب اسمك"
          >

        <div class="field">

          <label for="registerEmail">

          </label>

          <input

  <script type="module">
    import { routeAfterLogin } from "./auth.js";

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged,
      signOut
    } from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    /* =====================================================
       FIREBASE CONFIG
       مهم: ده الـ CONFIG الوحيد في الصفحة
    ===================================================== */

    const firebaseConfig = {
      apiKey: "AIzaSyB6-RVH7-8NrN-AaOOv6QjL9APDeyj7oIU",
      authDomain: "mandoub-dv.firebaseapp.com",
      projectId: "mandoub-dv",
      storageBucket: "mandoub-dv.firebasestorage.app",
      messagingSenderId: "311140400335",
      appId: "1:311140400335:web:db198b7c53259c53594bba",
      measurementId: "G-7V1LJQYYXD"
    };


    /* =====================================================
       INITIALIZE FIREBASE
    ===================================================== */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    window.firebaseApp = app;
    window.firebaseAuth = auth;
    window.firebaseDB = db;
    window.firebaseReady = true;


    console.log("Firebase متصل بنجاح ✅");


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const loginTab =
      document.getElementById("loginTab");

    const registerTab =
      document.getElementById("registerTab");

    const loginForm =
      document.getElementById("loginForm");

    const registerForm =
      document.getElementById("registerForm");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");

    const registerButton =
      document.getElementById("registerButton");

    const forgotButton =
      document.getElementById("forgotButton");


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showMessage(text, type = "info") {

      message.textContent = text;

      message.className =
        "message show " + type;
    }


    function hideMessage() {

      message.textContent = "";

      message.className = "message";
    }


    /* =====================================================
       TABS
    ===================================================== */

    loginTab.addEventListener("click", () => {

      loginTab.classList.add("active");

      registerTab.classList.remove("active");

      loginForm.classList.remove("hidden");

      registerForm.classList.add("hidden");

      hideMessage();

    });


    registerTab.addEventListener("click", () => {

      registerTab.classList.add("active");

      loginTab.classList.remove("active");

      registerForm.classList.remove("hidden");

      loginForm.classList.add("hidden");

      hideMessage();

    });


    /* =====================================================
       LOGIN
    ===================================================== */

    loginButton.addEventListener("click", async () => {

      const email =
        document.getElementById("loginEmail")
          .value.trim();

      const password =
        document.getElementById("loginPassword")
          .value;


      if (!email || !password) {

        showMessage(
          "من فضلك اكتب البريد الإلكتروني وكلمة المرور.",
          "error"
        );

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "جاري تسجيل الدخول...";


      try {

        const result =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        console.log(
          "تم تسجيل الدخول:",
          result.user.uid
        );


        showMessage(
          "تم تسجيل الدخول بنجاح ✅",
          "success"
        );


        setTimeout(async () => {
          await routeAfterLogin(result.user);
        }, 800);


      } catch (error) {

        console.error(
          "Firebase Login Error:",
          error
        );


        let text =
          "حدث خطأ أثناء تسجيل الدخول.";


        if (
          error.code ===
          "auth/invalid-credential" ||
          error.code ===
          "auth/wrong-password" ||
          error.code ===
          "auth/user-not-found"
        ) {

          text =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        }

        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          text =
            "البريد الإلكتروني غير صحيح.";

        }

        else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          text =
            "تم إجراء محاولات كثيرة. حاول مرة أخرى لاحقًا.";

        }

        else if (
          error.code ===
          "auth/api-key-not-valid"
        ) {

          text =
            "مفتاح Firebase API غير صالح. تأكد من إعدادات المشروع.";

        }

        else {

          text =
            "Firebase: " +
            (error.message || error.code);

        }


        showMessage(
          text,
          "error"
        );


      } finally {

        loginButton.disabled = false;

        loginButton.textContent =
          "تسجيل الدخول";

      }

    });


    /* =====================================================
       REGISTER
    ===================================================== */

    registerButton.addEventListener(
      "click",
      async () => {

        const name =
          document.getElementById("registerName")
            .value.trim();

        const email =
          document.getElementById("registerEmail")
            .value.trim();

        const password =
          document.getElementById("registerPassword")
            .value;


        if (!name) {

          showMessage(
            "اكتب اسمك أولًا.",
            "error"
          );

          return;
        }


        if (!email) {

          showMessage(
            "اكتب البريد الإلكتروني.",
            "error"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
            "error"
          );

          return;
        }


        if (!/\d/.test(password)) {

          showMessage(
            "كلمة المرور يجب أن تحتوي على رقم.",
            "error"
          );

          return;
        }


        registerButton.disabled = true;

        registerButton.textContent =
          "جاري إنشاء الحساب...";


        try {

          const result =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            result.user;


          /* حفظ بيانات العميل في Firestore */

          await setDoc(
            doc(
              db,
              "customers",
              user.uid
            ),
            {
              uid: user.uid,
              name: name,
              email: email,
              active: true,
              createdAt: serverTimestamp()
            },
            {
              merge: true
            }
          );


          showMessage(
            "تم إنشاء الحساب بنجاح ✅",
            "success"
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 800);


        } catch (error) {

          console.error(
            "Firebase Register Error:",
            error
          );


          let text =
            "حدث خطأ أثناء إنشاء الحساب.";


          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            text =
              "هذا البريد الإلكتروني مستخدم بالفعل.";

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            text =
              "البريد الإلكتروني غير صحيح.";

          }

          else if (
            error.code ===
            "auth/weak-password"
          ) {

            text =
              "كلمة المرور ضعيفة.";

          }

          else if (
            error.code ===
            "auth/api-key-not-valid"
          ) {

            text =
              "مفتاح Firebase API غير صالح.";

          }

          else {

            text =
              "Firebase: " +
              (error.message || error.code);

          }


          showMessage(
            text,
            "error"
          );


        } finally {

          registerButton.disabled = false;

          registerButton.textContent =
            "إنشاء الحساب";

        }

      }
    );


    /* =====================================================
       FORGOT PASSWORD
    ===================================================== */

    forgotButton.addEventListener(
      "click",
      async () => {

        const email =
          document.getElementById("loginEmail")
            .value.trim();


        if (!email) {

          showMessage(
            "اكتب البريد الإلكتروني أولًا.",
            "error"
          );

          return;
        }


        forgotButton.disabled = true;

        forgotButton.textContent =
          "جاري الإرسال...";


        try {

          await sendPasswordResetEmail(
            auth,
            email
          );


          showMessage(
            "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني ✅",
            "success"
          );


        } catch (error) {

          console.error(
            "Password Reset Error:",
            error
          );


          showMessage(
            "تعذر إرسال رابط إعادة تعيين كلمة المرور.",
            "error"
          );


        } finally {

          forgotButton.disabled = false;

          forgotButton.textContent =
            "نسيت كلمة المرور؟";

        }

      }
    );


    /* =====================================================
       AUTH STATE
    ===================================================== */

    onAuthStateChanged(
      auth,
      (user) => {

        if (user) {

          console.log(
            "المستخدم الحالي:",
            user.email
          );

        }

      }
    );


    /* =====================================================
       PASSWORD STRENGTH
    ===================================================== */

    const registerPassword =
      document.getElementById(
        "registerPassword"
      );

    const ruleLength =
      document.getElementById(
        "ruleLength"
      );

    const ruleNumber =
      document.getElementById(
        "ruleNumber"
      );

    const strengthBar =
      document.getElementById(
        "strengthBar"
      );


    registerPassword.addEventListener(
      "input",
      () => {

        const value =
          registerPassword.value;


        const lengthOK =
          value.length >= 6;

        const numberOK =
          /\d/.test(value);


        ruleLength.textContent =
          lengthOK
            ? "✅ 6 أحرف على الأقل"
            : "❌ 6 أحرف على الأقل";


        ruleNumber.textContent =
          numberOK
            ? "✅ تحتوي على رقم"
            : "❌ تحتوي على رقم";


        ruleLength.classList.toggle(
          "ok",
          lengthOK
        );


        ruleNumber.classList.toggle(
          "ok",
          numberOK
        );


        let strength = 0;


        if (value.length >= 6)
          strength += 50;

        if (numberOK)
          strength += 50;


        strengthBar.style.width =
          strength + "%";

      }
    );


    /* =====================================================
       PASSWORD VISIBILITY
    ===================================================== */

    window.togglePassword =
      function(id, button) {

        const input =
          document.getElementById(id);


        if (input.type === "password") {

          input.type = "text";

          button.textContent = "🙈";

        } else {

          input.type = "password";

          button.textContent = "👁️";

        }

      };


  </script>

</body>
</html>
