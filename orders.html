<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>مندوب | طلباتي</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#020d18;color:#fff}.orders-page{max-width:900px;margin:auto;padding:18px 14px 80px}.top{position:sticky;top:0;z-index:20;background:rgba(2,13,27,.96);backdrop-filter:blur(12px);border-bottom:1px solid #16415e;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.top a{padding:9px 13px;border:1px solid #16415e;border-radius:12px;background:#061a2d;color:#fff;text-decoration:none}.top img{width:42px;height:42px;object-fit:contain}.title{text-align:center;margin:22px 0}.title h1{color:#00dfff;margin:5px}.title p,.muted{color:#91a4b3}.order{background:#061a2d;border:1px solid #16415e;border-radius:22px;padding:18px;margin:15px 0;box-shadow:0 10px 28px rgba(0,0,0,.16)}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.order-head h2{margin:0 0 6px}.code{direction:ltr;display:inline-block;background:#031321;border:1px dashed #00dfff;color:#00dfff;border-radius:10px;padding:7px 10px;font-weight:900;letter-spacing:1px}.status{padding:7px 11px;border-radius:12px;background:#123650;color:#fff;font-weight:800}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0}.step{text-align:center;color:#718697;font-size:12px}.dot{height:10px;border-radius:99px;background:#21445f;margin-bottom:7px}.step.done{color:#7ff0a8}.step.done .dot{background:#00dfff}.rows{border-top:1px solid #16415e;margin-top:12px}.row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #16415e}.label{color:#91a4b3}.items{background:#031321;border-radius:13px;padding:10px;margin-top:10px}.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #16415e}.item:last-child{border:0}.total{font-size:20px;color:#00dfff;font-weight:900}.details{margin-top:14px;padding-top:12px;border-top:1px solid #16415e}.loading,.empty,.error{text-align:center;padding:45px;color:#91a4b3}.error{color:#ff7180}.account-button{border:1px solid #16415e;background:#061a2d;color:#fff;border-radius:12px;padding:9px 13px;cursor:pointer}@media(max-width:600px){.order-head{flex-direction:column}.timeline{grid-template-columns:repeat(2,1fr);gap:12px}.row{flex-direction:column;gap:3px}}
</style>
</head>
<body>
<header class="top"><a href="index.html">← الرئيسية</a><a href="index.html"><img src="assets/logo.png" alt="مندوب"></a><button id="account" class="account-button">👤 حسابي</button></header>
<main class="orders-page"><div class="title"><h1>📦 طلباتي</h1><p>كل طلباتك وتفاصيلها وحالة التوصيل في مكان واحد.</p></div><div id="content" class="loading">⏳ جاري تحميل الطلبات...</div></main>
<script type="module">
import{auth,authReady,db}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{collection,query,where,getDocs,orderBy}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ar-EG')+' ج';
function date(v){try{const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'})}catch{return'—'}}
function stepState(s){const map={'جديد':0,'قيد التنفيذ':1,'في الطريق':2,'مكتمل':3};return map[s]??0}
function timeline(s){const n=stepState(s);const labels=['تم استلام الطلب','قيد التنفيذ','في الطريق','تم التسليم'];return `<div class="timeline">${labels.map((x,i)=>`<div class="step ${i<=n?'done':''}"><div class="dot"></div>${x}</div>`).join('')}</div>`}
function payment(x){return ({cash:'كاش',wallet:'محفظة',instapay:'InstaPay'}[x]||x||'—')}
function render(a){if(!a.length){$('content').innerHTML='<div class="empty">📦 لا توجد طلبات حتى الآن.<br><a href="restaurants.html" style="color:#00dfff">ابدأ طلبك الأول ←</a></div>';return}a.sort((x,y)=>(y.createdAt?.toMillis?.()||0)-(x.createdAt?.toMillis?.()||0));$('content').innerHTML=a.map(o=>{const items=(o.items||[]).map(i=>`<div class="item"><span>${esc(i.name||'منتج')} × ${Number(i.quantity||1)}</span><b>${money(Number(i.price||0)*Number(i.quantity||1))}</b></div>`).join('')||'<div class="muted">لا توجد تفاصيل منتجات.</div>';return `<article class="order"><div class="order-head"><div><h2>${esc(o.restaurantName||'طلب مندوب')}</h2><div class="muted">${date(o.createdAt)}</div></div><span class="status">${esc(o.status||'جديد')}</span></div>${o.trackingCode?`<div style="margin-top:12px"><span class="muted">رقم المتابعة:</span> <span class="code">${esc(o.trackingCode)}</span></div>`:''}${timeline(o.status||'جديد')}<div class="rows"><div class="row"><span class="label">رقم الطلب</span><b dir="ltr">#${esc(o.id)}</b></div><div class="row"><span class="label">طريقة الدفع</span><b>${esc(payment(o.paymentMethod))}</b></div><div class="row"><span class="label">حالة الدفع</span><b>${esc(o.paymentStatus||'—')}</b></div><div class="row"><span class="label">العنوان</span><b>${esc(o.customerAddress||'—')}</b></div>${o.assignedDriverName?`<div class="row"><span class="label">الطيار</span><b>🛵 ${esc(o.assignedDriverName)}${o.assignedDriverPhone?' — '+esc(o.assignedDriverPhone):''}</b></div>`:''}</div><div class="details"><b>🛒 المنتجات</b><div class="items">${items}</div><div class="rows"><div class="row"><span class="label">سعر المنتجات</span><b>${money(o.subtotal)}</b></div><div class="row"><span class="label">التوصيل</span><b>${money(o.deliveryFee)}</b></div><div class="row"><span class="label">الإجمالي</span><b class="total">${money(o.total)}</b></div></div></div></article>`}).join('')}
async function load(u){try{const q=query(collection(db,'orders'),where('customerId','==',u.uid),orderBy('createdAt','desc'));const s=await getDocs(q);render(s.docs.map(d=>({id:d.id,...d.data()})))}catch(e){console.error(e);try{const s=await getDocs(query(collection(db,'orders'),where('customerId','==',u.uid)));render(s.docs.map(d=>({id:d.id,...d.data()})))}catch(x){console.error(x);$('content').innerHTML='<div class="error">❌ تعذر تحميل طلباتك. حاول مرة أخرى.</div>'}}}
async function init(){try{await authReady}catch{}onAuthStateChanged(auth,u=>{if(!u){location.replace('login.html?return=orders.html');return}load(u)})}init();
</script>
</body></html>
