<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مندوب | طلباتي</title><style>*{box-sizing:border-box}body{margin:0;background:#020d18;color:#fff;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.navbar{background:#061a2d;border-bottom:1px solid #16415e;display:flex;align-items:center;gap:18px;padding:10px 18px;position:sticky;top:0;z-index:20}.navbar .brand img{width:48px;height:48px}.navbar nav{display:flex;gap:10px;flex:1;overflow:auto}.navbar nav a{color:#ddd;text-decoration:none;padding:9px 12px;border-radius:10px;white-space:nowrap}.navbar nav a.active,.navbar nav a:hover{background:#00dfff;color:#00131e}.account{background:#031321;border:1px solid #21445f;color:#fff;border-radius:10px;padding:9px 12px}.card{background:#061a2d;border:1px solid #16415e;border-radius:20px;padding:18px;margin:15px 0}.order{border:1px solid #16415e;background:#031321;border-radius:18px;padding:16px;margin:12px 0}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.code{font-weight:900;color:#00dfff}.status{display:inline-block;padding:6px 10px;border-radius:12px;background:#073d30;color:#7ff0a8;font-size:13px}.status.cancel{background:#481527;color:#ff8eae}.meta{color:#91a4b3;line-height:1.9;margin:8px 0}.items{margin:10px 0;padding:10px;border-radius:12px;background:#061a2d}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #16415e}.row:last-child{border:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#00dfff;color:#00131e}.secondary{background:#123650;color:#fff}.empty,.loading{text-align:center;padding:45px;color:#91a4b3}.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}.step{font-size:11px;text-align:center;color:#718696}.step b{display:block;width:28px;height:28px;line-height:28px;margin:0 auto 5px;border-radius:50%;background:#123650}.step.done{color:#7ff0a8}.step.done b{background:#00dfff;color:#00131e}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:15px;z-index:100}.modal.show{display:flex}.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:#061a2d;border:1px solid #16415e;border-radius:20px;padding:20px}.close{float:left;border:0;background:#123650;color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}@media(max-width:700px){.navbar nav{display:none}.timeline{grid-template-columns:repeat(3,1fr)}.order-head{align-items:flex-start;flex-direction:column}}</style></head><body><header class="navbar"><a class="brand" href="index.html"><img src="assets/logo.png" alt="مندوب"></a><nav><a href="index.html">الرئيسية</a><a href="restaurants.html">المطاعم</a><a class="active" href="orders.html">طلباتي</a><a href="support.html">دعم ومساعدة</a></nav><button id="account" class="account">👤 حسابي</button></header><main class="wrap"><div class="card"><h1>📦 طلباتي</h1><p style="color:#91a4b3">كل طلباتك في مكان واحد، مع كود المتابعة وحالة الطلب والدفع والطيار.</p></div><div id="message" class="card loading">⏳ جاري تحميل الطلبات...</div><div id="orders"></div></main><div id="modal" class="modal"><div class="modal-card"><button class="close" onclick="closeDetails()">✕</button><h2>تفاصيل الطلب</h2><div id="details"></div></div></div><script type="module">import{auth,authReady,db}from'./auth.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{collection,query,where,getDocs,doc,getDoc,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('ar-EG')+' ج',date=v=>{const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleString('ar-EG')};const steps=['جديد','قيد التجهيز','جاهز','مع الطيار','في الطريق','تم التسليم'];let currentUser=null;function statusText(s){return ({'قيد التنفيذ':'قيد التجهيز','مكتمل':'تم التسليم','ملغي':'ملغي'}[s]||s||'جديد')}function timeline(status){const i=steps.indexOf(status);return `<div class="timeline">${steps.map((x,n)=>`<div class="step ${n<=i&&status!=='ملغي'?'done':''}"><b>${n<=i&&status!=='ملغي'?'✓':n+1}</b>${x}</div>`).join('')}</div>`}function orderCard(o){const code=o.trackingCode||o.id.slice(-8).toUpperCase(),status=statusText(o.status),items=(o.items||[]).map(x=>`${esc(x.name)} × ${Number(x.quantity||1)}`).join('، ')||'لا توجد منتجات';return `<article class="order"><div class="order-head"><div><div class="code">كود المتابعة: ${esc(code)}</div><strong>${esc(o.restaurantName||'الطلب')}</strong></div><span class="status ${status==='ملغي'?'cancel':''}">${esc(status)}</span></div><div class="meta">📅 ${date(o.createdAt)}<br>💳 ${esc(({cash:'كاش',wallet:'محفظة',instapay:'InstaPay'}[o.paymentMethod]||o.paymentMethod||'—'))} — ${esc(o.paymentStatus||'—')}<br>🛵 ${esc(o.assignedDriverName||'لم يتم تعيين طيار بعد')}</div><div class="items">${esc(items)}</div><div class="row"><span>المنتجات</span><b>${money(o.subtotal)}</b></div><div class="row"><span>التوصيل</span><b>${money(o.deliveryFee)}</b></div><div class="row"><span>الإجمالي</span><b>${money(o.total||o.totalPrice)}</b></div>${timeline(status)}<div class="actions" style="margin-top:12px"><button class="btn primary" onclick="openDetails('${o.id}')">👁️ التفاصيل والمتابعة</button>${status==='تم التسليم'?`<button class="btn secondary" onclick="rateOrder('${o.id}','${esc(o.restaurantId||'')}')">⭐ تقييم</button><button class="btn secondary" onclick="reorder('${o.id}')">🔁 إعادة الطلب</button>`:''}</div></article>`}async function load(){if(!currentUser)return;try{const q=query(collection(db,'orders'),where('customerId','==',currentUser.uid));const s=await getDocs(q);const a=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));$('message').style.display='none';$('orders').innerHTML=a.length?a.map(orderCard).join(''):'<div class="card empty">لا توجد طلبات حتى الآن.<br><br><a class="btn primary" href="restaurants.html">🍔 ابدأ أول طلب</a></div>';const open=new URLSearchParams(location.search).get('open');if(open&&a.some(x=>x.id===open))setTimeout(()=>openDetails(open),150)}catch(e){console.error(e);$('message').textContent='❌ تعذر تحميل الطلبات. تأكد من نشر قواعد Firestore الجديدة.'}}window.openDetails=async id=>{try{const s=await getDoc(doc(db,'orders',id));if(!s.exists())return;const o={id:s.id,...s.data()},st=statusText(o.status);$('details').innerHTML=`<div class="meta">كود المتابعة: <strong class="code">${esc(o.trackingCode||o.id.slice(-8).toUpperCase())}</strong><br>المطعم: ${esc(o.restaurantName||'—')}<br>الحالة: ${esc(st)}<br>آخر تحديث: ${date(o.updatedAt||o.createdAt)}<br>الطيار: ${esc(o.assignedDriverName||'لم يتم تعيينه')} ${o.assignedDriverPhone?`— <span dir="ltr">${esc(o.assignedDriverPhone)}</span>`:''}</div>${timeline(st)}<h3>المنتجات</h3><div class="items">${(o.items||[]).map(x=>`<div class="row"><span>${esc(x.name)} × ${Number(x.quantity||1)}</span><b>${money((x.price||0)*(x.quantity||1))}</b></div>`).join('')}</div><div class="row"><span>العنوان</span><b>${esc(o.deliveryAddress?.address||'العنوان المحفوظ في الحساب')}</b></div><div class="row"><span>طريقة الدفع</span><b>${esc(o.paymentMethod||'—')}</b></div><div class="row"><span>حالة الدفع</span><b>${esc(o.paymentStatus||'—')}</b></div><div class="row"><span>الإجمالي</span><b>${money(o.total||o.totalPrice)}</b></div>`;$('modal').classList.add('show')}catch(e){console.error(e)}};window.closeDetails=()=>$('modal').classList.remove('show');window.reorder=async id=>{const s=await getDoc(doc(db,'orders',id));if(!s.exists())return;const o=s.data();localStorage.setItem('mandoub_cart_v2',JSON.stringify((o.items||[]).map(x=>({productId:x.productId,name:x.name,price:x.price,quantity:x.quantity,restaurantId:o.restaurantId,restaurantName:o.restaurantName}))));location.href='restaurant-menu.html?id='+encodeURIComponent(o.restaurantId||'')};window.rateOrder=async(orderId,restaurantId)=>{const rating=Number(prompt('قيّم المطعم من 1 إلى 5:','5')),comment=prompt('تعليقك (اختياري):','')||'';if(!Number.isInteger(rating)||rating<1||rating>5)return;try{await addDoc(collection(db,'ratings'),{orderId,restaurantId,customerId:currentUser.uid,rating,comment,createdAt:serverTimestamp()});alert('شكرًا لتقييمك ⭐')}catch(e){console.error(e);alert('تعذر حفظ التقييم ❌')}};(async()=>{await authReady;onAuthStateChanged(auth,u=>{currentUser=u;if(!u){$('message').textContent='❌ سجل الدخول لعرض طلباتك.';$('account').textContent='👤 تسجيل الدخول';$('account').onclick=()=>location.href='login.html?return=orders.html';return}$('account').onclick=()=>location.href='account.html';load()})})();</script></body></html>
